<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Sports Trading Strategy Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #1d2430;
    --muted: #627083;
    --line: #d8dee8;
    --soft-line: #e9edf3;
    --danger: #b42318;
    --danger-bg: #fff1ef;
    --warn: #9a5b00;
    --warn-bg: #fff7e6;
    --good: #067647;
    --good-bg: #ecfdf3;
    --info: #175cd3;
    --info-bg: #eff6ff;
    --shadow: 0 10px 30px rgba(29, 36, 48, 0.07);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }

  a {
    color: var(--info);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  .page {
    width: min(1440px, calc(100vw - 32px));
    margin: 0 auto;
    padding: 24px 0 40px;
  }

  .topbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 20px;
    align-items: start;
    padding: 24px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .eyebrow {
    margin: 0 0 6px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-size: clamp(28px, 4vw, 44px);
    line-height: 1.05;
  }

  h2 {
    margin: 0;
    font-size: 20px;
  }

  h3 {
    margin: 0;
    font-size: 15px;
  }

  .subtitle {
    max-width: 880px;
    margin: 12px 0 0;
    color: var(--muted);
  }

  .status-stack {
    display: grid;
    gap: 8px;
    justify-items: end;
    min-width: 150px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 28px;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    background: #f9fafb;
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
  }

  .pill.bad {
    border-color: #f1a6a0;
    color: var(--danger);
    background: var(--danger-bg);
  }

  .pill.warn {
    border-color: #f2d28c;
    color: var(--warn);
    background: var(--warn-bg);
  }

  .pill.good {
    border-color: #9bd9b8;
    color: var(--good);
    background: var(--good-bg);
  }

  .pill.info {
    border-color: #b9d3ff;
    color: var(--info);
    background: var(--info-bg);
  }

  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  .muted {
    color: var(--muted);
  }

  .grid {
    display: grid;
    gap: 16px;
  }

  .metrics {
    grid-template-columns: repeat(3, minmax(150px, 1fr));
  }

  .two {
    grid-template-columns: minmax(0, 1.2fr) minmax(360px, 0.8fr);
  }

  .plain-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .band {
    margin-top: 18px;
    padding: 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .section-head {
    display: flex;
    gap: 12px;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .section-head p {
    margin: 5px 0 0;
    color: var(--muted);
  }

  .metric {
    min-width: 0;
    min-height: 118px;
    padding: 14px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .metric-label {
    min-height: 18px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .metric-value {
    margin-top: 8px;
    font-size: 26px;
    font-weight: 850;
    line-height: 1.1;
    word-break: break-word;
  }

  .metric-note {
    margin-top: 8px;
    color: var(--muted);
    font-size: 13px;
  }

  .metric-help {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid var(--soft-line);
    color: var(--ink);
    font-size: 13px;
  }

  .strategy-overview {
    margin-top: 16px;
    padding: 16px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .strategy-evidence-controls {
    display: grid;
    grid-template-columns: minmax(220px, 360px);
    gap: 8px;
    margin-top: 12px;
  }

  .strategy-evidence-controls label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .strategy-evidence-controls select {
    width: 100%;
    min-height: 42px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    font: inherit;
    font-size: 14px;
  }

  .strategy-overview h3 {
    margin: 0 0 12px;
    font-size: 18px;
  }

  .strategy-list {
    display: grid;
    gap: 12px;
  }

  .strategy-grid-head {
    display: grid;
    grid-template-columns: minmax(260px, 1.4fr) repeat(3, minmax(150px, 0.8fr));
    gap: 12px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .strategy-row {
    display: grid;
    grid-template-columns: minmax(260px, 1.4fr) repeat(3, minmax(150px, 0.8fr));
    gap: 12px;
    padding: 14px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fff;
  }

  .strategy-row strong {
    display: block;
    line-height: 1.2;
  }

  .strategy-row-head {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    justify-content: space-between;
  }

  .strategy-copy {
    margin-top: 10px;
    color: var(--muted);
  }

  .strategy-stat {
    min-width: 0;
    padding: 12px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .strategy-stat .metric-value {
    font-size: 22px;
  }

  .strategy-stat .metric-help {
    margin-top: 8px;
    padding-top: 0;
    border-top: 0;
    color: var(--muted);
  }

  .callout {
    padding: 16px;
    border: 1px solid #f1a6a0;
    border-radius: 8px;
    background: var(--danger-bg);
  }

  .callout strong {
    color: var(--danger);
  }

  .copy-list {
    display: grid;
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .copy-list li {
    padding: 10px 12px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .copy-list .bad {
    border-color: #f1a6a0;
    background: var(--danger-bg);
  }

  .copy-list .warn {
    border-color: #f2d28c;
    background: var(--warn-bg);
  }

  .copy-list .good {
    border-color: #9bd9b8;
    background: var(--good-bg);
  }

  .kv {
    display: grid;
    grid-template-columns: minmax(150px, 0.7fr) minmax(0, 1.3fr);
    gap: 8px 12px;
    margin: 0;
  }

  .kv dt {
    color: var(--muted);
    font-weight: 700;
  }

  .kv dd {
    min-width: 0;
    margin: 0;
    word-break: break-word;
  }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
  }

  table {
    width: 100%;
    min-width: 900px;
    border-collapse: collapse;
    background: #fff;
  }

  th,
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--soft-line);
    text-align: left;
    vertical-align: top;
  }

  th {
    color: var(--muted);
    background: #f9fafb;
    font-size: 12px;
    text-transform: uppercase;
  }

  tr:last-child td {
    border-bottom: 0;
  }

  .note {
    margin-top: 12px;
    color: var(--muted);
    font-size: 13px;
  }

  .link-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .link-row a {
    display: inline-flex;
    align-items: center;
    min-height: 30px;
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
  }

  .artifact-grid {
    grid-template-columns: repeat(3, minmax(240px, 1fr));
  }

  .term-grid {
    grid-template-columns: repeat(4, minmax(180px, 1fr));
  }

  .term {
    min-width: 0;
    padding: 12px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .term strong {
    display: block;
    margin-bottom: 5px;
  }

  .artifact {
    min-width: 0;
    padding: 12px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .artifact h3 {
    display: flex;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
  }

  .artifact .path {
    margin-top: 8px;
    color: var(--muted);
    font-size: 12px;
    word-break: break-word;
  }

  .replay-controls {
    display: grid;
    grid-template-columns: minmax(120px, 0.55fr) minmax(150px, 0.7fr) minmax(155px, 0.75fr) minmax(140px, 0.65fr) minmax(220px, 1.25fr) minmax(190px, 1fr) minmax(165px, 0.8fr);
    gap: 12px;
    align-items: end;
    margin-bottom: 14px;
  }

  .replay-filter {
    min-width: 0;
  }

  .replay-controls label {
    display: block;
    margin-bottom: 5px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .replay-controls select {
    width: 100%;
    min-height: 42px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font: inherit;
  }

  .replay-tabs {
    display: inline-flex;
    gap: 4px;
    margin-bottom: 14px;
    padding: 4px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #f9fafb;
  }

  .replay-tab {
    min-height: 34px;
    padding: 6px 12px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 850;
    cursor: pointer;
  }

  .replay-tab.active {
    background: #fff;
    color: var(--ink);
    box-shadow: 0 1px 4px rgba(29, 36, 48, 0.08);
  }

  .replay-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(320px, 0.45fr);
    gap: 18px;
    align-items: stretch;
  }

  .replay-chart-shell {
    min-width: 0;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fff;
    overflow: hidden;
  }

  .chart-toolbar {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--soft-line);
  }

  .chart-title {
    min-width: 0;
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chart-source-note {
    flex: 1 1 auto;
    min-width: 120px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: right;
  }

  .window-buttons {
    display: inline-flex;
    flex: 0 0 auto;
    gap: 4px;
    padding: 3px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #f9fafb;
  }

  .window-button {
    min-width: 46px;
    min-height: 30px;
    padding: 4px 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
  }

  .window-button.active {
    background: #fff;
    color: var(--info);
    box-shadow: 0 1px 4px rgba(29, 36, 48, 0.08);
  }

  .replay-chart {
    display: block;
    width: 100%;
    height: 460px;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }

  .replay-chart.dragging {
    cursor: grabbing;
  }

  .chart-legend {
    display: none;
    flex-wrap: wrap;
    gap: 10px 14px;
    padding: 10px 12px;
    border-top: 1px solid var(--soft-line);
    color: var(--muted);
    font-size: 12px;
  }

  .chart-legend.active {
    display: flex;
  }

  .source-toggles {
    display: none;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 12px 0;
    border-top: 1px solid var(--soft-line);
  }

  .source-toggles.active {
    display: flex;
  }

  .source-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 30px;
    padding: 5px 9px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fff;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
  }

  .source-toggle input {
    margin: 0;
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    font-weight: 700;
  }

  .legend-swatch {
    width: 18px;
    height: 3px;
    border-radius: 999px;
    flex: 0 0 auto;
  }

  .legend-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 5px;
    border-radius: 999px;
    vertical-align: -1px;
  }

  .replay-detail {
    min-width: 0;
    padding: 14px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .replay-detail h3 {
    margin-bottom: 12px;
    font-size: 18px;
    line-height: 1.2;
  }

  .event-strip {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }

  .event-stat {
    min-width: 0;
    padding: 10px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fff;
  }

  .event-stat span {
    display: block;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .event-stat strong {
    display: block;
    margin-top: 4px;
    font-size: 16px;
    line-height: 1.15;
    word-break: break-word;
  }

  .decision-panel {
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }

  .decision-heading {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: start;
    margin-bottom: 10px;
  }

  .decision-heading h4 {
    margin: 0;
    font-size: 18px;
    line-height: 1.15;
  }

  .decision-rationale {
    margin-top: 12px;
    margin-bottom: 12px;
    padding: 12px;
    border: 1px solid #b9d3ff;
    border-radius: 8px;
    background: var(--info-bg);
    color: var(--muted);
  }

  .decision-rationale strong {
    display: block;
    margin-bottom: 5px;
    color: var(--ink);
    font-size: 12px;
    font-weight: 850;
    text-transform: uppercase;
  }

  .decision-rationale span {
    display: block;
  }

  .replay-detail .kv {
    grid-template-columns: minmax(110px, 0.7fr) minmax(0, 1.3fr);
  }

  .chart-marker {
    cursor: pointer;
    pointer-events: all;
  }

  .chart-marker:focus {
    outline: none;
  }

  .chart-marker-hit {
    pointer-events: all;
  }

  .chart-series {
    stroke-dasharray: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  footer {
    display: none;
  }

  @media (max-width: 1180px) {
    .metrics {
      grid-template-columns: repeat(3, minmax(150px, 1fr));
    }

    .artifact-grid,
    .term-grid {
      grid-template-columns: repeat(2, minmax(240px, 1fr));
    }
  }

  @media (max-width: 780px) {
    .page {
      width: min(100vw - 20px, 720px);
      padding-top: 10px;
    }

    .topbar,
    .two,
    .replay-layout,
    .metrics,
    .artifact-grid,
    .term-grid {
      grid-template-columns: 1fr;
    }

    .topbar,
    .band {
      padding: 16px;
    }

    .status-stack {
      justify-items: start;
      min-width: 0;
    }

    .section-head {
      display: grid;
    }

    .kv {
      grid-template-columns: 1fr;
    }

    .replay-controls {
      grid-template-columns: 1fr;
    }

    .replay-chart {
      height: 320px;
    }

    .event-strip {
      grid-template-columns: 1fr;
    }

    .strategy-row {
      grid-template-columns: 1fr;
    }

    .strategy-grid-head {
      display: none;
    }

    .strategy-stat {
      padding-top: 6px;
    }
  }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div>
      <h1>Sports Trading Strategy Dashboard</h1>
    </div>
  </header>

  <main>
    <section class="band">
      <div class="section-head">
        <div>
          <h2>Strategy Evidence</h2>
        </div>
      </div>
      <div class="strategy-evidence-controls">
        <label for="strategy-evidence-select">Strategy</label>
        <select id="strategy-evidence-select">
          <option>loading strategies...</option>
        </select>
      </div>
      <div class="strategy-overview" id="strategy-overview"></div>
    </section>

    <section class="band">
      <div class="section-head">
        <div>
          <h2>Event Replay</h2>
          <p>Choose a market, strategy, and event, then click a buy or sell point to see the trade details and rationale.</p>
        </div>
        <span class="pill warn" id="replay-count-pill">loading</span>
      </div>
      <div class="replay-tabs" role="tablist" aria-label="Replay type">
        <button class="replay-tab active" type="button" data-replay-tab="backtest">Backtest</button>
        <button class="replay-tab" type="button" data-replay-tab="paper">Paper Trade</button>
      </div>
      <div class="replay-controls">
        <div class="replay-filter">
          <label for="replay-market-select">Market</label>
          <select id="replay-market-select">
            <option>loading markets...</option>
          </select>
        </div>
        <div class="replay-filter">
          <label for="replay-strategy-select">Strategy</label>
          <select id="replay-strategy-select">
            <option>loading strategies...</option>
          </select>
        </div>
        <div class="replay-filter">
          <label for="replay-bet-type-select">Bet type</label>
          <select id="replay-bet-type-select">
            <option>loading bet types...</option>
          </select>
        </div>
        <div class="replay-filter">
          <label for="replay-date-select">Date</label>
          <select id="replay-date-select">
            <option>loading dates...</option>
          </select>
        </div>
        <div class="replay-filter">
          <label for="replay-select">Event</label>
          <select id="replay-select">
            <option>loading backtest events...</option>
          </select>
        </div>
        <div class="replay-filter">
          <label for="replay-line-select">Line</label>
          <select id="replay-line-select">
            <option>loading lines...</option>
          </select>
        </div>
        <div class="replay-filter">
          <label for="replay-data-source-select">Data source</label>
          <select id="replay-data-source-select">
            <option>Polymarket CLOB</option>
          </select>
        </div>
      </div>
      <div class="replay-layout">
        <div class="replay-chart-shell">
          <div class="chart-toolbar">
            <div class="chart-title" id="chart-title">Minute replay</div>
            <div class="chart-source-note" id="chart-source-note"></div>
          </div>
          <svg class="replay-chart" id="replay-chart" role="img" aria-label="Backtest event price path"></svg>
          <div class="source-toggles" id="replay-source-toggles"></div>
          <div class="chart-legend" id="chart-legend"></div>
        </div>
        <div class="replay-detail">
          <h3 id="replay-title">No event selected</h3>
          <div class="event-strip" id="replay-event-strip"></div>
          <div class="decision-panel">
            <div class="decision-heading">

function esc(value) {
  return String(value ?? "--")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function clone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function num(value) {
  if (value === null || value === undefined || value === "") return null;
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function fmtInt(value) {
  const n = num(value);
  return n === null ? "--" : Math.round(n).toLocaleString();
}

function fmtPct(value, digits = 2) {
  const n = num(value);
  return n === null ? "--" : `${(n * 100).toFixed(digits)}%`;
}

function fmtPrice(value, digits = 3) {
  const n = num(value);
  return n === null ? "--" : n.toFixed(digits);
}

function fmtUsd(value, digits = 2) {
  const n = num(value);
  if (n === null) return "--";
  return `$${n.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits })}`;
}

function fmtSignedUsd(value, digits = 2) {
  const n = num(value);
  if (n === null) return "--";
  const amount = Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
  return `${n >= 0 ? "+" : "-"}$${amount}`;
}

function fmtSigned(value, digits = 4) {
  const n = num(value);
  if (n === null) return "--";
  return `${n >= 0 ? "+" : ""}${n.toFixed(digits)}`;
}

function fmtProb(value) {
  const n = num(value);
  return n === null ? "--" : n.toFixed(6);
}

function fmtGate(ok, pass = "PASS", fail = "HOLD") {
  return `<span class="pill ${ok ? "good" : "bad"}">${ok ? pass : fail}</span>`;
}

function fmtSize(bytes) {
  const n = num(bytes);
  if (n === null) return "--";
  if (n >= 1024 * 1024) return `${(n / (1024 * 1024)).toFixed(1)} MB`;
  if (n >= 1024) return `${(n / 1024).toFixed(1)} KB`;
  return `${n} B`;
}

function targetRead(targetCol) {
  if (targetCol === "maker_trade_fill_positive") return "realistic fill-profit target";
  if (targetCol === "maker_positive") return "older maker-price target";
  if (targetCol === "lev_positive") return "short-term price-move target";
  return "model target";
}

function summarizeRun(summary) {
  const target = summary.target || {};
  const gates = summary.profit_gates || {};
  const trading = summary.trading || {};
  const val = trading.val || {};
  const test = trading.test || {};
  const currentFillTarget = target.target_col === "maker_trade_fill_positive";
  const abstained = Boolean(summary.selection_abstained) || Number(summary.selected_threshold) > 1;
  let note = "Audit run.";
  if (!currentFillTarget && gates.research_gate) {
    note = "Looks profitable, but it did not use the current fill-profit target.";
  } else if (abstained) {
    note = currentFillTarget ? "Current realistic target; model chose not to trade." : "Older target; model chose not to trade.";
  } else if (gates.research_gate) {
    note = "Research passed, but live money is still blocked.";
  }
  return {
    runId: summary.run_id,
    targetCol: target.target_col,
    featureSet: target.feature_set,
    selectedThreshold: summary.selected_threshold,
    selectionAbstained: abstained,
    valTrades: val.trades,
    valRoi: val.roi,
    valCiLo: val.ci_lo,
    testTrades: test.trades,
    testRoi: test.roi,
    testCiLo: test.ci_lo,
    researchGate: Boolean(gates.research_gate),
    liveCapitalGate: Boolean(gates.live_capital_gate),
    note
  };
}

function renderVerdict(data) {
  const overall = $("overall-pill");
  if (overall) {
    overall.textContent = data.overall.liveCapitalGate ? "REVIEW" : "HOLD";
    overall.className = "pill " + (data.overall.liveCapitalGate ? "warn" : "bad");
  }
  const capital = $("capital-pill");
  if (capital) {
    capital.textContent = data.overall.capitalEnabled ? "Capital enabled" : "Capital off";
    capital.className = "pill " + (data.overall.capitalEnabled ? "warn" : "bad");
  }
}

function strategyAuditRow(data, strategyName) {
  const rows = data.strategyBuckets?.strategyRows || [];
  const matches = rows.filter(row => row.strategy === strategyName && row.side === "taker");
  return matches.find(row => row.split === "test")
    || matches.find(row => row.split === "val")
    || matches.find(row => row.split === "train")
    || matches[0]
    || null;
}

function strategyAuditSplit(row) {
  return row?.split ? `${row.split} split` : "not enough qualifying rows";
}

function strategySupportRow(data, strategyName, split = "test") {
  const rows = data.strategyBuckets?.strategySupport || [];
  return rows.find(row => row.strategy === strategyName && row.split === split)
    || rows.find(row => row.strategy === strategyName && row.rows > 0)
    || null;
}

function strategySupportNote(row) {
  if (!row) return "No candidate support row was generated.";
  const base = `${fmtInt(row.rows)} rows across ${fmtInt(row.markets)} markets`;
  return row.reportable ? `${base}; reportable support.` : `${base}; ${row.reason || "below support gate"}.`;
}

function unavailableStrategyMetrics(reason) {
  return [
    ["Strategy Backtest ROI", "not validated", reason, "No strategy-specific held-out edge is proven yet."],
    ["Replay sample", "0 events", "0 one-minute points", "No replayable historical event set has passed the data gate yet."],
    ["Live picks", "0", "monitor only", "No live signal is cleared for capital."]
  ];
}

function takerValidationRow(data, strategyKey) {
  return (data.takerStrategyValidation?.results || []).find(row => row.strategy === strategyKey) || null;
}

function takerValidationStatus(row) {
  if (!row) return "not run";
  if (row.gate) return "validated";
  if (row.selected) return "test failed";
  return "no validation rule";
}

function takerValidationMetric(row) {
  if (!row) {
    return ["Strategy Backtest ROI", "not run", "no validation artifact", "No validation-selected rule has been tested."];
  }
  if (!row.selected) {
    return [
      "Strategy Backtest ROI",
      "not selected",
      `${takerValidationStatus(row)}`,
      row.reason || "No validation rule cleared a positive cluster-bootstrap confidence bound."
    ];
  }
  return [
    "Strategy Backtest ROI",
    fmtPct(row.testRoi),
    `${fmtInt(row.testRows)} test rows / ${fmtInt(row.testMarkets)} markets`,
    `Validation chose the rule first; frozen test CI lower bound is ${fmtPct(row.testCiLo)}. ${row.reason || ""}`
  ];
}

function qualityTierLabel(tier) {
  const labels = {
    complete_5m: "complete 5m",
    complete_15m_partial_5m: "15m complete, 5m partial",

  });

function cleanReplayEventName(event) {
  const raw = String(event?.title || event?.question || event?.slug || event?.replay_id || "Event").trim();
  if (!raw) return "Event";
  if (/\s/.test(raw) && !/^[a-z0-9-]+$/i.test(raw)) {
    return raw
      .replace(/\s+-\s+Player Props$/i, "")
      .replace(/\s+-\s+(More Markets|Total Corners|Halftime Result|Exact Score).*$/i, "")
      .replace(/\s+(Spread|Total):.*$/i, "")
      .trim();
  }
  const match = raw.match(/^([a-z0-9]+)-([a-z0-9]+)-([a-z0-9]+)-(\d{4})-(\d{2})-(\d{2})(?:-(.+))?$/i);
  if (!match) return raw.replaceAll("-", " ");
  const left = formatSlugToken(match[2], event);
  const right = formatSlugToken(match[3], event);
  return `${left} vs ${right}`;
}

function formatReplayPoint(value) {
  const raw = String(value ?? "").trim();
  if (!raw || raw.toLowerCase() === "nan") return "";
  return raw.replace(/^(-?\d+)pt(\d+)$/i, "$1.$2");
}

function replayLineValue(event) {
  const explicit = String(event?.line_label || event?.contract_label || "").trim();
  if (explicit) return explicit;
  const question = String(event?.question || "").trim();
  if (question && !/^[a-z0-9-]+$/i.test(question)) {
    const eventName = replayEventNameValue(event);
    const withoutEvent = question
      .replace(eventName, "")
      .replace(/^\s*[:|-]\s*/, "")
      .trim();
    if (withoutEvent && withoutEvent !== question) return withoutEvent;
    if (question.includes(":") || /\b(o\/u|over|under|spread|points|rebounds|assists|strikeouts|touchdown|goals|shots|saves|hits|runs)\b/i.test(question)) {
      return question;
    }
  }
  const outcome = String(event?.outcome || event?.odds_base_outcome || "").trim();
  const point = formatReplayPoint(event?.odds_point);
  const slug = String(event?.slug || "").toLowerCase();
  const suffix = slug.match(/^\w+-\w+-\w+-20\d{2}-\d{2}-\d{2}-(.+)$/i)?.[1] || "";
  if (point && outcome) return `${replayBetTypeValue(event)} ${point} | ${outcome}`;
  if (point) return `${replayBetTypeValue(event)} ${point}`;
  if (suffix.startsWith("total-")) return `Game total ${formatReplayPoint(suffix.slice(6))}`;
  if (suffix.startsWith("spread-")) return `Spread ${formatReplayPoint(suffix.replace(/^spread-(home|away)-/i, ""))}`;
  if (suffix.startsWith("exact-score-")) return `Exact score ${suffix.slice(12).replaceAll("-", "-")}`;
  if (suffix) return suffix.replaceAll("-", " ").replace(/\b\w/g, letter => letter.toUpperCase());
  return outcome || "Primary line";
}

function replayOptionCounts(events, valueFn) {
  const counts = new Map();
  events.forEach(item => {
    const value = valueFn(item) || "Unknown";
    counts.set(value, (counts.get(value) || 0) + 1);
  });
  return [...counts.entries()].sort((a, b) => {
    const countDelta = b[1] - a[1];
    return countDelta || a[0].localeCompare(b[0]);
  });
}

function replayFilterMatch(value, selectedValue) {

    && replayFilterMatch(replayEventNameValue(item), state.selectedReplayEventName)

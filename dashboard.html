<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Sports Trading Strategy Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #1d2430;
    --muted: #627083;
    --line: #d8dee8;
    --soft-line: #e9edf3;
    --danger: #b42318;
    --danger-bg: #fff1ef;
    --warn: #9a5b00;
    --warn-bg: #fff7e6;
    --good: #067647;
    --good-bg: #ecfdf3;
    --info: #175cd3;
    --info-bg: #eff6ff;
    --shadow: 0 10px 30px rgba(29, 36, 48, 0.07);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }

  a {
    color: var(--info);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  .page {
    width: min(1440px, calc(100vw - 32px));
    margin: 0 auto;
    padding: 24px 0 40px;
  }

  .topbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 20px;
    align-items: start;
    padding: 24px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .eyebrow {
    margin: 0 0 6px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-size: clamp(28px, 4vw, 44px);
    line-height: 1.05;
  }

  h2 {
    margin: 0;
    font-size: 20px;
  }

  h3 {
    margin: 0;
    font-size: 15px;
  }

  .subtitle {
    max-width: 880px;
    margin: 12px 0 0;
    color: var(--muted);
  }

  .status-stack {
    display: grid;
    gap: 8px;
    justify-items: end;
    min-width: 150px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 28px;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    background: #f9fafb;
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
  }

  .pill.bad {
    border-color: #f1a6a0;
    color: var(--danger);
    background: var(--danger-bg);
  }

  .pill.warn {
    border-color: #f2d28c;
    color: var(--warn);
    background: var(--warn-bg);
  }

  .pill.good {
    border-color: #9bd9b8;
    color: var(--good);
    background: var(--good-bg);
  }

  .pill.info {
    border-color: #b9d3ff;
    color: var(--info);
    background: var(--info-bg);
  }

  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  .muted {
    color: var(--muted);
  }

  .grid {
    display: grid;
    gap: 16px;
  }

  .metrics {
    grid-template-columns: repeat(3, minmax(150px, 1fr));
  }

  .two {
    grid-template-columns: minmax(0, 1.2fr) minmax(360px, 0.8fr);
  }

  .plain-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .band {
    margin-top: 18px;
    padding: 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .section-head {
    display: flex;
    gap: 12px;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .section-head p {
    margin: 5px 0 0;
    color: var(--muted);
  }

  .metric {
    min-width: 0;
    min-height: 118px;
    padding: 14px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .metric-label {
    min-height: 18px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .metric-value {
    margin-top: 8px;
    font-size: 26px;
    font-weight: 850;
    line-height: 1.1;
    word-break: break-word;
  }

  .metric-note {
    margin-top: 8px;
    color: var(--muted);
    font-size: 13px;
  }

  .metric-help {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid var(--soft-line);
    color: var(--ink);
    font-size: 13px;
  }

  .strategy-overview {
    margin-top: 16px;
    padding: 16px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .strategy-overview h3 {
    margin: 0 0 12px;
    font-size: 18px;
  }

  .strategy-list {
    display: grid;
    gap: 12px;
  }

  .strategy-grid-head {
    display: grid;
    grid-template-columns: minmax(260px, 1.4fr) repeat(3, minmax(150px, 0.8fr));
    gap: 12px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .strategy-row {
    display: grid;
    grid-template-columns: minmax(260px, 1.4fr) repeat(3, minmax(150px, 0.8fr));
    gap: 12px;
    padding: 14px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fff;
  }

  .strategy-row strong {
    display: block;
    line-height: 1.2;
  }

  .strategy-row-head {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    justify-content: space-between;
  }

  .strategy-copy {
    margin-top: 10px;
    color: var(--muted);
  }

  .strategy-stat {
    min-width: 0;
    padding: 2px 0 0;
  }

  .strategy-stat .metric-value {
    font-size: 22px;
  }

  .strategy-stat .metric-help {
    margin-top: 8px;
    padding-top: 0;
    border-top: 0;
    color: var(--muted);
  }

  .callout {
    padding: 16px;
    border: 1px solid #f1a6a0;
    border-radius: 8px;
    background: var(--danger-bg);
  }

  .callout strong {
    color: var(--danger);
  }

  .copy-list {
    display: grid;
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .copy-list li {
    padding: 10px 12px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .copy-list .bad {
    border-color: #f1a6a0;
    background: var(--danger-bg);
  }

  .copy-list .warn {
    border-color: #f2d28c;
    background: var(--warn-bg);
  }

  .copy-list .good {
    border-color: #9bd9b8;
    background: var(--good-bg);
  }

  .kv {
    display: grid;
    grid-template-columns: minmax(150px, 0.7fr) minmax(0, 1.3fr);
    gap: 8px 12px;
    margin: 0;
  }

  .kv dt {
    color: var(--muted);
    font-weight: 700;
  }

  .kv dd {
    min-width: 0;
    margin: 0;
    word-break: break-word;
  }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
  }

  table {
    width: 100%;
    min-width: 900px;
    border-collapse: collapse;
    background: #fff;
  }

  th,
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--soft-line);
    text-align: left;
    vertical-align: top;
  }

  th {
    color: var(--muted);
    background: #f9fafb;
    font-size: 12px;
    text-transform: uppercase;
  }

  tr:last-child td {
    border-bottom: 0;
  }

  .note {
    margin-top: 12px;
    color: var(--muted);
    font-size: 13px;
  }

  .link-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .link-row a {
    display: inline-flex;
    align-items: center;
    min-height: 30px;
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
  }

  .artifact-grid {
    grid-template-columns: repeat(3, minmax(240px, 1fr));
  }

  .term-grid {
    grid-template-columns: repeat(4, minmax(180px, 1fr));
  }

  .term {
    min-width: 0;
    padding: 12px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .term strong {
    display: block;
    margin-bottom: 5px;
  }

  .artifact {
    min-width: 0;
    padding: 12px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .artifact h3 {
    display: flex;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
  }

  .artifact .path {
    margin-top: 8px;
    color: var(--muted);
    font-size: 12px;
    word-break: break-word;
  }

  .replay-controls {
    display: grid;
    grid-template-columns: minmax(150px, 0.75fr) minmax(180px, 0.9fr) minmax(280px, 1.8fr);
    gap: 12px;
    align-items: end;
    margin-bottom: 14px;
  }

  .replay-filter {
    min-width: 0;
  }

  .replay-controls label {
    display: block;
    margin-bottom: 5px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .replay-controls select {
    width: 100%;
    min-height: 42px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font: inherit;
  }

  .replay-tabs {
    display: inline-flex;
    gap: 4px;
    margin-bottom: 14px;
    padding: 4px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #f9fafb;
  }

  .replay-tab {
    min-height: 34px;
    padding: 6px 12px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 850;
    cursor: pointer;
  }

  .replay-tab.active {
    background: #fff;
    color: var(--ink);
    box-shadow: 0 1px 4px rgba(29, 36, 48, 0.08);
  }

  .replay-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(320px, 0.45fr);
    gap: 18px;
    align-items: stretch;
  }

  .replay-chart-shell {
    min-width: 0;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fff;
    overflow: hidden;
  }

  .chart-toolbar {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--soft-line);
  }

  .chart-title {
    min-width: 0;
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .window-buttons {
    display: inline-flex;
    flex: 0 0 auto;
    gap: 4px;
    padding: 3px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #f9fafb;
  }

  .window-button {
    min-width: 46px;
    min-height: 30px;
    padding: 4px 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
  }

  .window-button.active {
    background: #fff;
    color: var(--info);
    box-shadow: 0 1px 4px rgba(29, 36, 48, 0.08);
  }

  .replay-chart {
    display: block;
    width: 100%;
    height: 460px;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }

  .replay-chart.dragging {
    cursor: grabbing;
  }

  .chart-legend {
    display: none;
    flex-wrap: wrap;
    gap: 10px 14px;
    padding: 10px 12px;
    border-top: 1px solid var(--soft-line);
    color: var(--muted);
    font-size: 12px;
  }

  .legend-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 5px;
    border-radius: 999px;
    vertical-align: -1px;
  }

  .replay-detail {
    min-width: 0;
    padding: 14px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .replay-detail h3 {
    margin-bottom: 12px;
    font-size: 18px;
    line-height: 1.2;
  }

  .event-strip {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }

  .event-stat {
    min-width: 0;
    padding: 10px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fff;
  }

  .event-stat span {
    display: block;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .event-stat strong {
    display: block;
    margin-top: 4px;
    font-size: 16px;
    line-height: 1.15;
    word-break: break-word;
  }

  .decision-panel {
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }

  .decision-heading {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: start;
    margin-bottom: 10px;
  }

  .decision-heading h4 {
    margin: 0;
    font-size: 18px;
    line-height: 1.15;
  }

  .decision-rationale {
    margin-top: 12px;
    margin-bottom: 12px;
    padding: 12px;
    border: 1px solid #b9d3ff;
    border-radius: 8px;
    background: var(--info-bg);
    color: var(--muted);
  }

  .decision-rationale strong {
    display: block;
    margin-bottom: 5px;
    color: var(--ink);
    font-size: 12px;
    font-weight: 850;
    text-transform: uppercase;
  }

  .decision-rationale span {
    display: block;
  }

  .replay-detail .kv {
    grid-template-columns: minmax(110px, 0.7fr) minmax(0, 1.3fr);
  }

  .chart-marker {
    cursor: pointer;
    pointer-events: all;
  }

  .chart-marker:focus {
    outline: none;
  }

  .chart-marker-hit {
    pointer-events: all;
  }

  .chart-series {
    stroke-dasharray: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  footer {
    display: none;
  }

  @media (max-width: 1180px) {
    .metrics {
      grid-template-columns: repeat(3, minmax(150px, 1fr));
    }

    .artifact-grid,
    .term-grid {
      grid-template-columns: repeat(2, minmax(240px, 1fr));
    }
  }

  @media (max-width: 780px) {
    .page {
      width: min(100vw - 20px, 720px);
      padding-top: 10px;
    }

    .topbar,
    .two,
    .replay-layout,
    .metrics,
    .artifact-grid,
    .term-grid {
      grid-template-columns: 1fr;
    }

    .topbar,
    .band {
      padding: 16px;
    }

    .status-stack {
      justify-items: start;
      min-width: 0;
    }

    .section-head {
      display: grid;
    }

    .kv {
      grid-template-columns: 1fr;
    }

    .replay-controls {
      grid-template-columns: 1fr;
    }

    .replay-chart {
      height: 320px;
    }

    .event-strip {
      grid-template-columns: 1fr;
    }

    .strategy-row {
      grid-template-columns: 1fr;
    }

    .strategy-grid-head {
      display: none;
    }

    .strategy-stat {
      padding-top: 6px;
    }
  }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div>
      <h1>Sports Trading Strategy Dashboard</h1>
    </div>
  </header>

  <main>
    <section class="band">
      <div class="section-head">
        <div>
          <h2>Strategy Evidence</h2>
        </div>
      </div>
      <div class="strategy-overview" id="strategy-overview"></div>
    </section>

    <section class="band">
      <div class="section-head">
        <div>
          <h2>Event Replay</h2>
          <p>Choose a market, strategy, and event, then click a buy or sell point to see the trade details and rationale.</p>
        </div>
        <span class="pill warn" id="replay-count-pill">loading</span>
      </div>
      <div class="replay-tabs" role="tablist" aria-label="Replay type">
        <button class="replay-tab active" type="button" data-replay-tab="backtest">Backtest</button>
        <button class="replay-tab" type="button" data-replay-tab="paper">Paper Trade</button>
      </div>
      <div class="replay-controls">
        <div class="replay-filter">
          <label for="replay-market-select">Market</label>
          <select id="replay-market-select">
            <option>loading markets...</option>
          </select>
        </div>
        <div class="replay-filter">
          <label for="replay-strategy-select">Strategy</label>
          <select id="replay-strategy-select">
            <option>loading strategies...</option>
          </select>
        </div>
        <div class="replay-filter">
          <label for="replay-select">Event</label>
          <select id="replay-select">
            <option>loading backtest events...</option>
          </select>
        </div>
      </div>
      <div class="replay-layout">
        <div class="replay-chart-shell">
          <div class="chart-toolbar">
            <div class="chart-title" id="chart-title">Minute replay</div>
          </div>
          <svg class="replay-chart" id="replay-chart" role="img" aria-label="Backtest event price path"></svg>
        </div>
        <div class="replay-detail">
          <h3 id="replay-title">No event selected</h3>
          <div class="event-strip" id="replay-event-strip"></div>
          <div class="decision-panel">
            <div class="decision-heading">
              <div>
                <div class="plain-label">Selected point</div>
                <h4 id="decision-title">No point selected</h4>
              </div>
              <span class="pill info" id="decision-action">--</span>
            </div>
            <div class="decision-rationale" id="replay-rationale"></div>
            <dl class="kv" id="replay-kv"></dl>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>
</div>

function esc(value) {
  return String(value ?? "--")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function clone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function num(value) {
  if (value === null || value === undefined || value === "") return null;
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function fmtInt(value) {
  const n = num(value);
  return n === null ? "--" : Math.round(n).toLocaleString();
}

function fmtPct(value, digits = 2) {
  const n = num(value);
  return n === null ? "--" : `${(n * 100).toFixed(digits)}%`;
}

function fmtPrice(value, digits = 3) {
  const n = num(value);
  return n === null ? "--" : n.toFixed(digits);
}

function fmtUsd(value, digits = 2) {
  const n = num(value);
  if (n === null) return "--";
  return `$${n.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits })}`;
}

function fmtSignedUsd(value, digits = 2) {
  const n = num(value);
  if (n === null) return "--";
  const amount = Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
  return `${n >= 0 ? "+" : "-"}$${amount}`;
}

function fmtSigned(value, digits = 4) {
  const n = num(value);
  if (n === null) return "--";
  return `${n >= 0 ? "+" : ""}${n.toFixed(digits)}`;
}

function fmtProb(value) {
  const n = num(value);
  return n === null ? "--" : n.toFixed(6);
}

function fmtGate(ok, pass = "PASS", fail = "HOLD") {
  return `<span class="pill ${ok ? "good" : "bad"}">${ok ? pass : fail}</span>`;
}

function fmtSize(bytes) {
  const n = num(bytes);
  if (n === null) return "--";
  if (n >= 1024 * 1024) return `${(n / (1024 * 1024)).toFixed(1)} MB`;
  if (n >= 1024) return `${(n / 1024).toFixed(1)} KB`;
  return `${n} B`;
}

function targetRead(targetCol) {
  if (targetCol === "maker_trade_fill_positive") return "realistic fill-profit target";
  if (targetCol === "maker_positive") return "older maker-price target";
  if (targetCol === "lev_positive") return "short-term price-move target";
  return "model target";
}

function summarizeRun(summary) {
  const target = summary.target || {};
  const gates = summary.profit_gates || {};
  const trading = summary.trading || {};
  const val = trading.val || {};
  const test = trading.test || {};
  const currentFillTarget = target.target_col === "maker_trade_fill_positive";
  const abstained = Boolean(summary.selection_abstained) || Number(summary.selected_threshold) > 1;
  let note = "Audit run.";
  if (!currentFillTarget && gates.research_gate) {
    note = "Looks profitable, but it did not use the current fill-profit target.";
  } else if (abstained) {
    note = currentFillTarget ? "Current realistic target; model chose not to trade." : "Older target; model chose not to trade.";
  } else if (gates.research_gate) {
    note = "Research passed, but live money is still blocked.";
  }
  return {
    runId: summary.run_id,
    targetCol: target.target_col,
    featureSet: target.feature_set,
    selectedThreshold: summary.selected_threshold,
    selectionAbstained: abstained,
    valTrades: val.trades,
    valRoi: val.roi,
    valCiLo: val.ci_lo,
    testTrades: test.trades,
    testRoi: test.roi,
    testCiLo: test.ci_lo,
    researchGate: Boolean(gates.research_gate),
    liveCapitalGate: Boolean(gates.live_capital_gate),
    note
  };
}

    const target = latest.target || {};
    const gates = latest.profit_gates || {};
    const dataset = latest.dataset || {};
    const trading = latest.trading || {};
    const test = trading.test || {};
    const classification = latest.classification?.test || {};
    const odds = latest.odds_features || {};
    const oddsTest = odds.coverage_by_split?.test || {};
    const labelTest = latest.label_coverage?.by_split?.test || {};
    data.latestModel.runId = latest.run_id || data.latestModel.runId;
    data.latestModel.targetCol = target.target_col || data.latestModel.targetCol;
    data.latestModel.pnlCol = target.pnl_col || data.latestModel.pnlCol;
    data.latestModel.featureSet = target.feature_set || data.latestModel.featureSet;
    data.latestModel.selectedThreshold = latest.selected_threshold ?? data.latestModel.selectedThreshold;
    data.latestModel.selectionAbstained = Boolean(latest.selection_abstained);
    data.latestModel.selectionScoreCol = latest.uncertainty?.selection_score_col || data.latestModel.selectionScoreCol;
    data.latestModel.researchGate = Boolean(gates.research_gate);
    data.latestModel.performanceGate = Boolean(gates.performance_gate);
    data.latestModel.liveCapitalGate = Boolean(gates.live_capital_gate);
    data.latestModel.datasetRows = dataset.rows ?? data.latestModel.datasetRows;
    data.latestModel.datasetMarkets = dataset.markets ?? data.latestModel.datasetMarkets;

    data.latestModel.oddsTestMatchedMarkets = oddsTest.matched_markets ?? data.latestModel.oddsTestMatchedMarkets;
    data.latestModel.testFillPositiveRows = labelTest.positive_rows ?? data.latestModel.testFillPositiveRows;
    data.latestModel.testRows = labelTest.rows ?? data.latestModel.testRows;
  }

  if (readiness) {
    data.readiness.overallGate = Boolean(readiness.overall_gate || readiness.gates?.overall_gate);
    data.readiness.rows = readiness.dataset?.rows ?? data.readiness.rows;
    data.readiness.markets = readiness.dataset?.markets ?? data.readiness.markets;
    data.readiness.tokens = readiness.dataset?.tokens ?? data.readiness.tokens;
  }

  if (inventory) {
    data.readiness.activeMarkets = inventory.active_model_usage?.markets ?? data.readiness.activeMarkets;
    data.readiness.activeEvents = inventory.active_model_usage?.events ?? data.readiness.activeEvents;
    data.readiness.testOddsCoverage = inventory.odds_api?.coverage_by_split?.test?.coverage ?? data.readiness.testOddsCoverage;
  }

  if (signals) {
    data.execution.liveSignalsSelected = signals.selected_signals ?? data.execution.liveSignalsSelected;
    data.execution.liveSignalRows = signals.feature_rows ?? data.execution.liveSignalRows;
    data.execution.liveSignalCandidates = signals.candidate_tokens ?? data.execution.liveSignalCandidates;
    data.execution.liveSignalMaxLower = signals.max_convergence_prob_lower ?? data.execution.liveSignalMaxLower;
    data.execution.liveSignalThreshold = signals.threshold ?? data.execution.liveSignalThreshold;
  }

  if (favoriteExecutable) {
    const coverage = favoriteExecutable.coverage || {};
    const settlement = favoriteExecutable.settlement_total || {};
    const ci = favoriteExecutable.settlement_bootstrap_ci || {};
    data.favoriteLongshotExecutable.gate = Boolean(favoriteExecutable.executable_gate);
    data.favoriteLongshotExecutable.selectedEntries = coverage.selected_entries ?? data.favoriteLongshotExecutable.selectedEntries;
    data.favoriteLongshotExecutable.settledEntries = coverage.clear_settlement_entries ?? data.favoriteLongshotExecutable.settledEntries;
    data.favoriteLongshotExecutable.bookAssets = coverage.assets_with_books ?? data.favoriteLongshotExecutable.bookAssets;

    data.favoriteLongshotExecutable.roi = settlement.roi ?? data.favoriteLongshotExecutable.roi;
    data.favoriteLongshotExecutable.winRate = settlement.win_rate ?? data.favoriteLongshotExecutable.winRate;
    data.favoriteLongshotExecutable.ciLo = ci.ci_lo ?? data.favoriteLongshotExecutable.ciLo;
  }

  if (favoriteRuleValidation) {
    const temporal = favoriteRuleValidation.temporal || {};
    const temporalTest = temporal.test || {};
    const market = favoriteRuleValidation.market_disjoint || {};
    const marketTest = market.test || {};
    data.favoriteLongshotRuleValidation.gate = Boolean(favoriteRuleValidation.overall_gate);
    data.favoriteLongshotRuleValidation.temporalRule = temporal.selected_rule_id || data.favoriteLongshotRuleValidation.temporalRule;
    data.favoriteLongshotRuleValidation.temporalTestBets = temporalTest.bets ?? data.favoriteLongshotRuleValidation.temporalTestBets;
    data.favoriteLongshotRuleValidation.temporalTestRoi = temporalTest.roi ?? data.favoriteLongshotRuleValidation.temporalTestRoi;

    data.favoriteLongshotRuleValidation.marketRule = market.selected_rule_id || data.favoriteLongshotRuleValidation.marketRule;
    data.favoriteLongshotRuleValidation.marketTestBets = marketTest.bets ?? data.favoriteLongshotRuleValidation.marketTestBets;
    data.favoriteLongshotRuleValidation.marketTestRoi = marketTest.roi ?? data.favoriteLongshotRuleValidation.marketTestRoi;
    data.favoriteLongshotRuleValidation.marketTestCiLo = marketTest.ci_lo ?? data.favoriteLongshotRuleValidation.marketTestCiLo;
  }

  if (favoriteLongshotEventReplays) {
    data.favoriteLongshotEventReplays = favoriteLongshotEventReplays;
  }

  applyMicrostructure(microstructureBuckets);

  if (state.runSummaries.length) {
    const dynamicRuns = state.runSummaries.map(summarizeRun);
    const byRunId = new Map(dynamicRuns.map(run => [run.runId, run]));
    data.modelRuns = data.modelRuns.map(run => byRunId.get(run.runId) || run);
    for (const run of dynamicRuns) {
      if (!data.modelRuns.some(existing => existing.runId === run.runId)) {
        data.modelRuns.push(run);
      }
    }
  }

  return data;
}

  if (sport.includes("basketball") || sport === "nba") {

  if (sport.includes("football") || sport === "nfl") {

      cle: "Browns",

      den: "Broncos",
      det: "Lions",

      la: "Rams",
      min: "Vikings",
      no: "Saints",
      phi: "Eagles",
      pit: "Steelers",
      sea: "Seahawks",
      was: "Commanders"
    };
    return nfl[key] || TEAM_ABBREVIATIONS[key] || key.toUpperCase();
  }
  if (sport.includes("hockey") || sport === "nhl") {
    const nhl = {
      ana: "Ducks",
      bos: "Bruins",
      car: "Hurricanes",
      chi: "Blackhawks",
      col: "Avalanche",
      dal: "Stars",

    };

}

function cleanReplayEventName(event) {
  const raw = String(event?.title || event?.question || event?.slug || event?.replay_id || "Event").trim();
  if (!raw) return "Event";
  if (/\s/.test(raw) && !/^[a-z0-9-]+$/i.test(raw)) return raw;
  const match = raw.match(/^([a-z0-9]+)-([a-z0-9]+)-([a-z0-9]+)-(\d{4})-(\d{2})-(\d{2})(?:-(.+))?$/i);
  if (!match) return raw.replaceAll("-", " ");
  const left = formatSlugToken(match[2], event);
  const right = formatSlugToken(match[3], event);
  const suffix = String(match[7] || "");
  const market = suffix.startsWith("total-")
    ? ` total ${suffix.slice(6).replace("pt", ".")}`
    : suffix.startsWith("spread-")
      ? ` spread ${suffix.slice(7).replace("pt", ".")}`
      : suffix.startsWith("exact-score-")
        ? ` exact score ${suffix.slice(12).replaceAll("-", "-")}`
        : "";
  return `${left} vs ${right}${market}`;
}

    return countDelta || a[0].localeCompare(b[0]);

function replayPricePoints(event) {

  const minuteSchema = schema.includes("selected_mid") && schema.includes("other_mid");
  return (event.series_points || []).map(point => {
    const otherRaw = num(point[2]);
    if (minuteSchema || point.length === 3) {
      return {

        other: otherRaw
      };
    }
    return {

}

function replayPosition(stats, marker = null) {
  const entry = num(stats?.entry_ask);
  const topAskSize = num(stats?.entry_ask_size);
  const targetStake = REPLAY_BANKROLL_USD * REPLAY_POSITION_FRACTION;
  const depthCap = entry && topAskSize ? entry * topAskSize : null;
  const stakeUsd = Math.max(0, Math.min(targetStake, depthCap ?? targetStake));
  const contracts = entry && entry > 0 ? stakeUsd / entry : null;
  const pnlPerContract = marker ? num(marker.pnl) : num(stats?.pnl);
  const pnlUsd = contracts !== null && pnlPerContract !== null ? contracts * pnlPerContract : null;
  const markPrice = marker ? num(marker.price) : num(stats?.final_mid);
  const markValueUsd = contracts !== null && markPrice !== null ? contracts * markPrice : null;
  return {
    bankroll: REPLAY_BANKROLL_USD,
    targetStake,
    depthCap,
    stakeUsd,
    contracts,
    pnlUsd,
    markValueUsd,
    endBalance: pnlUsd === null ? null : REPLAY_BANKROLL_USD + pnlUsd,
    cappedByDepth: depthCap !== null && depthCap < targetStake
  };
}

function replayTradeAmount(stats) {
  const pos = replayPosition(stats);
  if (num(pos.stakeUsd) === null) return "--";
  const cap = pos.cappedByDepth ? " depth capped" : "";
  return pos.contracts === null
    ? `${fmtUsd(pos.stakeUsd)}${cap}`
    : `${fmtUsd(pos.stakeUsd)} / ${fmtPrice(pos.contracts, 2)} contracts${cap}`;
}

function replayDecisionRationale(event, marker) {
  const stats = event.stats || {};
  const action = marker?.action || "MARK";
  const pos = replayPosition(stats, marker);
  const side = replaySide(event);
  const sourceReason = String(marker?.reason || event?.rationale || "").trim();
  if (sourceReason) return sourceReason;
  if (action === "BUY") {
    return `${side.order} at ${fmtPrice(marker.price)} with ${fmtUsd(pos.stakeUsd)} from a ${fmtUsd(pos.bankroll, 0)} starting balance.`;
  }
  if (action === "SETTLEMENT") {
    return `Final result: ${stats.won ? "won" : "lost"} with dollar PnL ${fmtSignedUsd(pos.pnlUsd)} and ending balance ${fmtUsd(pos.endBalance)}.`;
  }
  return `${side.sell} check at ${fmtPrice(marker.price)}. If exited here, dollar PnL would be ${fmtSignedUsd(pos.pnlUsd)}.`;
}

function selectedReplayMarkerIndex(event) {
  const markers = event.markers || [];
  const stored = state.selectedReplayMarkerById[event.replay_id];
  let index = Number(stored);
  if (!Number.isInteger(index) || index < 0 || index >= markers.length) {
    if (state.replayWindow === "movement") {
      index = markers.findIndex(marker => marker.action === "SETTLEMENT");
    }
    if (!Number.isInteger(index) || index < 0) index = 0;
  }
  state.selectedReplayMarkerById[event.replay_id] = index;
  return index;
}

}

function replayMarkerOffsets(markers) {
  return markers.map(marker => num(marker.offset_sec)).filter(value => value !== null);
}

function clampReplayRange(minX, maxX, fullMin, fullMax) {
  const fullSpan = Math.max(1, fullMax - fullMin);
  const minSpan = Math.min(fullSpan, 5 * 60);
  let nextMin = Number.isFinite(minX) ? minX : fullMin;
  let nextMax = Number.isFinite(maxX) ? maxX : fullMax;
  if (nextMax - nextMin < minSpan) {
    const mid = (nextMin + nextMax) / 2;
    nextMin = mid - minSpan / 2;
    nextMax = mid + minSpan / 2;
  }
  if (nextMax - nextMin >= fullSpan * 0.995) {
    return { minX: fullMin, maxX: fullMax };
  }
  if (nextMin < fullMin) {
    nextMax += fullMin - nextMin;
    nextMin = fullMin;
  }
  if (nextMax > fullMax) {
    nextMin -= nextMax - fullMax;
    nextMax = fullMax;
  }
  nextMin = Math.max(fullMin, nextMin);
  nextMax = Math.min(fullMax, nextMax);
  return { minX: nextMin, maxX: nextMax };
}

function clampReplayYRange(minY, maxY) {
  const fullMin = 0;
  const fullMax = 1;
  const fullSpan = fullMax - fullMin;
  const minSpan = 0.02;
  let nextMin = Number.isFinite(minY) ? minY : fullMin;
  let nextMax = Number.isFinite(maxY) ? maxY : fullMax;
  if (nextMax - nextMin < minSpan) {
    const mid = (nextMin + nextMax) / 2;
    nextMin = mid - minSpan / 2;
    nextMax = mid + minSpan / 2;
  }
  if (nextMax - nextMin >= fullSpan * 0.995) {
    return { minY: fullMin, maxY: fullMax };
  }
  if (nextMin < fullMin) {
    nextMax += fullMin - nextMin;
    nextMin = fullMin;
  }
  if (nextMax > fullMax) {
    nextMin -= nextMax - fullMax;
    nextMax = fullMax;
  }
  nextMin = Math.max(fullMin, nextMin);
  nextMax = Math.min(fullMax, nextMax);
  return { minY: nextMin, maxY: nextMax };
}

function replayWindowStats(points, minX, maxX) {
  const values = [];
  points.forEach(point => {
    if (point.offset < minX || point.offset > maxX) return;
    if (point.selected !== null) values.push(point.selected);
    if (point.other !== null) values.push(point.other);
  });
  if (!values.length) return { count: 0, spread: 0 };
  return {
    count: values.length,
    spread: Math.max(...values) - Math.min(...values)
  };
}

function activeMovementBounds(points, markers, event, fullMin, fullMax) {
  const settlementMarker = [...markers].reverse().find(marker => marker.action === "SETTLEMENT");
  const settlementOffset = num(settlementMarker?.offset_sec);
  const eventEndOffset = replayOffsetFromIso(event, event?.event_end_ts);
  const anchor = settlementOffset ?? eventEndOffset ?? fullMax;
  const windowSec = Math.min(6 * 3600, Math.max(10 * 60, fullMax - fullMin));
  let minX = Math.max(fullMin, anchor - windowSec);
  let maxX = Math.min(fullMax, anchor + 10 * 60);
  if (maxX - minX < 10 * 60) {
    minX = Math.max(fullMin, maxX - 10 * 60);
  }

  const current = replayWindowStats(points, minX, maxX);
  if (current.count >= 10 && current.spread >= 0.03) {
    return { minX, maxX };
  }

  let best = { minX, maxX, spread: current.spread, count: current.count };
  const step = Math.max(1, Math.floor(points.length / 180));
  for (let i = 0; i < points.length; i += step) {
    const start = points[i].offset;
    const end = Math.min(fullMax, start + windowSec);
    const stats = replayWindowStats(points, start, end);
    if (stats.count >= 10 && stats.spread > best.spread) {
      best = { minX: start, maxX: end, spread: stats.spread, count: stats.count };
    }
  }
  return { minX: best.minX, maxX: best.maxX };
}

function replayWindowBounds(points, markers, selectedMarker, event) {
  const markerOffsets = replayMarkerOffsets(markers);
  const fullMin = Math.min(...points.map(point => point.offset), ...markerOffsets);
  const fullMax = Math.max(...points.map(point => point.offset), ...markerOffsets);
  const buyMarker = markers.find(marker => marker.action === "BUY") || markers[0];
  const buyOffset = num(buyMarker?.offset_sec) ?? fullMin;
  const focusOffset = num(selectedMarker?.offset_sec) ?? buyOffset;
  const action = selectedMarker?.action || "BUY";
  let minX = fullMin;
  let maxX = fullMax;
  if (state.replayWindow === "movement") {
    const active = activeMovementBounds(points, markers, event, fullMin, fullMax);
    minX = active.minX;
    maxX = active.maxX;
  } else if (state.replayWindow === "trade") {
    const settlementMarker = [...markers].reverse().find(marker => marker.action === "SETTLEMENT");
    const settlementOffset = num(settlementMarker?.offset_sec) ?? fullMax;
    minX = Math.min(buyOffset, focusOffset) - 15 * 60;
    maxX = Math.max(settlementOffset, focusOffset, buyOffset) + 15 * 60;
  } else if (state.replayWindow !== "full" && action === "SETTLEMENT") {
    minX = focusOffset - 90 * 60;
    maxX = focusOffset + 10 * 60;
  } else if (state.replayWindow !== "full" && action === "MARK" && focusOffset - buyOffset <= 90 * 60) {
    minX = buyOffset - 10 * 60;
    maxX = buyOffset + 90 * 60;
  } else if (state.replayWindow !== "full") {
    minX = focusOffset - 10 * 60;
    maxX = focusOffset + 90 * 60;
  }
  minX = Math.max(fullMin, minX);
  maxX = Math.min(fullMax, maxX);
  if (focusOffset > maxX) {
    maxX = Math.min(fullMax, focusOffset + 10 * 60);
    minX = Math.max(fullMin, maxX - 90 * 60);
  }
  if (maxX - minX < 10 * 60) {
    maxX = Math.min(fullMax, minX + 10 * 60);
  }
  const zoom = state.replayZoomById[event?.replay_id];
  if (zoom && Number.isFinite(zoom.minX) && Number.isFinite(zoom.maxX)) {
    const clamped = clampReplayRange(zoom.minX, zoom.maxX, fullMin, fullMax);
    minX = clamped.minX;
    maxX = clamped.maxX;
  }
  return { minX, maxX, fullMin, fullMax };
}

function xTicksFor(event, minX, maxX, plotW) {
  const span = Math.max(1, maxX - minX);
  const targetCount = Math.max(3, Math.floor(plotW / 125));
  const intervals = [
    60, 5 * 60, 15 * 60, 30 * 60, 3600, 2 * 3600,
    3 * 3600, 6 * 3600, 12 * 3600, 86400, 2 * 86400,
    3 * 86400, 7 * 86400
  ];
  const interval = intervals.find(candidate => Math.ceil(span / candidate) <= targetCount) || intervals[intervals.length - 1];
  const startEpoch = Date.parse(event?.series_start_ts || "");
  if (!Number.isFinite(startEpoch)) {
    return Array.from({ length: targetCount }, (_, index) => {
      if (targetCount === 1) return minX;
      return minX + (span * index) / (targetCount - 1);
    });
  }
  const startSec = startEpoch / 1000;
  const firstTickEpoch = Math.ceil((startSec + minX) / interval) * interval;
  const ticks = [];
  for (let epoch = firstTickEpoch; epoch <= startSec + maxX + 1; epoch += interval) {
    const offset = epoch - startSec;
    if (offset >= minX - 1 && offset <= maxX + 1) ticks.push(offset);
  }
  if (!ticks.some(value => Math.abs(value - minX) < interval * 0.25)) ticks.unshift(minX);
  if (!ticks.some(value => Math.abs(value - maxX) < interval * 0.25)) ticks.push(maxX);
  return ticks.slice(0, 10);
}

function drawReplayChart(event) {
  const svg = $("replay-chart");
  const points = replayPricePoints(event);
  const selectedIndex = selectedReplayMarkerIndex(event);
  const markers = (event.markers || [])
    .map((marker, index) => ({ ...marker, index }))
    .filter(marker => num(marker.offset_sec) !== null && num(marker.price) !== null);
  setWindowButtonState();
  if (!points.length) {
    state.replayChart = null;
    svg.innerHTML = `<text x="24" y="42" fill="#627083">No price series available for this event.</text>`;
    if ($("chart-title")) $("chart-title").textContent = "Minute replay";
    return;
  }

  const width = 940;
  const height = 420;
  const pad = { left: 54, right: 128, top: 22, bottom: 44 };
  const plotW = width - pad.left - pad.right;
  const plotH = height - pad.top - pad.bottom;
  const selectedMarker = markers.find(marker => marker.index === selectedIndex);
  const bounds = replayWindowBounds(points, markers, selectedMarker, event);
  let visiblePoints = points.filter(point => point.offset >= bounds.minX && point.offset <= bounds.maxX);
  if (visiblePoints.length < 2) {
    visiblePoints = points;
    bounds.minX = Math.min(...points.map(point => point.offset));
    bounds.maxX = Math.max(...points.map(point => point.offset));
  }
  const visibleMarkers = markers.filter(marker => num(marker.offset_sec) >= bounds.minX && num(marker.offset_sec) <= bounds.maxX);
  const spanX = Math.max(1, bounds.maxX - bounds.minX);
  if ($("chart-title")) {
    $("chart-title").textContent = replayExperimentLabel(event);
  }
  const priceValues = [
    ...visiblePoints.flatMap(point => [point.selected, point.other]),
    ...visibleMarkers.map(marker => num(marker.price))
  ].filter(value => value !== null);
  let minY = Math.max(0, Math.min(...priceValues));
  let maxY = Math.min(1, Math.max(...priceValues));
  const span = Math.max(0.01, maxY - minY);
  minY = Math.max(0, minY - Math.max(0.02, span * 0.18));
  maxY = Math.min(1, maxY + Math.max(0.02, span * 0.18));
  if (maxY - minY < 0.06) {
    const mid = (maxY + minY) / 2;
    minY = Math.max(0, mid - 0.03);
    maxY = Math.min(1, mid + 0.03);
  }
  const savedY = state.replayYRangeById[event.replay_id];
  if (savedY && Number.isFinite(savedY.minY) && Number.isFinite(savedY.maxY)) {
    const clampedY = clampReplayYRange(savedY.minY, savedY.maxY);
    minY = clampedY.minY;
    maxY = clampedY.maxY;
  }
  const sx = value => pad.left + ((value - bounds.minX) / spanX) * plotW;
  const sy = value => pad.top + (1 - ((value - minY) / Math.max(0.0001, maxY - minY))) * plotH;
  let yTicks = [0, 0.25, 0.5, 0.75, 1].filter(value => value >= minY - 0.001 && value <= maxY + 0.001);
  if (yTicks.length < 3) {
    yTicks = [minY, (minY + maxY) / 2, maxY];
  }
  const xTicks = xTicksFor(event, bounds.minX, bounds.maxX, plotW);

  const grid = yTicks.map(value => `
    <line x1="${pad.left}" y1="${sy(value).toFixed(1)}" x2="${width - pad.right}" y2="${sy(value).toFixed(1)}" stroke="#e9edf3" />
    <text x="${pad.left - 10}" y="${(sy(value) + 4).toFixed(1)}" text-anchor="end" fill="#627083" font-size="12">${fmtPrice(value, 2)}</text>
  `).join("");
  const xAxis = xTicks.map(value => `
    <text x="${sx(value).toFixed(1)}" y="${height - 14}" text-anchor="middle" fill="#627083" font-size="12">${esc(replayAxisLabel(event, value, spanX))}</text>
  `).join("");
  const lineLabel = (key, label, color, dy = 0) => {
    const last = [...visiblePoints].reverse().find(point => point[key] !== null);
    if (!last) return "";
    const y = Math.max(pad.top + 12, Math.min(height - pad.bottom - 8, sy(last[key]) + dy));
    return `<text x="${(width - pad.right + 10).toFixed(1)}" y="${y.toFixed(1)}" fill="${color}" font-size="12" font-weight="800" paint-order="stroke" stroke="#fff" stroke-width="4">${esc(shortLabel(label, 16))}</text>`;
  };
  const lineLabels = [
    lineLabel("selected", event.outcome || "Selected", "#1f77b4", -22),
    lineLabel("other", event.other_outcome || "Other side", "#f59e0b", 18)
  ].join("");
  const markerPoints = [];
  const markerSvg = visibleMarkers.map(marker => {
    const action = marker.action || "MARK";
    const color = action === "BUY" ? "#067647" : action === "SETTLEMENT" ? "#1d2430" : "#b42318";
    const x = sx(num(marker.offset_sec));
    const y = sy(num(marker.price));
    markerPoints.push({ index: marker.index, x, y });
    const labelY = action === "BUY" ? y - 12 : y + 22;
    const displayLabel = action === "MARK" ? (marker.horizon_label || "mark") : action === "SETTLEMENT" ? "settle" : "buy";
    const isSelected = marker.index === selectedIndex;
    return `
      <g class="chart-marker" data-marker-index="${marker.index}" tabindex="0" role="button" aria-label="${esc(replayMarkerLabel(marker))}">
        <title>${esc(`${marker.label}: ${marker.reason || ""}`)}</title>
        <circle class="chart-marker-hit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="16" fill="transparent" stroke="transparent" />
        <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isSelected ? "8.5" : "6.5"}" fill="${color}" stroke="${isSelected ? "#1d2430" : "#fff"}" stroke-width="${isSelected ? "3" : "2"}" />
        <text x="${x.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="middle" fill="${color}" font-size="11" font-weight="700">${esc(displayLabel)}</text>
      </g>
    `;
  }).join("");

  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  state.replayChart = {
    replayId: event.replay_id,
    minX: bounds.minX,
    maxX: bounds.maxX,
    fullMin: bounds.fullMin,
    fullMax: bounds.fullMax,
    pad,
    plotW,
    plotH,
    minY,
    maxY,
    width,
    height,
    markerPoints
  };
  svg.innerHTML = `
    <rect x="0" y="0" width="${width}" height="${height}" fill="#fff" pointer-events="none" />
    ${grid}
    <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${height - pad.bottom}" stroke="#d8dee8" />
    <line x1="${pad.left}" y1="${height - pad.bottom}" x2="${width - pad.right}" y2="${height - pad.bottom}" stroke="#d8dee8" />
    <polyline class="chart-series" points="${replayPath(visiblePoints, "other", sx, sy)}" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="none" opacity="0.95" />
    <polyline class="chart-series" points="${replayPath(visiblePoints, "selected", sx, sy)}" fill="none" stroke="#1f77b4" stroke-width="3" stroke-dasharray="none" opacity="0.98" />
    ${lineLabels}
    <rect data-chart-pan="xy" x="${pad.left}" y="${pad.top}" width="${plotW}" height="${plotH}" fill="transparent" pointer-events="all" cursor="move" />
    <rect data-chart-pan="y-scale" x="0" y="${pad.top}" width="${pad.left}" height="${plotH}" fill="transparent" pointer-events="all" cursor="ns-resize" />
    <rect data-chart-pan="x-scale" x="${pad.left}" y="${height - pad.bottom}" width="${plotW}" height="${pad.bottom}" fill="transparent" pointer-events="all" cursor="ew-resize" />
    ${xAxis}
    ${markerSvg}
  `;
}

function setReplayZoomRange(minX, maxX) {
  const chart = state.replayChart;
  if (!chart?.replayId) return;
  const range = clampReplayRange(minX, maxX, chart.fullMin, chart.fullMax);
  const fullSpan = Math.max(1, chart.fullMax - chart.fullMin);
  if (range.maxX - range.minX >= fullSpan * 0.995) {
    delete state.replayZoomById[chart.replayId];
  } else {
    state.replayZoomById[chart.replayId] = range;
  }
  renderReplay(deriveDashboard());
}

function setReplayYRange(minY, maxY, shouldRender = true) {
  const chart = state.replayChart;
  if (!chart?.replayId) return;
  const range = clampReplayYRange(minY, maxY);
  if (range.maxY - range.minY >= 0.995) {
    delete state.replayYRangeById[chart.replayId];
  } else {
    state.replayYRangeById[chart.replayId] = range;
  }
  if (shouldRender) renderReplay(deriveDashboard());
}

function replaySvgPointFromPointer(event) {
  const svg = $("replay-chart");
  const chart = state.replayChart;
  if (!svg || !chart) return null;
  const rect = svg.getBoundingClientRect();
  const x = ((event.clientX - rect.left) / Math.max(1, rect.width)) * chart.width;
  const y = ((event.clientY - rect.top) / Math.max(1, rect.height)) * chart.height;
  return { x, y };
}

function replaySvgOffsetFromPointer(event) {
  const chart = state.replayChart;
  const point = replaySvgPointFromPointer(event);
  if (!point || !chart) return null;
  const x = point.x;
  const clampedX = Math.max(chart.pad.left, Math.min(chart.pad.left + chart.plotW, x));
  return chart.minX + ((clampedX - chart.pad.left) / chart.plotW) * (chart.maxX - chart.minX);
}

function replaySvgValueFromPointer(event) {
  const chart = state.replayChart;
  const point = replaySvgPointFromPointer(event);
  if (!point || !chart) return null;
  const y = Math.max(chart.pad.top, Math.min(chart.pad.top + chart.plotH, point.y));
  return chart.maxY - ((y - chart.pad.top) / chart.plotH) * (chart.maxY - chart.minY);
}

function nearestReplayMarkerIndex(event) {
  const chart = state.replayChart;
  const point = replaySvgPointFromPointer(event);
  if (!point || !chart?.markerPoints?.length) return null;
  let best = null;
  for (const marker of chart.markerPoints) {
    const dx = marker.x - point.x;
    const dy = marker.y - point.y;
    const dist2 = dx * dx + dy * dy;
    if (!best || dist2 < best.dist2) {
      best = { index: marker.index, dist2 };
    }
  }
  return best && best.dist2 <= 24 * 24 ? best.index : null;
}

function zoomReplayChart(factor, anchorOffset = null) {
  const chart = state.replayChart;
  if (!chart?.replayId) return;
  const span = Math.max(1, chart.maxX - chart.minX);
  const anchor = Number.isFinite(anchorOffset) ? anchorOffset : chart.minX + span / 2;
  const nextMin = anchor - (anchor - chart.minX) * factor;
  const nextMax = anchor + (chart.maxX - anchor) * factor;
  setReplayZoomRange(nextMin, nextMax);
}

function zoomReplayY(factor, anchorValue = null) {
  const chart = state.replayChart;
  if (!chart?.replayId) return;
  const span = Math.max(0.0001, chart.maxY - chart.minY);
  const anchor = Number.isFinite(anchorValue) ? anchorValue : chart.minY + span / 2;
  const nextMin = anchor - (anchor - chart.minY) * factor;
  const nextMax = anchor + (chart.maxY - anchor) * factor;
  setReplayYRange(nextMin, nextMax);
}

function saveReplayXRange(replayId, range, fullMin, fullMax) {
  const fullSpan = Math.max(1, fullMax - fullMin);
  if (range.maxX - range.minX >= fullSpan * 0.995) {
    delete state.replayZoomById[replayId];
  } else {
    state.replayZoomById[replayId] = range;
  }
}

function saveReplayYRange(replayId, range) {
  if (range.maxY - range.minY >= 0.995) {
    delete state.replayYRangeById[replayId];
  } else {
    state.replayYRangeById[replayId] = range;
  }
}

function handleReplayWheel(event) {
  if (!event.target.closest?.("#replay-chart")) return;
  event.preventDefault();
  const chart = state.replayChart;
  const point = replaySvgPointFromPointer(event);
  const factor = event.deltaY < 0 ? 0.72 : 1.38;
  if (chart && point && point.x <= chart.pad.left + 8) {
    zoomReplayY(factor, replaySvgValueFromPointer(event));
  } else {
    zoomReplayChart(factor, replaySvgOffsetFromPointer(event));
  }
}

function handleReplayPointerDown(event) {
  if (!event.target.closest?.("#replay-chart") || event.target.closest?.("[data-marker-index]")) return;
  const chart = state.replayChart;
  if (!chart?.replayId) return;
  const point = replaySvgPointFromPointer(event);
  const hitMode = event.target.closest?.("[data-chart-pan]")?.dataset?.chartPan;
  const mode = hitMode || (
    point && point.x <= chart.pad.left + 14 ? "y-scale"
      : point && point.y >= chart.height - chart.pad.bottom - 10 ? "x-scale"
        : "xy"
  );
  event.preventDefault();
  event.currentTarget?.setPointerCapture?.(event.pointerId);
  $("replay-chart").classList.add("dragging");
  state.replayDrag = {
    mode,
    clientX: event.clientX,
    clientY: event.clientY,
    minX: chart.minX,
    maxX: chart.maxX,
    fullMin: chart.fullMin,
    fullMax: chart.fullMax,
    minY: chart.minY,
    maxY: chart.maxY,
    plotW: chart.plotW,
    plotH: chart.plotH,
    height: chart.height,
    width: chart.width
  };
}

function handleReplayPointerMove(event) {
  const drag = state.replayDrag;
  const chart = state.replayChart;
  if (!drag || !chart?.replayId) return;
  const svg = $("replay-chart");
  const rect = svg.getBoundingClientRect();
  const dxSvg = ((event.clientX - drag.clientX) / Math.max(1, rect.width)) * drag.width;
  const dySvg = ((event.clientY - drag.clientY) / Math.max(1, rect.height)) * drag.height;
  if (drag.mode === "x-scale") {
    const factor = Math.exp(dxSvg / 260);
    const anchor = drag.minX + (drag.maxX - drag.minX) / 2;
    const range = clampReplayRange(
      anchor - (anchor - drag.minX) * factor,
      anchor + (drag.maxX - anchor) * factor,
      drag.fullMin,
      drag.fullMax
    );
    saveReplayXRange(chart.replayId, range, drag.fullMin, drag.fullMax);
  } else if (drag.mode === "y-scale") {
    const factor = Math.exp(dySvg / 220);
    const anchor = drag.minY + (drag.maxY - drag.minY) / 2;
    const range = clampReplayYRange(
      anchor - (anchor - drag.minY) * factor,
      anchor + (drag.maxY - anchor) * factor
    );
    saveReplayYRange(chart.replayId, range);
  } else if (drag.mode === "xy") {
    const span = drag.maxX - drag.minX;
    const delta = -(dxSvg / Math.max(1, drag.plotW)) * span;
    const range = clampReplayRange(drag.minX + delta, drag.maxX + delta, drag.fullMin, drag.fullMax);
    saveReplayXRange(chart.replayId, range, drag.fullMin, drag.fullMax);
    const ySpan = drag.maxY - drag.minY;
    const yDelta = (dySvg / Math.max(1, drag.plotH)) * ySpan;
    const yRange = clampReplayYRange(drag.minY + yDelta, drag.maxY + yDelta);
    saveReplayYRange(chart.replayId, yRange);
  }
  renderReplay(deriveDashboard());
}

function handleReplayPointerUp(event) {
  state.replayDrag = null;
  const svg = $("replay-chart");
  svg?.classList.remove("dragging");
  if (event?.pointerId !== undefined) svg?.releasePointerCapture?.(event.pointerId);
}

async function loadReplayDetail(event) {
  if (!event?.replay_id || !event?.replay_path || state.replayLoading[event.replay_id]) return;
  state.replayLoading[event.replay_id] = true;
  try {
    const res = await fetch(`${event.replay_path}?t=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.replayDetails[event.replay_id] = await res.json();
  } catch (error) {
    state.replayDetails[event.replay_id] = {
      ...event,
      series_points: [],
      markers: [],
      load_error: error.message
    };
  } finally {
    state.replayLoading[event.replay_id] = false;
    if (state.selectedReplayId === event.replay_id) {
      renderReplay(deriveDashboard());
    }
  }
}

function renderDecisionPanel(event, marker) {
  const stats = event.stats || {};
  const action = marker?.action || "MARK";
  const pos = replayPosition(stats, marker);
  const side = replaySide(event);
  const actionText = action === "BUY"
    ? (side.side === "OUTCOME" ? "BUY" : `BUY ${side.side}`)
    : action === "SETTLEMENT" ? "RESULT"
      : (side.side === "OUTCOME" ? "SELL" : `SELL ${side.side}`);
  const actionTone = action === "BUY" ? "good" : action === "SETTLEMENT" ? (stats.won ? "good" : "bad") : "warn";
  const title =
    action === "BUY" ? side.order
      : action === "SETTLEMENT" ? `Final result: ${stats.won ? "won" : "lost"}`
        : `${side.sell} check`;
  $("decision-title").textContent = marker ? title : "No point selected";
  $("decision-action").textContent = actionText;
  $("decision-action").className = `pill ${actionTone}`;
  if (!marker) {
    $("replay-kv").innerHTML = "";
    $("replay-rationale").innerHTML = `<strong>Rationale</strong><span>No buy or mark point is available for this event.</span>`;
    return;
  }
  const priceName = action === "BUY" ? "Buy price" : action === "SETTLEMENT" ? "Final price" : "Sell price";
  const markerRoi = action === "BUY" ? 0 : (marker.roi !== undefined ? marker.roi : stats.roi);
  const rows = [
    ["Action", action === "BUY" ? "Buy" : action === "SETTLEMENT" ? "Result" : "Sell"],
    ["Side", side.display],
    ["Start balance", fmtUsd(pos.bankroll, 0)],
    ["Position", replayTradeAmount(stats)],
    ["Contracts", pos.contracts === null ? "--" : fmtPrice(pos.contracts, 2)],
    ["Time", replayTimeLabel(event, marker.offset_sec)],
    [priceName, fmtPrice(marker.price)],
    [action === "BUY" ? "Cost" : "Value", action === "BUY" ? fmtUsd(pos.stakeUsd) : fmtUsd(pos.markValueUsd)],
    ["PnL", `${fmtSignedUsd(pos.pnlUsd)} (${fmtPct(markerRoi)})`],
    ["End balance", fmtUsd(pos.endBalance)]
  ];
  $("replay-kv").innerHTML = rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  $("replay-rationale").innerHTML = `<strong>Rationale</strong><span>${esc(replayDecisionRationale(event, marker))}</span>`;
}

function renderReplay(data) {
  const replay = data.favoriteLongshotEventReplays || {};
  const events = replay.events || [];
  document.querySelectorAll("[data-replay-tab]").forEach(button => {
    button.classList.toggle("active", button.dataset.replayTab === state.replayTab);
  });
  const select = $("replay-select");
  const marketSelect = $("replay-market-select");
  const strategySelect = $("replay-strategy-select");
  if (state.replayTab === "paper") {
    $("replay-count-pill").textContent = "no paper trades";
    $("replay-count-pill").className = "pill warn";
    marketSelect.disabled = true;
    strategySelect.disabled = true;
    select.disabled = true;
    marketSelect.innerHTML = `<option>No paper markets yet</option>`;
    strategySelect.innerHTML = `<option>No paper strategies yet</option>`;
    select.innerHTML = `<option>No paper trades yet</option>`;
    $("replay-title").textContent = "Paper Trade";
    $("replay-event-strip").innerHTML = "";
    $("decision-title").textContent = "No paper trades yet";
    $("decision-action").textContent = "--";
    $("decision-action").className = "pill info";
    $("replay-kv").innerHTML = "";
    $("replay-rationale").innerHTML = `<strong>Rationale</strong><span>Paper trade replays will appear here after paper executions are logged with price series, entry, exit, size, and PnL.</span>`;
    drawReplayChart({ series_points: [] });
    if ($("chart-title")) $("chart-title").textContent = "Paper trade replay";
    return;
  }

  marketSelect.disabled = false;
  strategySelect.disabled = false;
  select.disabled = false;
  if (!events.length) {
    marketSelect.disabled = true;
    strategySelect.disabled = true;
    select.disabled = true;
    marketSelect.innerHTML = `<option>No markets loaded</option>`;
    strategySelect.innerHTML = `<option>No strategies loaded</option>`;
    select.innerHTML = `<option>No replay data loaded</option>`;
    $("replay-count-pill").textContent = "no events";
    $("replay-count-pill").className = "pill warn";
    $("replay-title").textContent = "No event replay data loaded";
    $("replay-event-strip").innerHTML = "";
    $("decision-title").textContent = "No point selected";
    $("decision-action").textContent = "--";
    $("decision-action").className = "pill info";
    $("replay-kv").innerHTML = "";
    $("replay-rationale").innerHTML = `<strong>Rationale</strong><span>The public dashboard loads this from favorite_longshot_event_replays_latest.json. If you are opening the file directly, use the GitHub Pages page so browser fetches work.</span>`;
    drawReplayChart({ series_points: [] });
    return;
  }

  state.selectedReplayMarket = renderReplayFilterOptions(
    marketSelect,
    replayOptionCounts(events, replayMarketValue),
    state.selectedReplayMarket,
    "All markets"
  );
  const marketFiltered = events.filter(item => replayFilterMatch(replayMarketValue(item), state.selectedReplayMarket));
  state.selectedReplayStrategy = renderReplayStrategyOptions(
    strategySelect,
    marketFiltered,
    state.selectedReplayStrategy
  );
  const filteredEvents = replayEventsForFilters(events);
  $("replay-count-pill").textContent = filteredEvents.length
    ? `${fmtInt(filteredEvents.length)} / ${fmtInt(events.length)} events`
    : "no matching events";
  $("replay-count-pill").className = "pill " + (filteredEvents.length ? "info" : "warn");

  if (!filteredEvents.length) {
    select.disabled = true;
    select.innerHTML = `<option>No events for selected filters</option>`;
    $("replay-title").textContent = "No matching event";
    $("replay-event-strip").innerHTML = "";
    $("decision-title").textContent = "No point selected";
    $("decision-action").textContent = "--";
    $("decision-action").className = "pill info";
    $("replay-kv").innerHTML = "";
    $("replay-rationale").innerHTML = `<strong>Rationale</strong><span>No replay event matches the selected market and strategy.</span>`;
    drawReplayChart({ series_points: [] });
    return;
  }

  const selectedStillExists = filteredEvents.some(event => event.replay_id === state.selectedReplayId);
  if (!state.selectedReplayId || !selectedStillExists) {
    state.selectedReplayId = filteredEvents[0].replay_id;
  }
  const event = filteredEvents.find(item => item.replay_id === state.selectedReplayId) || filteredEvents[0];
  const currentOptions = Array.from(select.options).map(option => option.value).join("|");
  const nextOptions = filteredEvents.map(event => event.replay_id).join("|");
  if (currentOptions !== nextOptions) {
    select.innerHTML = filteredEvents.map(item => `
      <option value="${esc(item.replay_id)}">${esc(replayOptionLabel(item))}</option>
    `).join("");
  }
  select.value = event.replay_id;

  const detail = state.replayDetails[event.replay_id];
  if (!detail) {
    const stats = event.stats || {};
    const pos = replayPosition(stats);
    const side = replaySide(event);
    $("replay-title").textContent = replayExperimentLabel(event);
    $("replay-event-strip").innerHTML = [
      ["Strategy", strategyLabel(event.strategy_label || event.strategy || event.bucket)],
      ["Market", marketLabel(event)],
      ["Order", side.order],
      ["Position", replayTradeAmount(stats)],
      ["Event PnL", `${fmtSignedUsd(pos.pnlUsd)} (${fmtPct(stats.roi)})`],
      ["Start", fmtUsd(pos.bankroll, 0)]
    ].map(([k, v]) => `<div class="event-stat"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join("");
    $("decision-title").textContent = "Loading event";
    $("decision-action").textContent = "--";
    $("decision-action").className = "pill info";
    $("replay-kv").innerHTML = "";
    $("replay-rationale").innerHTML = `<strong>Rationale</strong><span>Loading minute-level prices.</span>`;
    drawReplayChart({ series_points: [] });
    loadReplayDetail(event);
    return;
  }

  const fullEvent = { ...event, ...detail };
  const stats = fullEvent.stats || {};
  const finalPos = replayPosition(stats);
  const side = replaySide(fullEvent);
  const markers = fullEvent.markers || [];
  const markerIndex = selectedReplayMarkerIndex(fullEvent);
  const selectedMarker = markers[markerIndex];
  $("replay-title").textContent = replayExperimentLabel(fullEvent);
  $("replay-event-strip").innerHTML = [
    ["Strategy", strategyLabel(fullEvent.strategy_label || fullEvent.strategy || fullEvent.bucket)],
    ["Market", marketLabel(fullEvent)],
    ["Order", side.order],
    ["Result", stats.won ? "Won" : "Lost"],
    ["Position", replayTradeAmount(stats)],
    ["Event PnL", `${fmtSignedUsd(finalPos.pnlUsd)} (${fmtPct(stats.roi)})`],
    ["Start", fmtUsd(finalPos.bankroll, 0)],
    ["End", fmtUsd(finalPos.endBalance)]
  ].map(([k, v]) => `<div class="event-stat"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join("");
  if (fullEvent.load_error) {
    $("decision-title").textContent = "Load failed";
    $("decision-action").textContent = "--";
    $("decision-action").className = "pill bad";
    $("replay-kv").innerHTML = "";
    $("replay-rationale").innerHTML = `<strong>Rationale</strong><span>Could not load event detail: ${esc(fullEvent.load_error)}</span>`;
  } else {
    renderDecisionPanel(fullEvent, selectedMarker);
  }
  drawReplayChart(fullEvent);
}

function renderModel(data) {
  const m = data.latestModel;
  $("model-gate-pill").textContent = m.researchGate ? "Research pass" : "Research hold";
  $("model-gate-pill").className = "pill " + (m.researchGate ? "warn" : "bad");
  const rows = [
    ["Run", m.runId],
    ["Model version", m.modelVersion],
    ["What it predicts", `${targetRead(m.targetCol)} (${m.targetCol})`],
    ["Profit label", m.pnlCol],
    ["Inputs used", m.featureSet],
    ["Decision score", m.selectionScoreCol],
    ["Required score", fmtProb(m.selectedThreshold)],
    ["Decision", m.selectionAbstained ? "abstained; no trades cleared the bar" : "selected trades"],
    ["Dataset", `${fmtInt(m.datasetRows)} rows / ${fmtInt(m.datasetMarkets)} markets / ${fmtInt(m.datasetTokens)} tokens`],
    ["Tuning-window trades", fmtInt(m.valTrades)],
    ["Final-check trades", fmtInt(m.testTrades)],
    ["Odds coverage", `${fmtPct(m.oddsFeatureCoverage)} overall / ${fmtPct(m.oddsTestCoverage)} test`]
  ];
  $("model-kv").innerHTML = rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  $("data-sanity").innerHTML = data.dataSanity.map(item => `<li class="${esc(item.tone)}">${esc(item.text)}</li>`).join("");
}

function renderRuns(data) {
  $("run-table").innerHTML = data.modelRuns.map(run => {
    const selection = run.selectionAbstained ? "abstained" : `threshold ${fmtProb(run.selectedThreshold)}`;
    const val = `${fmtInt(run.valTrades)} trades<br><span class="muted">ROI ${fmtPct(run.valRoi)} / CI low ${fmtPct(run.valCiLo)}</span>`;
    const test = `${fmtInt(run.testTrades)} trades<br><span class="muted">ROI ${fmtPct(run.testRoi)} / CI low ${fmtPct(run.testCiLo)}</span>`;
    const gate = `${fmtGate(run.researchGate, "RESEARCH", "HOLD")} ${fmtGate(run.liveCapitalGate, "LIVE", "NO LIVE")}`;
    return `
      <tr>
        <td class="mono">${esc(run.runId)}</td>
        <td><strong>${esc(targetRead(run.targetCol))}</strong><br><span class="muted mono">${esc(run.targetCol)}</span></td>
        <td>${esc(run.featureSet)}</td>
        <td>${esc(selection)}</td>
        <td>${val}</td>
        <td>${test}</td>
        <td>${gate}</td>
        <td>${esc(run.note)}</td>
      </tr>
    `;
  }).join("");
}

function renderGlossary(data) {
  $("term-grid").innerHTML = data.terms.map(item => `
    <div class="term">
      <strong>${esc(item.term)}</strong>
      <span class="muted">${esc(item.copy)}</span>
    </div>
  `).join("");
}

function renderGates(data) {
  $("gate-table").innerHTML = data.gates.map(gate => `
    <tr>
      <td><strong>${esc(gate.name)}</strong></td>
      <td>${fmtGate(gate.ok)}</td>
      <td>${esc(gate.evidence)}</td>
    </tr>
  `).join("");
}

function renderRetired(data) {
  $("retired-list").innerHTML = data.retiredArtifacts.map(item => `
    <li class="warn"><span class="mono">${esc(item.path)}</span><br><span class="muted">${esc(item.reason)}</span></li>
  `).join("");
}

function renderArtifacts(data) {
  const entries = Object.values(ARTIFACTS);
  const loaded = entries.filter(item => state.health[item.path]?.ok).length;
  $("artifact-count").textContent = `${loaded}/${entries.length} loaded`;
  $("artifact-grid").innerHTML = entries.map(item => {
    const health = state.health[item.path] || { ok: false, label: "embedded", error: "using embedded snapshot" };
    const cls = health.ok ? "good" : health.label === "embedded" ? "warn" : "bad";
    const size = data.artifactSizes[item.path];
    return `
      <div class="artifact">
        <h3>
          <span>${esc(item.label)}</span>
          <span class="pill ${cls}">${esc(health.label)}</span>
        </h3>
        <div class="path mono">${esc(item.path)}</div>
        <div class="note">${health.ok ? `Fetched ${fmtSize(size)}` : esc(health.error || "not fetched")}</div>
      </div>
    `;
  }).join("");
}

function renderAll() {
  const data = deriveDashboard();
  renderVerdict(data);
  renderStrategyOverview(data);
  renderReplay(data);
  $("footer").textContent = `Rendered ${new Date().toLocaleString()} from ${data.loadedFrom}.`;
}

async function fetchJson(key, path) {
  try {
    const res = await fetch(`${path}?t=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    state.loaded[key] = json;
    state.health[path] = { ok: true, label: "loaded" };
    return json;
  } catch (error) {
    state.health[path] = { ok: false, label: "embedded", error: error.message };
    return null;
  }
}

async function loadArtifacts() {
  renderAll();
  const loads = Object.entries(ARTIFACTS).map(([key, info]) => fetchJson(key, info.path));
  const runLoads = RUN_ARTIFACTS.map(info => fetchJson(`run:${info.label}`, info.path));
  const runResults = await Promise.all(runLoads);
  state.runSummaries = runResults.filter(Boolean);
  await Promise.all(loads);
  renderAll();
}

document.addEventListener("change", event => {
  if (event.target && event.target.id === "replay-market-select") {
    state.selectedReplayMarket = event.target.value || "__all__";
    state.selectedReplayStrategy = "__all__";
    state.selectedReplayId = null;
    state.replayWindow = "full";
    state.replayZoomById = {};
    state.replayYRangeById = {};
    state.replayDrag = null;
    renderReplay(deriveDashboard());
    return;
  }
  if (event.target && event.target.id === "replay-strategy-select") {
    state.selectedReplayStrategy = event.target.value || "__all__";
    state.selectedReplayId = null;
    state.replayWindow = "full";
    state.replayZoomById = {};
    state.replayYRangeById = {};
    state.replayDrag = null;
    renderReplay(deriveDashboard());
    return;
  }
  if (event.target && event.target.id === "replay-select") {
    state.selectedReplayId = event.target.value;
    state.replayWindow = "full";
    delete state.replayZoomById[state.selectedReplayId];
    delete state.replayYRangeById[state.selectedReplayId];
    renderReplay(deriveDashboard());
  }
});

document.addEventListener("click", event => {
  const tabButton = event.target.closest("[data-replay-tab]");
  if (tabButton) {
    state.replayTab = tabButton.dataset.replayTab || "backtest";
    state.selectedReplayId = null;
    state.selectedReplayMarket = "__all__";
    state.selectedReplayStrategy = "__all__";
    state.replayWindow = "full";
    state.replayZoomById = {};
    state.replayYRangeById = {};
    state.replayDrag = null;
    renderReplay(deriveDashboard());
    return;
  }
  const zoomButton = event.target.closest("[data-replay-zoom]");
  if (zoomButton) {
    zoomReplayChart(zoomButton.dataset.replayZoom === "in" ? 0.55 : 1.8);
    return;
  }
  const windowButton = event.target.closest("[data-replay-window]");
  if (windowButton) {
    state.replayWindow = windowButton.dataset.replayWindow || "full";
    if (state.selectedReplayId) {
      delete state.replayZoomById[state.selectedReplayId];
      delete state.replayYRangeById[state.selectedReplayId];
    }
    renderReplay(deriveDashboard());
    return;
  }
  const markerTarget = event.target.closest("[data-marker-index]");
  if (!markerTarget || !state.selectedReplayId) return;
  const nearestIndex = nearestReplayMarkerIndex(event);
  const index = nearestIndex ?? Number(markerTarget.dataset.markerIndex);
  if (!Number.isInteger(index)) return;
  state.selectedReplayMarkerById[state.selectedReplayId] = index;
  const detail = state.replayDetails[state.selectedReplayId];
  renderReplay(deriveDashboard());
});

document.addEventListener("keydown", event => {
  if (!["Enter", " "].includes(event.key)) return;
  const markerTarget = event.target.closest?.("[data-marker-index]");
  if (!markerTarget) return;
  event.preventDefault();
  markerTarget.click();
});

$("replay-chart").addEventListener("wheel", handleReplayWheel, { passive: false });
$("replay-chart").addEventListener("pointerdown", handleReplayPointerDown);
document.addEventListener("pointermove", handleReplayPointerMove);
document.addEventListener("pointerup", handleReplayPointerUp);
document.addEventListener("pointercancel", handleReplayPointerUp);

loadArtifacts();
</script>

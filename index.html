function replaySeriesCoverage(polyPoints, bookPoints) {
  if (!polyPoints.length || !bookPoints.length) {
    return { coverage: 0, startGapSec: null, endGapSec: null, maxGapSec: null };
  }
  const polyStart = Math.min(...polyPoints.map(point => point.offset));
  const polyEnd = Math.max(...polyPoints.map(point => point.offset));
  const bookStart = Math.min(...bookPoints.map(point => point.offset));
  const bookEnd = Math.max(...bookPoints.map(point => point.offset));
  const overlap = Math.max(0, Math.min(polyEnd, bookEnd) - Math.max(polyStart, bookStart));
  const span = Math.max(1, polyEnd - polyStart);
  const sortedBookOffsets = bookPoints
    .map(point => point.offset)
    .filter(value => Number.isFinite(value))
    .sort((a, b) => a - b);
  const maxGapSec = sortedBookOffsets.reduce((maxGap, value, index) => {
    if (index === 0) return maxGap;
    return Math.max(maxGap, value - sortedBookOffsets[index - 1]);
  }, 0);
  return {
    coverage: overlap / span,
    startGapSec: bookStart - polyStart,
    endGapSec: polyEnd - bookEnd,
    maxGapSec
  };
}

function sportsbookIntegrityCategoryLabel(category) {
  const labels = {
    complete_or_no_large_gap: "source OK",
    missing_native_5m_cache: "native 5m cache partial",
    source_event_not_listed_yet: "sportsbook listed late",
    source_market_or_point_absent: "requested line absent",
    source_stale_or_no_new_quote: "no fresh source quote",
    source_availability_gap: "source availability gap",
    no_odds_event_match: "no sportsbook match",
    matched_event_no_complete_line: "no complete sportsbook line",
    replay_materialization_bug: "replay data bug"
  };
  return labels[category] || String(category || "").replaceAll("_", " ");
}

function replaySportsbookQuality(event) {
  const integrity = event?.sportsbook_integrity_audit || {};
  if (integrity.category) {
    const category = sportsbookIntegrityCategoryLabel(integrity.category);
    const missing = Number(integrity.missing_5m_snapshots || 0);
    const expected = Number(integrity.expected_5m_snapshots || 0);
    if (integrity.category === "missing_native_5m_cache" && expected > 0) {
      return `${category} (${fmtInt(expected - missing)}/${fmtInt(expected)})`;
    }
    if (integrity.category === "replay_materialization_bug") {
      return category;
    }
    if (integrity.complete_5m_cache) {
      return `${category}; 5m cache complete`;
    }
    if (integrity.complete_15m_cache) {
      return `${category}; 15m cache complete`;
    }
    return category;
  }
  const audit = event?.sportsbook_gap_audit || {};
  const classes = audit.classifications || [];
  if (!audit || !Object.keys(audit).length) return "";
  if (!audit.sportsbook_match) return "no sportsbook match";
  const full5 = audit.full_window_cache_5m_audit || {};
  const expected5 = Number(full5.expected_snapshots || 0);
  const cached5 = Number(full5.cached_cache_snapshots || 0);
  const missing5 = Number(full5.missing_cache_snapshots || 0);
  if (expected5 > 0 && missing5 > 0) {
    return `5m cache partial ${fmtInt(cached5)}/${fmtInt(expected5)}`;
  }
  if (classes.includes("sportsbook_event_not_listed_until_after_clob_start")) {
    return "5m cache complete; sportsbook listed late";
  }
  if (classes.includes("sportsbook_last_quote_not_settlement")) {
    return "5m cache complete; sportsbook stops before settlement";
  }
  if (classes.includes("source_quote_gap_cache_complete")) {
    return "5m cache complete; source quote gap";
  }
  if (expected5 > 0 && missing5 === 0) return "5m cache complete";
  return "15m cache complete";
}

function gapLabel(seconds, earlyText, lateText) {
  if (seconds === null || !Number.isFinite(seconds)) return "";
  if (Math.abs(seconds) < 60) return "aligned";
  const hours = Math.abs(seconds) / 3600;
  const value = hours >= 24 ? `${(hours / 24).toFixed(1)}d` : `${hours.toFixed(1)}h`;
  return seconds < 0 ? `${value} ${earlyText}` : `${value} ${lateText}`;
}

function durationLabel(seconds) {
  if (seconds === null || !Number.isFinite(seconds)) return "";
  const hours = Math.abs(seconds) / 3600;
  if (hours < 1) return `${Math.round(Math.abs(seconds) / 60)}m`;
  return hours >= 24 ? `${(hours / 24).toFixed(1)}d` : `${hours.toFixed(1)}h`;
}

function replayPath(points, key, sx, sy) {
  return points
    .filter(point => point[key] !== null)
    .map(point => `${sx(point.offset).toFixed(1)},${sy(point[key]).toFixed(1)}`)
    .join(" ");
}

function replaySegmentPaths(points, key, sx, sy, maxGapSec = 30 * 60) {
  const rows = points
    .filter(point => point[key] !== null)
    .sort((a, b) => a.offset - b.offset);
  const segments = [];
  let current = [];
  rows.forEach(point => {
    const previous = current[current.length - 1];
    if (previous && point.offset - previous.offset > maxGapSec) {
      if (current.length >= 2) segments.push(current);
      current = [];
    }
    current.push(point);
  });
  if (current.length >= 2) segments.push(current);
  return segments.map(segment => replayPath(segment, key, sx, sy));
}

function replayMarkerLabel(marker) {
  const action = marker?.action || "MARK";
  if (action === "BUY") return "Buy";
  if (action === "SETTLEMENT") return "Resolution";
  return marker?.horizon_label ? `${marker.horizon_label} sell check` : (marker?.label || "Sell check");
}

function replayMarkerPnl(marker) {
  if (!marker || marker.pnl === undefined) return "--";
  return `${fmtSigned(marker.pnl)}${marker.roi !== undefined ? ` (${fmtPct(marker.roi)})` : ""}`;
}

function isPlotOnlyReplay(event) {
  return ["plot_only", "sportsbook_only", "pbp_only"].includes(event?.replay_kind) || event?.strategy === "market_replay_only";
}

function replayPosition(stats, marker = null) {
  const entry = num(stats?.entry_ask);
  const topAskSize = num(stats?.entry_ask_size);
  const targetStake = REPLAY_BANKROLL_USD * REPLAY_POSITION_FRACTION;
  const depthCap = entry && topAskSize ? entry * topAskSize : null;
  const stakeUsd = entry && entry > 0
    ? Math.max(0, Math.min(targetStake, depthCap ?? targetStake))
    : null;
  const contracts = entry && entry > 0 ? stakeUsd / entry : null;
  const pnlPerContract = marker ? num(marker.pnl) : num(stats?.pnl);
  const pnlUsd = contracts !== null && pnlPerContract !== null ? contracts * pnlPerContract : null;
  const markPrice = marker ? num(marker.price) : num(stats?.final_mid);
  const markValueUsd = contracts !== null && markPrice !== null ? contracts * markPrice : null;
  return {
    bankroll: REPLAY_BANKROLL_USD,
    targetStake,
    depthCap,
    stakeUsd,
    contracts,
    pnlUsd,
    markValueUsd,
    endBalance: pnlUsd === null ? null : REPLAY_BANKROLL_USD + pnlUsd,
    cappedByDepth: depthCap !== null && depthCap < targetStake
  };
}

function replayTradeAmount(stats) {
  const pos = replayPosition(stats);
  if (num(pos.stakeUsd) === null) return "--";
  const cap = pos.cappedByDepth ? " depth capped" : "";
  return pos.contracts === null
    ? `${fmtUsd(pos.stakeUsd)}${cap}`
    : `${fmtUsd(pos.stakeUsd)} / ${fmtPrice(pos.contracts, 2)} contracts${cap}`;
}

function replayDecisionRationale(event, marker) {
  const stats = event.stats || {};
  const action = marker?.action || "MARK";
  const pos = replayPosition(stats, marker);
  const side = replaySide(event);
  const sourceReason = String(marker?.reason || event?.rationale || "").trim();
  if (sourceReason) return sourceReason;
  if (action === "BUY") {
    return `${side.order} at ${fmtPrice(marker.price)} with ${fmtUsd(pos.stakeUsd)} from a ${fmtUsd(pos.bankroll, 0)} starting balance.`;
  }
  if (action === "SETTLEMENT") {
    return `Final result: ${stats.won ? "won" : "lost"} with dollar PnL ${fmtSignedUsd(pos.pnlUsd)} and ending balance ${fmtUsd(pos.endBalance)}.`;
  }
  return `${side.sell} check at ${fmtPrice(marker.price)}. If exited here, dollar PnL would be ${fmtSignedUsd(pos.pnlUsd)}.`;
}

function selectedReplayMarkerIndex(event) {
  const markers = event.markers || [];
  const stored = state.selectedReplayMarkerById[event.replay_id];
  let index = Number(stored);
  if (!Number.isInteger(index) || index < 0 || index >= markers.length) {
    if (state.replayWindow === "movement") {
      index = markers.findIndex(marker => marker.action === "SETTLEMENT");
    }
    if (!Number.isInteger(index) || index < 0) index = 0;
  }
  state.selectedReplayMarkerById[event.replay_id] = index;
  return index;
}

function replayOffsetFromIso(event, isoValue) {
  const start = Date.parse(event?.series_start_ts);
  const ts = Date.parse(isoValue || "");
  if (!Number.isFinite(start) || !Number.isFinite(ts)) return null;
  return (ts - start) / 1000;
}

function setWindowButtonState() {
  document.querySelectorAll("[data-replay-window]").forEach(button => {
    button.classList.toggle("active", button.dataset.replayWindow === state.replayWindow);
  });
}

function replayMarkerOffsets(markers) {
  return markers.map(marker => num(marker.offset_sec)).filter(value => value !== null);
}

function clampReplayRange(minX, maxX, fullMin, fullMax) {
  const fullSpan = Math.max(1, fullMax - fullMin);
  const minSpan = Math.min(fullSpan, 5 * 60);
  let nextMin = Number.isFinite(minX) ? minX : fullMin;
  let nextMax = Number.isFinite(maxX) ? maxX : fullMax;
  if (nextMax - nextMin < minSpan) {
    const mid = (nextMin + nextMax) / 2;
    nextMin = mid - minSpan / 2;
    nextMax = mid + minSpan / 2;
  }
  if (nextMax - nextMin >= fullSpan * 0.995) {
    return { minX: fullMin, maxX: fullMax };
  }
  if (nextMin < fullMin) {
    nextMax += fullMin - nextMin;
    nextMin = fullMin;
  }
  if (nextMax > fullMax) {
    nextMin -= nextMax - fullMax;
    nextMax = fullMax;
  }
  nextMin = Math.max(fullMin, nextMin);
  nextMax = Math.min(fullMax, nextMax);
  return { minX: nextMin, maxX: nextMax };
}

function clampReplayYRange(minY, maxY) {
  const fullMin = 0;
  const fullMax = 1;
  const fullSpan = fullMax - fullMin;
  const minSpan = 0.02;
  let nextMin = Number.isFinite(minY) ? minY : fullMin;
  let nextMax = Number.isFinite(maxY) ? maxY : fullMax;
  if (nextMax - nextMin < minSpan) {
    const mid = (nextMin + nextMax) / 2;
    nextMin = mid - minSpan / 2;
    nextMax = mid + minSpan / 2;
  }
  if (nextMax - nextMin >= fullSpan * 0.995) {
    return { minY: fullMin, maxY: fullMax };
  }
  if (nextMin < fullMin) {
    nextMax += fullMin - nextMin;
    nextMin = fullMin;
  }
  if (nextMax > fullMax) {
    nextMin -= nextMax - fullMax;
    nextMax = fullMax;
  }
  nextMin = Math.max(fullMin, nextMin);
  nextMax = Math.min(fullMax, nextMax);
  return { minY: nextMin, maxY: nextMax };
}

function replayWindowStats(points, minX, maxX) {
  const values = [];
  points.forEach(point => {
    if (point.offset < minX || point.offset > maxX) return;
    Object.entries(point).forEach(([key, value]) => {
      if (key !== "offset" && value !== null) values.push(value);
    });
  });
  if (!values.length) return { count: 0, spread: 0 };
  return {
    count: values.length,
    spread: Math.max(...values) - Math.min(...values)
  };
}

function activeMovementBounds(points, markers, event, fullMin, fullMax) {
  const settlementMarker = [...markers].reverse().find(marker => marker.action === "SETTLEMENT");
  const settlementOffset = num(settlementMarker?.offset_sec);
  const eventEndOffset = replayOffsetFromIso(event, event?.event_end_ts);
  const anchor = settlementOffset ?? eventEndOffset ?? fullMax;
  const windowSec = Math.min(6 * 3600, Math.max(10 * 60, fullMax - fullMin));
  let minX = Math.max(fullMin, anchor - windowSec);
  let maxX = Math.min(fullMax, anchor + 10 * 60);
  if (maxX - minX < 10 * 60) {
    minX = Math.max(fullMin, maxX - 10 * 60);
  }

  const current = replayWindowStats(points, minX, maxX);
  if (current.count >= 10 && current.spread >= 0.03) {
    return { minX, maxX };
  }

  let best = { minX, maxX, spread: current.spread, count: current.count };
  const step = Math.max(1, Math.floor(points.length / 180));
  for (let i = 0; i < points.length; i += step) {
    const start = points[i].offset;
    const end = Math.min(fullMax, start + windowSec);
    const stats = replayWindowStats(points, start, end);
    if (stats.count >= 10 && stats.spread > best.spread) {
      best = { minX: start, maxX: end, spread: stats.spread, count: stats.count };
    }
  }
  return { minX: best.minX, maxX: best.maxX };
}

function replayWindowBounds(points, markers, selectedMarker, event) {
  const markerOffsets = replayMarkerOffsets(markers);
  const fullMin = Math.min(...points.map(point => point.offset), ...markerOffsets);
  const fullMax = Math.max(...points.map(point => point.offset), ...markerOffsets);
  const buyMarker = markers.find(marker => marker.action === "BUY") || markers[0];
  const buyOffset = num(buyMarker?.offset_sec) ?? fullMin;
  const focusOffset = num(selectedMarker?.offset_sec) ?? buyOffset;
  const action = selectedMarker?.action || "BUY";
  let minX = fullMin;
  let maxX = fullMax;
  if (state.replayWindow === "movement") {
    const active = activeMovementBounds(points, markers, event, fullMin, fullMax);
    minX = active.minX;
    maxX = active.maxX;
  } else if (state.replayWindow === "trade") {
    const settlementMarker = [...markers].reverse().find(marker => marker.action === "SETTLEMENT");
    const settlementOffset = num(settlementMarker?.offset_sec) ?? fullMax;
    minX = Math.min(buyOffset, focusOffset) - 15 * 60;
    maxX = Math.max(settlementOffset, focusOffset, buyOffset) + 15 * 60;
  } else if (state.replayWindow !== "full" && action === "SETTLEMENT") {
    minX = focusOffset - 90 * 60;
    maxX = focusOffset + 10 * 60;
  } else if (state.replayWindow !== "full" && action === "MARK" && focusOffset - buyOffset <= 90 * 60) {
    minX = buyOffset - 10 * 60;
    maxX = buyOffset + 90 * 60;
  } else if (state.replayWindow !== "full") {
    minX = focusOffset - 10 * 60;
    maxX = focusOffset + 90 * 60;
  }
  minX = Math.max(fullMin, minX);
  maxX = Math.min(fullMax, maxX);
  if (focusOffset > maxX) {
    maxX = Math.min(fullMax, focusOffset + 10 * 60);
    minX = Math.max(fullMin, maxX - 90 * 60);
  }
  if (maxX - minX < 10 * 60) {
    maxX = Math.min(fullMax, minX + 10 * 60);
  }
  const zoom = state.replayZoomById[event?.replay_id];
  if (zoom && Number.isFinite(zoom.minX) && Number.isFinite(zoom.maxX)) {
    const clamped = clampReplayRange(zoom.minX, zoom.maxX, fullMin, fullMax);
    minX = clamped.minX;
    maxX = clamped.maxX;
  }
  return { minX, maxX, fullMin, fullMax };
}

function xTicksFor(event, minX, maxX, plotW) {
  const span = Math.max(1, maxX - minX);
  const targetCount = Math.max(3, Math.floor(plotW / 125));
  const intervals = [
    60, 5 * 60, 15 * 60, 30 * 60, 3600, 2 * 3600,
    3 * 3600, 6 * 3600, 12 * 3600, 86400, 2 * 86400,
    3 * 86400, 7 * 86400
  ];
  const interval = intervals.find(candidate => Math.ceil(span / candidate) <= targetCount) || intervals[intervals.length - 1];
  const startEpoch = Date.parse(event?.series_start_ts || "");
  if (!Number.isFinite(startEpoch)) {
    return Array.from({ length: targetCount }, (_, index) => {
      if (targetCount === 1) return minX;
      return minX + (span * index) / (targetCount - 1);
    });
  }
  const startSec = startEpoch / 1000;
  const firstTickEpoch = Math.ceil((startSec + minX) / interval) * interval;
  const ticks = [];
  for (let epoch = firstTickEpoch; epoch <= startSec + maxX + 1; epoch += interval) {
    const offset = epoch - startSec;
    if (offset >= minX - 1 && offset <= maxX + 1) ticks.push(offset);
  }
  if (!ticks.some(value => Math.abs(value - minX) < interval * 0.25)) ticks.unshift(minX);
  if (!ticks.some(value => Math.abs(value - maxX) < interval * 0.25)) ticks.push(maxX);
  return ticks.slice(0, 10);
}

function drawReplayLineOverlayChart(event, overlayEvents) {
  const svg = $("replay-chart");
  renderSportsbookSourceToggles({ sportsbook_series_schema: [] });
  const rows = overlayEvents
    .map((lineEvent, index) => ({
      event: lineEvent,
      index,
      label: replayLineValue(lineEvent),
      points: replayPricePoints(lineEvent)
    }))
    .filter(row => row.points.length);
  if (!rows.length) {
    state.replayChart = null;
    svg.innerHTML = `<text x="24" y="42" fill="#627083">No price series available for these lines.</text>`;
    if ($("chart-title")) $("chart-title").textContent = "All lines";
    setChartSourceNote("");
    renderChartLegend([]);
    return;
  }

  const width = 940;
  const height = 470;
  const pad = { left: 54, right: 142, top: 22, bottom: 54 };
  const timelineH = 76;
  const plotW = width - pad.left - pad.right;
  const plotH = height - pad.top - pad.bottom - timelineH;
  const priceBottom = pad.top + plotH;
  const allPoints = rows.flatMap(row => row.points);
  const bounds = replayWindowBounds(allPoints, [], null, event);
  const spanX = Math.max(1, bounds.maxX - bounds.minX);
  const visibleRows = rows.map(row => ({
    ...row,
    points: row.points.filter(point => point.offset >= bounds.minX && point.offset <= bounds.maxX)
  })).filter(row => row.points.length);
  const priceValues = visibleRows
    .flatMap(row => row.points.flatMap(point => [point.selected, point.other]))
    .filter(value => value !== null);
  let minY = Math.max(0, Math.min(...priceValues));
  let maxY = Math.min(1, Math.max(...priceValues));
  const span = Math.max(0.01, maxY - minY);
  minY = Math.max(0, minY - Math.max(0.02, span * 0.16));
  maxY = Math.min(1, maxY + Math.max(0.02, span * 0.16));
  if (maxY - minY < 0.06) {
    const mid = (maxY + minY) / 2;
    minY = Math.max(0, mid - 0.03);
    maxY = Math.min(1, mid + 0.03);
  }
  const savedY = state.replayYRangeById[event.replay_id];
  if (savedY && Number.isFinite(savedY.minY) && Number.isFinite(savedY.maxY)) {
    const clampedY = clampReplayYRange(savedY.minY, savedY.maxY);
    minY = clampedY.minY;
    maxY = clampedY.maxY;
  }
  const sx = value => pad.left + ((value - bounds.minX) / spanX) * plotW;
  const sy = value => pad.top + (1 - ((value - minY) / Math.max(0.0001, maxY - minY))) * plotH;
  let yTicks = [0, 0.25, 0.5, 0.75, 1].filter(value => value >= minY - 0.001 && value <= maxY + 0.001);
  if (yTicks.length < 3) {
    yTicks = [minY, (minY + maxY) / 2, maxY];
  }
  const xTicks = xTicksFor(event, bounds.minX, bounds.maxX, plotW);
  const grid = yTicks.map(value => `
    <line x1="${pad.left}" y1="${sy(value).toFixed(1)}" x2="${width - pad.right}" y2="${sy(value).toFixed(1)}" stroke="#e9edf3" />
    <text x="${pad.left - 10}" y="${(sy(value) + 4).toFixed(1)}" text-anchor="end" fill="#627083" font-size="12">${fmtPrice(value, 2)}</text>
  `).join("");
  const xAxis = xTicks.map(value => `
    <text x="${sx(value).toFixed(1)}" y="${height - 14}" text-anchor="middle" fill="#627083" font-size="12">${esc(replayAxisLabel(event, value, spanX))}</text>
  `).join("");
  const pbpOverlay = replayPbpOverlay(event, bounds, sx, pad, plotH, {
    maxDots: REPLAY_PBP_OVERLAY_DOT_LIMIT,
    laneY: priceBottom + 38,
    laneHeight: 58,
  });
  const colors = ["#1f77b4", "#f59e0b", "#16a34a", "#7c3aed", "#dc2626", "#0891b2", "#be123c", "#0f766e", "#a16207", "#9333ea"];
  const lineSvg = visibleRows.map(row => {
    const color = colors[row.index % colors.length];
    const widthPx = row.index === 0 ? 2.7 : 1.7;
    const selected = replaySegmentPaths(row.points, "selected", sx, sy).map(path =>
      `<polyline class="chart-series" points="${path}" fill="none" stroke="${color}" stroke-width="${widthPx}" opacity="${row.index === 0 ? "0.96" : "0.68"}" />`
    ).join("");
    const other = replaySegmentPaths(row.points, "other", sx, sy).map(path =>
      `<polyline class="chart-series" points="${path}" fill="none" stroke="${color}" stroke-width="1.45" stroke-dasharray="5 4" opacity="0.36" />`
    ).join("");
    return `${other}${selected}`;
  }).join("");
  const labels = visibleRows.slice(0, 10).map(row => {
    const last = [...row.points].reverse().find(point => point.selected !== null);
    if (!last) return "";
    const color = colors[row.index % colors.length];
    const y = Math.max(pad.top + 12, Math.min(priceBottom - 8, sy(last.selected)));
    return `<text x="${(width - pad.right + 10).toFixed(1)}" y="${y.toFixed(1)}" fill="${color}" font-size="12" font-weight="800" paint-order="stroke" stroke="#fff" stroke-width="4">${esc(shortLabel(row.label, 17))}</text>`;
  }).join("");
  const expected = event.line_overlay_expected_count || rows.length;
  const loadedText = rows.length === expected
    ? `${fmtInt(rows.length)} lines`
    : `${fmtInt(rows.length)} / ${fmtInt(expected)} lines loaded`;
  if ($("chart-title")) $("chart-title").textContent = `${replayEventNameValue(event)} | All lines`;
  const pbpNote = pbpOverlayNote(pbpOverlay);
  setChartSourceNote(`${loadedText}; solid = selected side, dashed = other side${pbpNote ? `; ${pbpNote}` : ""}. Pick one line for sportsbook source overlays.`);
  renderChartLegend([
    { label: "Selected side", color: "#1f77b4", opacity: 0.9 },
    { label: "Other side", color: "#1f77b4", opacity: 0.36 },
    ...pbpOverlay.legendItems
  ]);
  setWindowButtonState();
  state.replayChart = {
    replayId: event.replay_id,
    minX: bounds.minX,
    maxX: bounds.maxX,
    fullMin: bounds.fullMin,
    fullMax: bounds.fullMax,
    pad,
    plotW,
    plotH,
    minY,
    maxY,
    width,
    height,
    teamSelectionKey: replayTeamSelectionKey(event),
    markerPoints: [],
    pbpPoints: pbpOverlay.points || [],
    pbpTimeline: pbpOverlay.timeline || [],
    pbpLane: pbpOverlay.lane || null
  };
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.innerHTML = `
    <rect x="0" y="0" width="${width}" height="${height}" fill="#fff" pointer-events="none" />
    ${pbpOverlay.band}
    ${grid}
    <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${priceBottom}" stroke="#d8dee8" />
    <line x1="${pad.left}" y1="${priceBottom}" x2="${width - pad.right}" y2="${priceBottom}" stroke="#d8dee8" />
    ${lineSvg}
    ${labels}
    <rect data-chart-pan="xy" x="${pad.left}" y="${pad.top}" width="${plotW}" height="${plotH}" fill="transparent" pointer-events="all" cursor="move" />
    <rect data-chart-pan="y-scale" x="0" y="${pad.top}" width="${pad.left}" height="${plotH}" fill="transparent" pointer-events="all" cursor="ns-resize" />
    <rect data-chart-pan="x-scale" x="${pad.left}" y="${priceBottom}" width="${plotW}" height="${height - priceBottom}" fill="transparent" pointer-events="all" cursor="ew-resize" />
    ${pbpOverlay.svg}
    ${xAxis}
  `;
}

function drawPbpOnlyReplayChart(event) {
  const svg = $("replay-chart");
  const timeline = replayPbpTimeline(event)
    .filter(play => Number.isFinite(play.offset))
    .sort((a, b) => a.offset - b.offset || a.index - b.index);
  if (!timeline.length) return false;
  const width = 940;
  const height = 300;
  const pad = { left: 54, right: 54, top: 26, bottom: 44 };
  const plotH = 120;
  const plotW = width - pad.left - pad.right;
  const priceBottom = pad.top + plotH;
  const fullMin = Math.min(...timeline.map(play => play.offset));
  const fullMax = Math.max(...timeline.map(play => play.offset), fullMin + 1);
  const zoom = state.replayZoomById[event?.replay_id];
  let bounds = { minX: fullMin, maxX: fullMax, fullMin, fullMax };
  if (zoom && Number.isFinite(zoom.minX) && Number.isFinite(zoom.maxX)) {
    bounds = { ...clampReplayRange(zoom.minX, zoom.maxX, fullMin, fullMax), fullMin, fullMax };
  }
  const spanX = Math.max(1, bounds.maxX - bounds.minX);
  const sx = value => pad.left + ((value - bounds.minX) / spanX) * plotW;
  const xTicks = xTicksFor(event, bounds.minX, bounds.maxX, plotW);
  const xAxis = xTicks.map(value => `
    <text x="${sx(value).toFixed(1)}" y="${height - 17}" text-anchor="middle" fill="#627083" font-size="12">${esc(replayAxisLabel(event, value, spanX))}</text>
  `).join("");
  const pbpOverlay = replayPbpOverlay(event, bounds, sx, pad, plotH, {
    laneY: priceBottom + 54,
    laneHeight: 66,
  });
  setWindowButtonState();
  setChartSourceNote(`PBP-only game replay; ${pbpOverlayNote(pbpOverlay)}. No Telonex CLOB or Odds API price series is available for this game yet.`);
  renderChartLegend(pbpOverlay.legendItems);
  state.replayChart = {
    replayId: event.replay_id,
    minX: bounds.minX,
    maxX: bounds.maxX,
    fullMin: bounds.fullMin,
    fullMax: bounds.fullMax,
    pad,
    plotW,
    plotH,
    minY: 0,
    maxY: 1,
    width,
    height,
    teamSelectionKey: replayTeamSelectionKey(event),
    markerPoints: [],
    pbpPoints: pbpOverlay.points || [],
    pbpTimeline: pbpOverlay.timeline || [],
    pbpLane: pbpOverlay.lane || null
  };
  if ($("chart-title")) $("chart-title").textContent = `${replayEventNameValue(event)} | Play-by-play`;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.innerHTML = `
    <rect x="0" y="0" width="${width}" height="${height}" fill="#fff" pointer-events="none" />
    <rect x="${pad.left}" y="${pad.top}" width="${plotW}" height="${plotH}" rx="8" fill="#f8fafc" stroke="#e2e8f0" pointer-events="none" />
    <text x="${(pad.left + 14).toFixed(1)}" y="${(pad.top + 30).toFixed(1)}" fill="#1f2937" font-size="15" font-weight="900">Game-state replay</text>
    <text x="${(pad.left + 14).toFixed(1)}" y="${(pad.top + 54).toFixed(1)}" fill="#627083" font-size="12" font-weight="700">Use the game time bar below to inspect score, players, and play-by-play without future stats leaking in.</text>
    ${pbpOverlay.band}
    <rect data-chart-pan="x-scale" x="${pad.left}" y="${priceBottom}" width="${plotW}" height="${height - priceBottom}" fill="transparent" pointer-events="all" cursor="ew-resize" />
    ${pbpOverlay.svg}
    ${xAxis}
  `;
  return true;
}

function drawReplayChart(event) {
  renderReplayPlayerCards(event);
  renderReplayPbpPanel(event);
  const overlayEvents = Array.isArray(event?.line_overlay_events)
    ? event.line_overlay_events.filter(item => item && !item.load_error)
    : [];
  if (overlayEvents.length > 1) {
    drawReplayLineOverlayChart(event, overlayEvents);
    return;
  }
  const svg = $("replay-chart");
  const polyPoints = replayPricePoints(event);
  const bookPoints = sportsbookPricePoints(event);
  const sourceMode = state.selectedReplayDataSource || "polymarket";
  const showPolymarket = sourceMode === "polymarket" || sourceMode === "both" || !bookPoints.length;
  const showSportsbooks = bookPoints.length && (sourceMode === "sportsbooks" || sourceMode === "sportsbook_books" || sourceMode === "both");
  const sportsbookKeys = sportsbookKeysForMode(event, sourceMode);
  renderSportsbookSourceToggles(event);
  const points = showPolymarket && showSportsbooks
    ? [...polyPoints, ...bookPoints]
    : showPolymarket ? polyPoints : bookPoints;
  const selectedIndex = selectedReplayMarkerIndex(event);
  const markers = (event.markers || [])
    .map((marker, index) => ({ ...marker, index }))
    .filter(marker => num(marker.offset_sec) !== null && num(marker.price) !== null);
  setWindowButtonState();
  if (!points.length) {
    if (drawPbpOnlyReplayChart(event)) return;
    state.replayChart = null;
    svg.innerHTML = `<text x="24" y="42" fill="#627083">No price series available for this game.</text>`;
    if ($("chart-title")) $("chart-title").textContent = "Minute replay";
    setChartSourceNote("");
    renderChartLegend([]);
    return;
  }

  const width = 940;
  const height = 470;
  const pad = { left: 54, right: 128, top: 22, bottom: 54 };
  const timelineH = 76;
  const plotW = width - pad.left - pad.right;
  const plotH = height - pad.top - pad.bottom - timelineH;
  const priceBottom = pad.top + plotH;
  const selectedMarker = markers.find(marker => marker.index === selectedIndex);
  const bounds = replayWindowBounds(points, markers, selectedMarker, event);
  let visiblePoints = points.filter(point => point.offset >= bounds.minX && point.offset <= bounds.maxX);
  if (visiblePoints.length < 2) {
    visiblePoints = points;
    bounds.minX = Math.min(...points.map(point => point.offset));
    bounds.maxX = Math.max(...points.map(point => point.offset));
  }
  const visiblePolyPoints = polyPoints.filter(point => point.offset >= bounds.minX && point.offset <= bounds.maxX);
  const visibleBookPoints = bookPoints.filter(point => point.offset >= bounds.minX && point.offset <= bounds.maxX);
  const visibleMarkers = markers.filter(marker => num(marker.offset_sec) >= bounds.minX && num(marker.offset_sec) <= bounds.maxX);
  const spanX = Math.max(1, bounds.maxX - bounds.minX);
  if ($("chart-title")) {
    $("chart-title").textContent = replayChartTitle(event);
  }
  const clobPointCount = event.series_point_count ?? polyPoints.length;
  const sportsbookPointCount = event.sportsbook_series_point_count ?? bookPoints.length;
  const sportsbookQuality = replaySportsbookQuality(event);
  let sourceNoteBuilder = pbpText => `${fmtInt(clobPointCount)} CLOB minute pts${pbpText ? `; ${pbpText}` : ""}`;
  if (showPolymarket && showSportsbooks) {
    const coverage = replaySeriesCoverage(polyPoints, bookPoints);
    const startGap = gapLabel(coverage.startGapSec, "early", "late");
    const endGap = gapLabel(coverage.endGapSec, "late", "early");
    const gapBits = [];
    if (startGap && startGap !== "aligned") gapBits.push(`start ${startGap}`);
    if (endGap && endGap !== "aligned") gapBits.push(`end ${endGap}`);
    if (coverage.maxGapSec && coverage.maxGapSec > 30 * 60) gapBits.push(`max gap ${durationLabel(coverage.maxGapSec)}`);
    const gapText = gapBits.length ? `; ${gapBits.join(", ")}` : "";
    const qualityText = sportsbookQuality ? ` ${sportsbookQuality}.` : "";
    sourceNoteBuilder = pbpText => `${fmtInt(clobPointCount)} CLOB minute pts; ${fmtInt(sportsbookPointCount)} book snapshots; book span ${fmtPct(coverage.coverage)}${gapText}${pbpText ? `; ${pbpText}` : ""}.${qualityText} Consensus is recomputed from available sportsbook source columns; books show last quoted fair %, not settlement.`;
  } else if (showSportsbooks) {
    const qualityText = sportsbookQuality ? ` ${sportsbookQuality}.` : "";
    sourceNoteBuilder = pbpText => `${fmtInt(sportsbookPointCount)} sportsbook snapshots${pbpText ? `; ${pbpText}` : ""}.${qualityText} Consensus is recomputed from available sportsbook source columns; books show last quoted fair %, not settlement.`;
  }
  const priceValues = [
    ...(showPolymarket ? visiblePolyPoints.flatMap(point => [point.selected, point.other]) : []),
    ...(showSportsbooks ? visibleBookPoints.flatMap(point => sportsbookKeys.map(name => point[name])) : []),
    ...visibleMarkers.map(marker => num(marker.price))
  ].filter(value => value !== null);
  let minY = Math.max(0, Math.min(...priceValues));
  let maxY = Math.min(1, Math.max(...priceValues));
  const span = Math.max(0.01, maxY - minY);
  minY = Math.max(0, minY - Math.max(0.02, span * 0.18));
  maxY = Math.min(1, maxY + Math.max(0.02, span * 0.18));
  if (maxY - minY < 0.06) {
    const mid = (maxY + minY) / 2;
    minY = Math.max(0, mid - 0.03);
    maxY = Math.min(1, mid + 0.03);
  }
  const savedY = state.replayYRangeById[event.replay_id];
  if (savedY && Number.isFinite(savedY.minY) && Number.isFinite(savedY.maxY)) {
    const clampedY = clampReplayYRange(savedY.minY, savedY.maxY);
    minY = clampedY.minY;
    maxY = clampedY.maxY;
  }
  const sx = value => pad.left + ((value - bounds.minX) / spanX) * plotW;
  const sy = value => pad.top + (1 - ((value - minY) / Math.max(0.0001, maxY - minY))) * plotH;
  const pbpOverlay = replayPbpOverlay(event, bounds, sx, pad, plotH, {
    laneY: priceBottom + 38,
    laneHeight: 58,
  });
  setChartSourceNote(sourceNoteBuilder(pbpOverlayNote(pbpOverlay)));
  let yTicks = [0, 0.25, 0.5, 0.75, 1].filter(value => value >= minY - 0.001 && value <= maxY + 0.001);
  if (yTicks.length < 3) {
    yTicks = [minY, (minY + maxY) / 2, maxY];
  }
  const xTicks = xTicksFor(event, bounds.minX, bounds.maxX, plotW);

  const grid = yTicks.map(value => `
    <line x1="${pad.left}" y1="${sy(value).toFixed(1)}" x2="${width - pad.right}" y2="${sy(value).toFixed(1)}" stroke="#e9edf3" />
    <text x="${pad.left - 10}" y="${(sy(value) + 4).toFixed(1)}" text-anchor="end" fill="#627083" font-size="12">${fmtPrice(value, 2)}</text>
  `).join("");
  const xAxis = xTicks.map(value => `
    <text x="${sx(value).toFixed(1)}" y="${height - 14}" text-anchor="middle" fill="#627083" font-size="12">${esc(replayAxisLabel(event, value, spanX))}</text>
  `).join("");
  const activeTeamSide = selectedReplayTeamSide(event);
  const activeTeam = replayTeamForSide(event, activeTeamSide);
  const activeLineKey = replayLineKeyForTeam(event, activeTeam);
  const lineEmphasis = key => {
    if (!activeLineKey || key === activeLineKey) return { width: 4, opacity: 0.98, labelWeight: 900 };
    return { width: 2, opacity: 0.28, labelWeight: 700 };
  };
  const lineLabel = (rows, key, label, color, dy = 0) => {
    const last = [...rows].reverse().find(point => point[key] !== null);
    if (!last) return "";
    const y = Math.max(pad.top + 12, Math.min(priceBottom - 8, sy(last[key]) + dy));
    const emphasis = lineEmphasis(key);
    return `<text x="${(width - pad.right + 10).toFixed(1)}" y="${y.toFixed(1)}" fill="${color}" font-size="12" font-weight="${emphasis.labelWeight}" opacity="${emphasis.opacity}" paint-order="stroke" stroke="#fff" stroke-width="4">${esc(shortLabel(label, 16))}</text>`;
  };
  const sportsbookColors = ["#16a34a", "#7c3aed", "#dc2626", "#0891b2", "#9333ea", "#65a30d", "#be123c", "#0f766e", "#a16207"];
  const polyLabels = showPolymarket ? [
    lineLabel(visiblePolyPoints, "selected", `PM ${event.outcome || "Selected"}`, "#1f77b4", -22),
    lineLabel(visiblePolyPoints, "other", `PM ${event.other_outcome || "Other side"}`, "#f59e0b", 18)
  ] : [];
  const bookLabels = showSportsbooks ? sportsbookKeys.slice(0, 6).map((key, index) => {
    const selectedColor = sportsbookColors[index % sportsbookColors.length];
    return lineLabel(visibleBookPoints, key, key, selectedColor, index * 18 - 26);
  }) : [];
  const lineLabels = [...polyLabels, ...bookLabels].join("");
  const sportsbookLines = showSportsbooks ? sportsbookKeys.flatMap((key, index) => {
    const selectedColor = sportsbookColors[index % sportsbookColors.length];
    const isConsensus = key === "Sportsbook consensus";
    const selectedOpacity = isConsensus ? 0.95 : 0.58;
    const selectedWidth = isConsensus ? 3 : 1.8;
    const selectedSegments = replaySegmentPaths(visibleBookPoints, key, sx, sy);
    return [
      ...selectedSegments.map(path => `<polyline class="chart-series" points="${path}" fill="none" stroke="${selectedColor}" stroke-width="${selectedWidth}" stroke-dasharray="none" opacity="${selectedOpacity}" />`),
    ];
  }).join("") : "";
  const sportsbookDots = showSportsbooks ? sportsbookKeys.flatMap((key, index) => {
    const selectedColor = sportsbookColors[index % sportsbookColors.length];
    const isConsensus = key === "Sportsbook consensus";
    return [
      ...visibleBookPoints
        .filter(point => point[key] !== null)
        .map(point => `<circle cx="${sx(point.offset).toFixed(1)}" cy="${sy(point[key]).toFixed(1)}" r="${isConsensus ? "4.2" : "2.8"}" fill="${selectedColor}" opacity="${isConsensus ? "0.92" : "0.5"}" />`),
    ];
  }).join("") : "";
  const bookOffsets = bookPoints.map(point => point.offset).filter(value => Number.isFinite(value));
  const bookCoverageBand = showSportsbooks && bookOffsets.length
    ? (() => {
        const start = Math.max(bounds.minX, Math.min(...bookOffsets));
        const end = Math.min(bounds.maxX, Math.max(...bookOffsets));
        if (end <= start) return "";
        return `<rect x="${sx(start).toFixed(1)}" y="${pad.top}" width="${Math.max(2, sx(end) - sx(start)).toFixed(1)}" height="${plotH}" fill="#16a34a" opacity="0.055" pointer-events="none" />`;
      })()
    : "";
  const sportsbookNotice = showSportsbooks && bookPoints.length && !visibleBookPoints.length
    ? `<text x="${(pad.left + 14).toFixed(1)}" y="${(pad.top + 24).toFixed(1)}" fill="#166534" font-size="12" font-weight="800">Sportsbook data exists outside this zoom window. Reset the graph or drag right to view it.</text>`
    : "";
  const legendItems = [
    ...(showPolymarket ? [
      { label: `Polymarket ${event.outcome || "selected"}`, color: "#1f77b4", opacity: lineEmphasis("selected").opacity },
      { label: `Polymarket ${event.other_outcome || "opposite"}`, color: "#f59e0b", opacity: lineEmphasis("other").opacity }
    ] : []),
    ...(showSportsbooks ? sportsbookKeys.flatMap((key, index) => {
      const selectedColor = sportsbookColors[index % sportsbookColors.length];
      const sourceLabel = key === "Sportsbook consensus" ? "Sportsbook consensus" : key;
      return [
        { label: sourceLabel, color: selectedColor, opacity: key === "Sportsbook consensus" ? 0.95 : 0.58 }
      ];
    }) : []),
    ...pbpOverlay.legendItems
  ];
  renderChartLegend(legendItems);
  const selectedStyle = lineEmphasis("selected");
  const otherStyle = lineEmphasis("other");
  const polyLines = showPolymarket ? `
    <polyline class="chart-series" points="${replayPath(visiblePolyPoints, "other", sx, sy)}" fill="none" stroke="#f59e0b" stroke-width="${otherStyle.width}" stroke-dasharray="none" opacity="${otherStyle.opacity}" />
    <polyline class="chart-series" points="${replayPath(visiblePolyPoints, "selected", sx, sy)}" fill="none" stroke="#1f77b4" stroke-width="${selectedStyle.width}" stroke-dasharray="none" opacity="${selectedStyle.opacity}" />
  ` : "";
  const markerPoints = [];
  const markerSvg = visibleMarkers.map(marker => {
    const action = marker.action || "MARK";
    const color = action === "BUY" ? "#067647" : action === "SETTLEMENT" ? "#1d2430" : "#b42318";
    const x = sx(num(marker.offset_sec));
    const y = sy(num(marker.price));
    markerPoints.push({ index: marker.index, x, y });
    const labelY = action === "BUY" ? y - 12 : y + 22;
    const displayLabel = action === "MARK" ? (marker.horizon_label || "mark") : action === "SETTLEMENT" ? "settle" : "buy";
    const isSelected = marker.index === selectedIndex;
    return `
      <g class="chart-marker" data-marker-index="${marker.index}" tabindex="0" role="button" aria-label="${esc(replayMarkerLabel(marker))}">
        <title>${esc(`${marker.label}: ${marker.reason || ""}`)}</title>
        <circle class="chart-marker-hit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="16" fill="transparent" stroke="transparent" />
        <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isSelected ? "8.5" : "6.5"}" fill="${color}" stroke="${isSelected ? "#1d2430" : "#fff"}" stroke-width="${isSelected ? "3" : "2"}" />
        <text x="${x.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="middle" fill="${color}" font-size="11" font-weight="700">${esc(displayLabel)}</text>
      </g>
    `;
  }).join("");

  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  state.replayChart = {
    replayId: event.replay_id,
    minX: bounds.minX,
    maxX: bounds.maxX,
    fullMin: bounds.fullMin,
    fullMax: bounds.fullMax,
    pad,
    plotW,
    plotH,
    minY,
    maxY,
    width,
    height,
    teamSelectionKey: replayTeamSelectionKey(event),
    markerPoints,
    pbpPoints: pbpOverlay.points || [],
    pbpTimeline: pbpOverlay.timeline || [],
    pbpLane: pbpOverlay.lane || null
  };
  svg.innerHTML = `
    <rect x="0" y="0" width="${width}" height="${height}" fill="#fff" pointer-events="none" />
    ${bookCoverageBand}
    ${pbpOverlay.band}
    ${grid}
    <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${priceBottom}" stroke="#d8dee8" />
    <line x1="${pad.left}" y1="${priceBottom}" x2="${width - pad.right}" y2="${priceBottom}" stroke="#d8dee8" />
    ${sportsbookLines}
    ${sportsbookDots}
    ${polyLines}
    ${lineLabels}
    ${sportsbookNotice}
    <rect data-chart-pan="xy" x="${pad.left}" y="${pad.top}" width="${plotW}" height="${plotH}" fill="transparent" pointer-events="all" cursor="move" />
    <rect data-chart-pan="y-scale" x="0" y="${pad.top}" width="${pad.left}" height="${plotH}" fill="transparent" pointer-events="all" cursor="ns-resize" />
    <rect data-chart-pan="x-scale" x="${pad.left}" y="${priceBottom}" width="${plotW}" height="${height - priceBottom}" fill="transparent" pointer-events="all" cursor="ew-resize" />
    ${pbpOverlay.svg}
    ${xAxis}
    ${markerSvg}
  `;
}

function setReplayZoomRange(minX, maxX) {
  const chart = state.replayChart;
  if (!chart?.replayId) return;
  const range = clampReplayRange(minX, maxX, chart.fullMin, chart.fullMax);
  const fullSpan = Math.max(1, chart.fullMax - chart.fullMin);
  if (range.maxX - range.minX >= fullSpan * 0.995) {
    delete state.replayZoomById[chart.replayId];
  } else {
    state.replayZoomById[chart.replayId] = range;
  }
  renderReplay(deriveDashboard());
}

function setReplayYRange(minY, maxY, shouldRender = true) {
  const chart = state.replayChart;
  if (!chart?.replayId) return;
  const range = clampReplayYRange(minY, maxY);
  if (range.maxY - range.minY >= 0.995) {
    delete state.replayYRangeById[chart.replayId];
  } else {
    state.replayYRangeById[chart.replayId] = range;
  }
  if (shouldRender) renderReplay(deriveDashboard());
}

function replaySvgPointFromPointer(event) {
  const svg = $("replay-chart");
  const chart = state.replayChart;
  if (!svg || !chart) return null;
  const rect = svg.getBoundingClientRect();
  const x = ((event.clientX - rect.left) / Math.max(1, rect.width)) * chart.width;
  const y = ((event.clientY - rect.top) / Math.max(1, rect.height)) * chart.height;
  return { x, y };
}

function replaySvgOffsetFromPointer(event) {
  const chart = state.replayChart;
  const point = replaySvgPointFromPointer(event);
  if (!point || !chart) return null;
  const x = point.x;
  const clampedX = Math.max(chart.pad.left, Math.min(chart.pad.left + chart.plotW, x));
  return chart.minX + ((clampedX - chart.pad.left) / chart.plotW) * (chart.maxX - chart.minX);
}

function replaySvgValueFromPointer(event) {
  const chart = state.replayChart;
  const point = replaySvgPointFromPointer(event);
  if (!point || !chart) return null;
  const y = Math.max(chart.pad.top, Math.min(chart.pad.top + chart.plotH, point.y));
  return chart.maxY - ((y - chart.pad.top) / chart.plotH) * (chart.maxY - chart.minY);
}

function nearestReplayMarkerIndex(event) {
  const chart = state.replayChart;
  const point = replaySvgPointFromPointer(event);
  if (!point || !chart?.markerPoints?.length) return null;
  let best = null;
  for (const marker of chart.markerPoints) {
    const dx = marker.x - point.x;
    const dy = marker.y - point.y;
    const dist2 = dx * dx + dy * dy;
    if (!best || dist2 < best.dist2) {
      best = { index: marker.index, dist2 };
    }
  }
  return best && best.dist2 <= 24 * 24 ? best.index : null;
}

function nearestReplayPbpIndex(event, options = {}) {
  const chart = state.replayChart;
  const point = replaySvgPointFromPointer(event);
  if (!point || !chart?.pbpPoints?.length) return null;
  const maxDistance = Number.isFinite(options.maxDistance) ? options.maxDistance : 32;
  const horizontalOnly = Boolean(options.horizontalOnly);
  if (horizontalOnly) {
    const points = chart.pbpPoints;
    const clampedX = Math.max(points[0].x, Math.min(points[points.length - 1].x, point.x));
    let lo = 0;
    let hi = points.length - 1;
    while (lo < hi) {
      const mid = Math.floor((lo + hi) / 2);
      if (points[mid].x < clampedX) lo = mid + 1;
      else hi = mid;
    }
    const prev = points[Math.max(0, lo - 1)];
    const next = points[lo];
    const best = !prev || Math.abs(next.x - clampedX) <= Math.abs(prev.x - clampedX) ? next : prev;
    return Math.abs(best.x - point.x) <= maxDistance ? best.index : null;
  }
  let best = null;
  for (const play of chart.pbpPoints) {
    const dx = play.x - point.x;
    const dy = play.y - point.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    if (!best || distance < best.distance) {
      best = { index: play.index, distance };
    }
  }
  return best && best.distance <= maxDistance ? best.index : null;
}

function updateReplayPbpTimelineVisual(event) {
  const chart = state.replayChart;
  const lane = chart?.pbpLane;
  const timeline = chart?.pbpTimeline || [];
  if (!chart || !lane || !timeline.length) return;
  const selectedIndex = selectedReplayPbpIndex(event);
  const selectedPlay = selectedIndex === null ? timeline[0] : (timeline.find(play => play.index === selectedIndex) || timeline[0]);
  const selectedPosition = Math.max(0, timeline.findIndex(play => play.index === selectedPlay.index));
  const selectedX = Math.max(lane.padLeft, Math.min(lane.padLeft + lane.bandW, lane.padLeft + ((selectedPlay.offset - lane.barMinX) / Math.max(1, lane.barSpan)) * lane.bandW));
  const label = `${pbpPlayLabel(selectedPlay)}${selectedPlay.score ? ` | ${selectedPlay.score}` : ""}`;
  const labelX = Math.max(lane.padLeft + 6, Math.min(lane.padLeft + lane.bandW - lane.labelW - 6, selectedX - lane.labelW / 2));
  const svg = $("replay-chart");
  svg?.querySelector(".pbp-timebar-progress")?.setAttribute("x2", selectedX.toFixed(1));
  const cursor = svg?.querySelector(".pbp-timebar-cursor");
  cursor?.setAttribute("x1", selectedX.toFixed(1));
  cursor?.setAttribute("x2", selectedX.toFixed(1));
  svg?.querySelector(".pbp-timebar-thumb")?.setAttribute("cx", selectedX.toFixed(1));
  svg?.querySelector(".pbp-selected-label-bg")?.setAttribute("x", labelX.toFixed(1));
  const text = svg?.querySelector(".pbp-selected-label-text");
  if (text) {
    text.setAttribute("x", (labelX + 10).toFixed(1));
    text.textContent = shortLabel(label, 34);
  }
  const timelineTarget = svg?.querySelector("[data-pbp-timeline]");
  timelineTarget?.setAttribute("aria-valuenow", String(selectedPosition));
  timelineTarget?.setAttribute("aria-valuetext", label);
}

function renderReplaySnapshotOnly() {
  const event = state.activeReplayEvent;
  if (!event || event.replay_id !== state.selectedReplayId) {
    renderReplay(deriveDashboard());
    return;
  }
  renderReplayPlayerCards(event);
  renderReplayPbpPanel(event);
  updateReplayPbpTimelineVisual(event);
}

function scheduleReplaySnapshotUpdate() {
  if (state.replaySnapshotFrame) return;
  state.replaySnapshotFrame = requestAnimationFrame(() => {
    state.replaySnapshotFrame = null;
    renderReplaySnapshotOnly();
  });
}

function selectReplayPbpFromPointer(event, options = {}) {
  if (!state.selectedReplayId) return false;
  const index = nearestReplayPbpIndex(event, { maxDistance: Infinity, horizontalOnly: true });
  if (!Number.isInteger(index)) return false;
  const changed = state.selectedReplayPbpById[state.selectedReplayId] !== index;
  state.selectedReplayPbpById[state.selectedReplayId] = index;
  if (changed || options.forceRender) {
    if (options.schedule) scheduleReplaySnapshotUpdate();
    else renderReplaySnapshotOnly();
  }
  return true;
}

function stepReplayPbpSelection(delta) {
  if (!state.selectedReplayId || !state.replayChart?.pbpPoints?.length) return false;
  const points = [...state.replayChart.pbpPoints].sort((a, b) => a.x - b.x || a.index - b.index);
  const current = state.selectedReplayPbpById[state.selectedReplayId];
  let pos = points.findIndex(point => point.index === current);
  if (pos < 0) pos = 0;
  const nextPos = delta === Infinity
    ? points.length - 1
    : delta === -Infinity
      ? 0
      : Math.max(0, Math.min(points.length - 1, pos + delta));
  const nextIndex = points[nextPos]?.index;
  if (!Number.isInteger(nextIndex)) return false;
  const changed = state.selectedReplayPbpById[state.selectedReplayId] !== nextIndex;
  state.selectedReplayPbpById[state.selectedReplayId] = nextIndex;
  if (changed) renderReplaySnapshotOnly();
  return changed;
}

function zoomReplayChart(factor, anchorOffset = null) {
  const chart = state.replayChart;
  if (!chart?.replayId) return;
  const span = Math.max(1, chart.maxX - chart.minX);
  const anchor = Number.isFinite(anchorOffset) ? anchorOffset : chart.minX + span / 2;
  const nextMin = anchor - (anchor - chart.minX) * factor;
  const nextMax = anchor + (chart.maxX - anchor) * factor;
  setReplayZoomRange(nextMin, nextMax);
}

function zoomReplayY(factor, anchorValue = null) {
  const chart = state.replayChart;
  if (!chart?.replayId) return;
  const span = Math.max(0.0001, chart.maxY - chart.minY);
  const anchor = Number.isFinite(anchorValue) ? anchorValue : chart.minY + span / 2;
  const nextMin = anchor - (anchor - chart.minY) * factor;
  const nextMax = anchor + (chart.maxY - anchor) * factor;
  setReplayYRange(nextMin, nextMax);
}

function saveReplayXRange(replayId, range, fullMin, fullMax) {
  const fullSpan = Math.max(1, fullMax - fullMin);
  if (range.maxX - range.minX >= fullSpan * 0.995) {
    delete state.replayZoomById[replayId];
  } else {
    state.replayZoomById[replayId] = range;
  }
}

function saveReplayYRange(replayId, range) {
  if (range.maxY - range.minY >= 0.995) {
    delete state.replayYRangeById[replayId];
  } else {
    state.replayYRangeById[replayId] = range;
  }
}

function handleReplayWheel(event) {
  if (!event.target.closest?.("#replay-chart")) return;
  event.preventDefault();
  const chart = state.replayChart;
  const point = replaySvgPointFromPointer(event);
  const factor = event.deltaY < 0 ? 0.72 : 1.38;
  if (chart && point && point.x <= chart.pad.left + 8) {
    zoomReplayY(factor, replaySvgValueFromPointer(event));
  } else {
    zoomReplayChart(factor, replaySvgOffsetFromPointer(event));
  }
}

function handleReplayPointerDown(event) {
  const timelineTarget = event.target.closest?.("[data-pbp-timeline]");
  if (timelineTarget && event.target.closest?.("#replay-chart")) {
    event.preventDefault();
    event.currentTarget?.setPointerCapture?.(event.pointerId);
    $("replay-chart")?.classList.add("scrubbing");
    state.replayDrag = {
      mode: "pbp-timebar",
      pointerId: event.pointerId
    };
    selectReplayPbpFromPointer(event, { forceRender: true });
    return;
  }
  if (
    !event.target.closest?.("#replay-chart")
    || event.target.closest?.("[data-marker-index]")
    || event.target.closest?.("[data-pbp-index]")
  ) return;
  const chart = state.replayChart;
  if (!chart?.replayId) return;
  const point = replaySvgPointFromPointer(event);
  const hitMode = event.target.closest?.("[data-chart-pan]")?.dataset?.chartPan;
  const mode = hitMode || (
    point && point.x <= chart.pad.left + 14 ? "y-scale"
      : point && point.y >= chart.height - chart.pad.bottom - 10 ? "x-scale"
        : "xy"
  );
  event.preventDefault();
  event.currentTarget?.setPointerCapture?.(event.pointerId);
  $("replay-chart").classList.add("dragging");
  state.replayDrag = {
    mode,
    clientX: event.clientX,
    clientY: event.clientY,
    minX: chart.minX,
    maxX: chart.maxX,
    fullMin: chart.fullMin,
    fullMax: chart.fullMax,
    minY: chart.minY,
    maxY: chart.maxY,
    plotW: chart.plotW,
    plotH: chart.plotH,
    height: chart.height,
    width: chart.width
  };
}

function scheduleReplayRender() {
  if (state.replayRenderFrame) return;
  state.replayRenderFrame = requestAnimationFrame(() => {
    state.replayRenderFrame = null;
    renderReplay(deriveDashboard());
  });
}

function handleReplayPointerMove(event) {
  const drag = state.replayDrag;
  const chart = state.replayChart;
  if (!drag || !chart?.replayId) return;
  if (drag.mode === "pbp-timebar") {
    event.preventDefault();
    selectReplayPbpFromPointer(event, { schedule: true });
    return;
  }
  const svg = $("replay-chart");
  const rect = svg.getBoundingClientRect();
  const dxSvg = ((event.clientX - drag.clientX) / Math.max(1, rect.width)) * drag.width;
  const dySvg = ((event.clientY - drag.clientY) / Math.max(1, rect.height)) * drag.height;
  if (drag.mode === "x-scale") {
    const factor = Math.exp(dxSvg / 260);
    const anchor = drag.minX + (drag.maxX - drag.minX) / 2;
    const range = clampReplayRange(
      anchor - (anchor - drag.minX) * factor,
      anchor + (drag.maxX - anchor) * factor,
      drag.fullMin,
      drag.fullMax
    );
    saveReplayXRange(chart.replayId, range, drag.fullMin, drag.fullMax);
  } else if (drag.mode === "y-scale") {
    const factor = Math.exp(dySvg / 220);
    const anchor = drag.minY + (drag.maxY - drag.minY) / 2;
    const range = clampReplayYRange(
      anchor - (anchor - drag.minY) * factor,
      anchor + (drag.maxY - anchor) * factor
    );
    saveReplayYRange(chart.replayId, range);
  } else if (drag.mode === "xy") {
    const span = drag.maxX - drag.minX;
    const delta = -(dxSvg / Math.max(1, drag.plotW)) * span;
    const range = clampReplayRange(drag.minX + delta, drag.maxX + delta, drag.fullMin, drag.fullMax);
    saveReplayXRange(chart.replayId, range, drag.fullMin, drag.fullMax);
    const ySpan = drag.maxY - drag.minY;
    const yDelta = (dySvg / Math.max(1, drag.plotH)) * ySpan;
    const yRange = clampReplayYRange(drag.minY + yDelta, drag.maxY + yDelta);
    saveReplayYRange(chart.replayId, yRange);
  }
  scheduleReplayRender();
}

function handleReplayPointerUp(event) {
  state.replayDrag = null;
  const svg = $("replay-chart");
  svg?.classList.remove("dragging");
  svg?.classList.remove("scrubbing");
  if (event?.pointerId !== undefined) svg?.releasePointerCapture?.(event.pointerId);
}

async function fetchReplayDetail(event) {
  try {
    const res = await fetch(`${event.replay_path}?t=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.replayDetails[event.replay_id] = await res.json();
  } catch (error) {
    state.replayDetails[event.replay_id] = {
      ...event,
      series_points: [],
      markers: [],
      load_error: error.message
    };
  }
}

async function loadReplayDetail(event) {
  if (!event?.replay_id || !event?.replay_path || state.replayLoading[event.replay_id]) return;
  state.replayLoading[event.replay_id] = true;
  try {
    await fetchReplayDetail(event);
  } finally {
    state.replayLoading[event.replay_id] = false;
    if (state.selectedReplayId === event.replay_id) {
      renderReplay(deriveDashboard());
    }
  }
}

async function loadReplayDetails(events) {
  const missing = events.filter(event =>
    event?.replay_id
    && event?.replay_path
    && !state.replayDetails[event.replay_id]
    && !state.replayLoading[event.replay_id]
  );
  if (!missing.length) return;
  const key = missing.map(event => event.replay_id).sort().join("|");
  if (state.replayBulkLoading[key]) return;
  state.replayBulkLoading[key] = true;
  missing.forEach(event => { state.replayLoading[event.replay_id] = true; });
  try {
    await Promise.all(missing.map(fetchReplayDetail));
  } finally {
    missing.forEach(event => { state.replayLoading[event.replay_id] = false; });
    delete state.replayBulkLoading[key];
    renderReplay(deriveDashboard());
  }
}

function renderDecisionPanel(event, marker) {
  const stats = event.stats || {};
  const action = marker?.action || "MARK";
  const pos = replayPosition(stats, marker);
  const side = replaySide(event);
  const actionText = action === "BUY"
    ? (side.side === "OUTCOME" ? "BUY" : `BUY ${side.side}`)
    : action === "SETTLEMENT" ? "RESULT"
      : (side.side === "OUTCOME" ? "SELL" : `SELL ${side.side}`);
  const actionTone = action === "BUY" ? "good" : action === "SETTLEMENT" ? (stats.won ? "good" : "bad") : "warn";
  const title =
    action === "BUY" ? side.order
      : action === "SETTLEMENT" ? `Final result: ${stats.won ? "won" : "lost"}`
        : `${side.sell} check`;
  $("decision-title").textContent = marker ? title : "No point selected";
  $("decision-action").textContent = actionText;
  $("decision-action").className = `pill ${actionTone}`;
  if (!marker) {
    $("decision-action").textContent = isPlotOnlyReplay(event) ? "PLOT" : "--";
    $("decision-action").className = "pill info";
    $("replay-kv").innerHTML = "";
    $("replay-rationale").innerHTML = `<strong>Rationale</strong><span>No buy or mark point is available for this game.</span>`;
    return;
  }
  const priceName = action === "BUY" ? "Buy price" : action === "SETTLEMENT" ? "Final price" : "Sell price";
  const markerRoi = action === "BUY" ? 0 : (marker.roi !== undefined ? marker.roi : stats.roi);
  const rows = [
    ["Action", action === "BUY" ? "Buy" : action === "SETTLEMENT" ? "Result" : "Sell"],
    ["Side", side.display],
    ["Start balance", fmtUsd(pos.bankroll, 0)],
    ["Position", replayTradeAmount(stats)],
    ["Contracts", pos.contracts === null ? "--" : fmtPrice(pos.contracts, 2)],
    ["Time", replayTimeLabel(event, marker.offset_sec)],
    [priceName, fmtPrice(marker.price)],
    [action === "BUY" ? "Cost" : "Value", action === "BUY" ? fmtUsd(pos.stakeUsd) : fmtUsd(pos.markValueUsd)],
    ["PnL", `${fmtSignedUsd(pos.pnlUsd)} (${fmtPct(markerRoi)})`],
    ["End balance", fmtUsd(pos.endBalance)]
  ];
  $("replay-kv").innerHTML = rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  $("replay-rationale").innerHTML = `<strong>Rationale</strong><span>${esc(replayDecisionRationale(event, marker))}</span>`;
}

      ["Feature coverage", coverageLine],
      ["Replay status", "game playback data not loaded"]
    ].map(([k, v]) => `<div class="event-stat"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join("");
    $("decision-title").textContent = "No point selected";
    $("decision-action").textContent = "--";
    $("decision-action").className = "pill info";
    $("replay-kv").innerHTML = "";
    $("replay-rationale").innerHTML = `<strong>Rationale</strong><span>The protected Telonex/Odds dataset is available, but replay playback depends on the compact game replay bundle loading successfully. Check the artifact health panel if this empty state appears on the public dashboard.</span>`;
    renderReplayModelContext(null);
    drawReplayChart({ series_points: [] });
    return;
  }

  state.selectedReplayMarket = renderReplayFilterOptions(
    marketSelect,
    replayOptionCounts(events, replayMarketValue, replayEventIdentity),
    state.selectedReplayMarket,
    "All markets",
    { noun: "game" }
  );
  const marketFiltered = events.filter(item => replayFilterMatch(replayMarketValue(item), state.selectedReplayMarket));
  state.selectedReplayDate = renderReplayDateOptions(
    dateSelect,
    replayOptionCounts(marketFiltered, replayDateValue, replayEventIdentity),
    state.selectedReplayDate
  );
  const dateFiltered = marketFiltered.filter(item => replayFilterMatch(replayDateValue(item), state.selectedReplayDate));
  state.selectedReplayEventName = renderReplayFilterOptions(
    select,
    replayGameOptionCounts(dateFiltered),
    state.selectedReplayEventName,
    "All games",
    { showCounts: false }
  );
  const eventFiltered = dateFiltered.filter(item => replayFilterMatch(replayGameKey(item), state.selectedReplayEventName));
  state.selectedReplayBetType = renderReplayFilterOptions(
    betTypeSelect,
    replayOptionCounts(eventFiltered, replayBetTypeValue, item => item?.replay_id || replayLineValue(item)),
    state.selectedReplayBetType,
    "All bet types",
    { noun: "line" }
  );
  const betTypeFiltered = eventFiltered.filter(item => replayFilterMatch(replayBetTypeValue(item), state.selectedReplayBetType));
  const hasSpecificReplayGame = state.selectedReplayEventName !== "__all__";
  if (hasSpecificReplayGame) {
    lineSelect.disabled = false;
    state.selectedReplayLine = renderReplayFilterOptions(
      lineSelect,
      replayOptionCounts(betTypeFiltered, replayLineValue, item => item?.replay_id || `${replayLineValue(item)}||${item?.outcome || ""}`),
      state.selectedReplayLine,
      "All lines",
      { noun: "line", includeAll: false }
    );
  } else {
    state.selectedReplayLine = "__none__";
    lineSelect.disabled = true;
    lineSelect.innerHTML = `<option value="__none__">Pick a game first</option>`;
    lineSelect.value = "__none__";
  }
  const lineFiltered = hasSpecificReplayGame
    ? betTypeFiltered.filter(item => replayFilterMatch(replayLineValue(item), state.selectedReplayLine))
    : betTypeFiltered;
  state.selectedReplayStrategy = renderReplayStrategyOptions(
    strategySelect,
    lineFiltered,
    state.selectedReplayStrategy
  );
  const filteredEvents = replayEventsForFilters(events);
  const uniqueFilteredEvents = replayUniqueEventCount(filteredEvents);
  const uniqueTotalEvents = replayUniqueEventCount(events);
  $("replay-count-pill").textContent = filteredEvents.length
    ? `${fmtInt(uniqueFilteredEvents)} / ${fmtInt(uniqueTotalEvents)} games | ${fmtInt(filteredEvents.length)} replay lines`
    : "no matching games";
  $("replay-count-pill").className = "pill " + (filteredEvents.length ? "info" : "warn");

  if (!filteredEvents.length) {
    state.activeReplayEvent = null;
    select.disabled = false;
    betTypeSelect.disabled = false;
    dateSelect.disabled = false;
    lineSelect.disabled = true;
    $("replay-data-source-select").disabled = true;
    $("replay-data-source-select").innerHTML = `<option>No sources loaded</option>`;
    select.innerHTML = `<option>No games for selected filters</option>`;
    lineSelect.innerHTML = `<option>No lines for selected filters</option>`;
    $("replay-title").textContent = "No matching game";
    $("replay-event-strip").innerHTML = "";
    $("decision-title").textContent = "No point selected";
    $("decision-action").textContent = "--";
    $("decision-action").className = "pill info";
    $("replay-kv").innerHTML = "";
    $("replay-rationale").innerHTML = `<strong>Rationale</strong><span>No replay game matches the selected filters.</span>`;
    renderReplayModelContext(null);
    drawReplayChart({ series_points: [] });
    return;
  }

  const selectedStillExists = filteredEvents.some(event => event.replay_id === state.selectedReplayId);
  if (!state.selectedReplayId || !selectedStillExists) {
    state.selectedReplayId = filteredEvents[0].replay_id;
  }
  const event = filteredEvents.find(item => item.replay_id === state.selectedReplayId) || filteredEvents[0];
  select.value = state.selectedReplayEventName;
  lineSelect.value = state.selectedReplayLine;
  const showAllLines = false;

  const detail = state.replayDetails[event.replay_id];
  if (!detail) {
    state.activeReplayEvent = null;
    const stats = event.stats || {};
    const pos = replayPosition(stats);
    const side = replaySide(event);
    const plotOnly = isPlotOnlyReplay(event);
    const dataSourceSelect = $("replay-data-source-select");
    if (dataSourceSelect) {
      dataSourceSelect.disabled = true;
      dataSourceSelect.innerHTML = `<option>Loading sources...</option>`;
    }
    $("replay-title").textContent = replayExperimentLabel(event);
    $("replay-event-strip").innerHTML = [
      ["Model", PRIMARY_MODEL_STRATEGY],
      ["Market", marketLabel(event)],
      ["Bet type", showAllLines && state.selectedReplayBetType === "__all__" ? "All bet types" : replayBetTypeValue(event)],
      ["Date", replayDateLabel(event)],
      ["Line", showAllLines ? `All lines (${fmtInt(filteredEvents.length)})` : replayLineValue(event)],
      ["Order", showAllLines ? "Plot all selected sides" : plotOnly ? `Plot ${side.display}` : side.order],
      ["Resolution", event.resolution_status || "loading detail"],
      ["Position", plotOnly ? "--" : replayTradeAmount(stats)],
      ["Game PnL", plotOnly ? "--" : `${fmtSignedUsd(pos.pnlUsd)} (${fmtPct(stats.roi)})`],
      ["Start", plotOnly ? `${fmtInt(event.series_point_count)} points` : fmtUsd(pos.bankroll, 0)]
    ].map(([k, v]) => `<div class="event-stat"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join("");
    $("decision-title").textContent = "Loading game";
    $("decision-action").textContent = "--";
    $("decision-action").className = "pill info";
    $("replay-kv").innerHTML = "";
    $("replay-rationale").innerHTML = `<strong>Rationale</strong><span>Loading minute-level prices.</span>`;
    renderReplayModelContext(event);
    drawReplayChart({ series_points: [] });
    loadReplayDetail(event);
    return;
  }

  const lineOverlayDetails = showAllLines
    ? filteredEvents.map(item => state.replayDetails[item.replay_id]).filter(Boolean)
    : [];
  const fullEvent = {
    ...mergeReplayDetailEvent(event, detail),
    line_overlay_events: lineOverlayDetails,
    line_overlay_expected_count: showAllLines ? filteredEvents.length : 0
  };
  state.activeReplayEvent = fullEvent;
  const stats = fullEvent.stats || {};
  const finalPos = replayPosition(stats);
  const side = replaySide(fullEvent);
  const plotOnly = isPlotOnlyReplay(fullEvent);
  const pricePoints = replayPricePoints(fullEvent);
  const lastPricePoint = pricePoints[pricePoints.length - 1];
  const markers = fullEvent.markers || [];
  const markerIndex = selectedReplayMarkerIndex(fullEvent);
  const selectedMarker = markers[markerIndex];
  const dataSourceSelect = $("replay-data-source-select");
  if (dataSourceSelect) {
    const options = replayDataSourceOptions(fullEvent);
    const enabledValues = options.filter(option => option.enabled).map(option => option.value);
    if (enabledValues.includes(state.preferredReplayDataSource) && state.selectedReplayDataSource !== state.preferredReplayDataSource) {
      state.selectedReplayDataSource = state.preferredReplayDataSource;
    } else if (!enabledValues.includes(state.selectedReplayDataSource)) {
      state.selectedReplayDataSource = enabledValues.includes(state.preferredReplayDataSource)
        ? state.preferredReplayDataSource
        : enabledValues.includes("both")
          ? "both"
          : enabledValues[0] || "polymarket";
    }
    dataSourceSelect.disabled = false;
    dataSourceSelect.innerHTML = options.map(option => `
      <option value="${esc(option.value)}" ${option.enabled ? "" : "disabled"}>${esc(option.label)}${option.enabled ? "" : " (no data)"}</option>
    `).join("");
    dataSourceSelect.value = state.selectedReplayDataSource;
  }
  $("replay-title").textContent = replayExperimentLabel(fullEvent);
  const dataLabel = showAllLines
    ? "All-line CLOB overlay"
    : state.selectedReplayDataSource === "pbp"
      ? "Play-by-play only"
      : state.selectedReplayDataSource === "sportsbooks"
      ? "Sportsbook sources"
      : state.selectedReplayDataSource === "both"
        ? "CLOB + sportsbook sources"
        : "Polymarket CLOB";
  const qualityLabel = replaySportsbookQuality(fullEvent);
  $("replay-event-strip").innerHTML = [
    ["Model", PRIMARY_MODEL_STRATEGY],
    ["Market", marketLabel(fullEvent)],
    ["Bet type", showAllLines && state.selectedReplayBetType === "__all__" ? "All bet types" : replayBetTypeValue(fullEvent)],
    ["Date", replayDateLabel(fullEvent)],
    ["Line", showAllLines ? `All lines (${fmtInt(filteredEvents.length)})` : replayLineValue(fullEvent)],
    ["Data", qualityLabel && !showAllLines ? `${dataLabel}; ${qualityLabel}` : dataLabel],
    ["Order", showAllLines ? "Plot all selected sides" : plotOnly ? `Plot ${side.display}` : side.order],
    ["Result", plotOnly ? "No trade" : stats.won ? "Won" : "Lost"],
    ["Resolution", replayResolutionLabel(fullEvent)],
    ["Position", plotOnly ? "--" : replayTradeAmount(stats)],
    ["Game PnL", plotOnly ? "--" : `${fmtSignedUsd(finalPos.pnlUsd)} (${fmtPct(stats.roi)})`],
    ["Start", plotOnly ? replayTimeLabel(fullEvent, 0) : fmtUsd(finalPos.bankroll, 0)],
    ["End", plotOnly ? replayTimeLabel(fullEvent, lastPricePoint?.offset) : fmtUsd(finalPos.endBalance)]
  ].map(([k, v]) => `<div class="event-stat"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join("");
  if (fullEvent.load_error) {
    $("decision-title").textContent = "Load failed";
    $("decision-action").textContent = "--";
    $("decision-action").className = "pill bad";
    $("replay-kv").innerHTML = "";
    $("replay-rationale").innerHTML = `<strong>Rationale</strong><span>Could not load game detail: ${esc(fullEvent.load_error)}</span>`;
  } else if (showAllLines) {
    $("decision-title").textContent = "All lines overlay";
    $("decision-action").textContent = "Plot only";
    $("decision-action").className = "pill info";
    $("replay-kv").innerHTML = [
      ["Loaded lines", `${fmtInt(lineOverlayDetails.length)} / ${fmtInt(filteredEvents.length)}`],
      ["Displayed game", replayEventNameValue(fullEvent)],
      ["Date", replayDateLabel(fullEvent)],
      ["Mode", "CLOB selected and other-side series"]
    ].map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
    $("replay-rationale").innerHTML = `<strong>Rationale</strong><span>All-line view overlays every matching line for this game. Select one line to inspect its trade markers, sportsbook source toggles, and rationale.</span>`;
  } else {
    renderDecisionPanel(fullEvent, selectedMarker);
  }
  renderReplayModelContext(fullEvent);
  drawReplayChart(fullEvent);
}

function renderArtifacts(data) {

  $("artifact-count").textContent = `${loaded}/${entries.length} loaded`;
  $("artifact-grid").innerHTML = entries.map(item => {
    const health = state.health[item.path] || { ok: false, label: "embedded", error: "using embedded snapshot" };
    const cls = health.ok ? "good" : health.label === "embedded" ? "warn" : "bad";
    const size = health.sizeBytes ?? data.artifactSizes[item.path];
    return `
      <div class="artifact">
        <h3>
          <span>${esc(item.label)}</span>
          <span class="pill ${cls}">${esc(health.label)}</span>
        </h3>
        <div class="path mono">${esc(item.path)}</div>
        <div class="note">${health.ok ? `Fetched ${fmtSize(size)}` : esc(health.error || "not fetched")}</div>
      </div>
    `;
  }).join("");
}

async function fetchJson(key, info) {
  const path = typeof info === "string" ? info : info.path;
  const candidates = [path, typeof info === "string" ? "" : info.rawPath].filter(Boolean);
  let lastError = null;
  for (const candidate of candidates) {
    try {
      const res = await fetch(`${candidate}${candidate.includes("?") ? "&" : "?"}v=${encodeURIComponent(DATA_VERSION)}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      state.loaded[key] = json;
      const sizeBytes = Number(res.headers.get("content-length"));
      state.health[path] = {
        ok: true,
        label: candidate === path ? "loaded" : "raw mirror",
        sizeBytes: Number.isFinite(sizeBytes) ? sizeBytes : undefined
      };
      return json;
    } catch (error) {
      lastError = error;
    }
  }
  state.health[path] = { ok: false, label: "embedded", error: lastError?.message || "not fetched" };
  return null;
}

async function loadArtifacts() {
  renderAll();
  const loads = Object.entries(ARTIFACTS).map(([key, info]) => fetchJson(key, info));
  const runLoads = RUN_ARTIFACTS.map(info => fetchJson(`run:${info.label}`, info));
  const runResults = await Promise.all(runLoads);
  state.runSummaries = runResults.filter(Boolean);
  await Promise.all(loads);
  renderAll();
}

  if (event.target?.matches?.("[data-sportsbook-source]")) {

    const keys = sportsbookSourceKeys(detail);

      .filter(input => input.checked)
      .map(input => input.dataset.sportsbookSource)
      .filter(key => keys.includes(key));

document.addEventListener("click", event => {
  const zoomButton = event.target.closest("[data-replay-zoom]");
  if (zoomButton) {
    zoomReplayChart(zoomButton.dataset.replayZoom === "in" ? 0.55 : 1.8);
    return;
  }
  const windowButton = event.target.closest("[data-replay-window]");
  if (windowButton) {
    state.replayWindow = windowButton.dataset.replayWindow || "full";
    if (state.selectedReplayId) {
      delete state.replayZoomById[state.selectedReplayId];
      delete state.replayYRangeById[state.selectedReplayId];
    }
    renderReplay(deriveDashboard());
    return;
  }
  const teamButton = event.target.closest("[data-replay-team-side]");
  if (teamButton) {
    const side = teamButton.dataset.replayTeamSide || "";
    const key = state.replayChart?.teamSelectionKey || state.selectedReplayId;
    if (side && key) {
      state.selectedReplayTeamSideById[key] = side;
      if (state.selectedReplayId) state.selectedReplayTeamSideById[state.selectedReplayId] = side;
      renderReplay(deriveDashboard());
    }
    return;
  }
  const pbpTarget = event.target.closest("[data-pbp-index], [data-pbp-timeline]");
  if (pbpTarget && state.selectedReplayId) {
    if (pbpTarget.matches("[data-pbp-timeline]")) {
      selectReplayPbpFromPointer(event, { forceRender: true });
      return;
    }
    const nearestIndex = nearestReplayPbpIndex(event);
    const index = nearestIndex ?? Number(pbpTarget.dataset.pbpIndex);
    if (Number.isInteger(index)) {
      state.selectedReplayPbpById[state.selectedReplayId] = index;
      renderReplaySnapshotOnly();
    }
    return;
  }
  const markerTarget = event.target.closest("[data-marker-index]");
  if (!markerTarget || !state.selectedReplayId) return;
  const nearestIndex = nearestReplayMarkerIndex(event);
  const index = nearestIndex ?? Number(markerTarget.dataset.markerIndex);
  if (!Number.isInteger(index)) return;
  state.selectedReplayMarkerById[state.selectedReplayId] = index;
  renderReplay(deriveDashboard());
});

document.addEventListener("keydown", event => {
  const timelineTarget = event.target.closest?.("[data-pbp-timeline]");
  if (timelineTarget && state.selectedReplayId) {
    if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
      event.preventDefault();
      stepReplayPbpSelection(-1);
      return;
    }
    if (event.key === "ArrowRight" || event.key === "ArrowUp") {
      event.preventDefault();
      stepReplayPbpSelection(1);
      return;
    }
    if (event.key === "Home") {
      event.preventDefault();
      stepReplayPbpSelection(-Infinity);
      return;
    }
    if (event.key === "End") {
      event.preventDefault();
      stepReplayPbpSelection(Infinity);
      return;
    }
  }
  if (!["Enter", " "].includes(event.key)) return;
  const markerTarget = event.target.closest?.("[data-marker-index]");
  const pbpTarget = event.target.closest?.("[data-pbp-index]");
  if (!markerTarget && !pbpTarget) return;
  event.preventDefault();
  (markerTarget || pbpTarget).click();
});

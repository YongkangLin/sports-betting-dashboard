<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Sports Betting Replay</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #1d2430;
    --muted: #627083;
    --line: #d8dee8;
    --soft-line: #e9edf3;
    --danger: #b42318;
    --danger-bg: #fff1ef;
    --warn: #9a5b00;
    --warn-bg: #fff7e6;
    --good: #067647;
    --good-bg: #ecfdf3;
    --info: #175cd3;
    --info-bg: #eff6ff;
    --shadow: 0 10px 30px rgba(29, 36, 48, 0.07);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }

  a {
    color: var(--info);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  .page {
    width: min(1440px, calc(100vw - 32px));
    margin: 0 auto;
    padding: 24px 0 40px;
  }

  .topbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 20px;
    align-items: start;
    padding: 24px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .eyebrow {
    margin: 0 0 6px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-size: clamp(28px, 4vw, 44px);
    line-height: 1.05;
  }

  h2 {
    margin: 0;
    font-size: 20px;
  }

  h3 {
    margin: 0;
    font-size: 15px;
  }

  .subtitle {
    max-width: 880px;
    margin: 12px 0 0;
    color: var(--muted);
  }

  .status-stack {
    display: grid;
    gap: 8px;
    justify-items: end;
    min-width: 150px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 28px;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    background: #f9fafb;
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
  }

  .pill.bad {
    border-color: #f1a6a0;
    color: var(--danger);
    background: var(--danger-bg);
  }

  .pill.warn {
    border-color: #f2d28c;
    color: var(--warn);
    background: var(--warn-bg);
  }

  .pill.good {
    border-color: #9bd9b8;
    color: var(--good);
    background: var(--good-bg);
  }

  .pill.info {
    border-color: #b9d3ff;
    color: var(--info);
    background: var(--info-bg);
  }

  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  .muted {
    color: var(--muted);
  }

  .grid {
    display: grid;
    gap: 16px;
  }

  .metrics {
    grid-template-columns: repeat(3, minmax(150px, 1fr));
  }

  .two {
    grid-template-columns: minmax(0, 1.2fr) minmax(360px, 0.8fr);
  }

  .plain-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .band {
    margin-top: 18px;
    padding: 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .section-head {
    display: flex;
    gap: 12px;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .section-head p {
    margin: 5px 0 0;
    color: var(--muted);
  }

  .metric {
    min-width: 0;
    min-height: 118px;
    padding: 14px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .metric-label {
    min-height: 18px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .metric-value {
    margin-top: 8px;
    font-size: 26px;
    font-weight: 850;
    line-height: 1.1;
    word-break: break-word;
  }

  .metric-note {
    margin-top: 8px;
    color: var(--muted);
    font-size: 13px;
  }

  .metric-help {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid var(--soft-line);
    color: var(--ink);
    font-size: 13px;
  }

  .strategy-overview {
    margin-top: 16px;
    padding: 16px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .strategy-overview h3 {
    margin: 0 0 12px;
    font-size: 18px;
  }

  .strategy-list {
    display: grid;
    gap: 12px;
  }

  .strategy-grid-head {
    display: grid;
    grid-template-columns: minmax(260px, 1.4fr) repeat(3, minmax(150px, 0.8fr));
    gap: 12px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .strategy-row {
    display: grid;
    grid-template-columns: minmax(260px, 1.4fr) repeat(3, minmax(150px, 0.8fr));
    gap: 12px;
    padding: 14px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fff;
  }

  .strategy-row strong {
    display: block;
    line-height: 1.2;
  }

  .strategy-row-head {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    justify-content: space-between;
  }

  .strategy-copy {
    margin-top: 10px;
    color: var(--muted);
  }

  .strategy-stat {
    min-width: 0;
    padding: 12px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .strategy-stat .metric-value {
    font-size: 22px;
  }

  .strategy-stat .metric-help {
    margin-top: 8px;
    padding-top: 0;
    border-top: 0;
    color: var(--muted);
  }

  .callout {
    padding: 16px;
    border: 1px solid #f1a6a0;
    border-radius: 8px;
    background: var(--danger-bg);
  }

  .callout strong {
    color: var(--danger);
  }

  .copy-list {
    display: grid;
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .copy-list li {
    padding: 10px 12px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .copy-list .bad {
    border-color: #f1a6a0;
    background: var(--danger-bg);
  }

  .copy-list .warn {
    border-color: #f2d28c;
    background: var(--warn-bg);
  }

  .copy-list .good {
    border-color: #9bd9b8;
    background: var(--good-bg);
  }

  .kv {
    display: grid;
    grid-template-columns: minmax(150px, 0.7fr) minmax(0, 1.3fr);
    gap: 8px 12px;
    margin: 0;
  }

  .kv dt {
    color: var(--muted);
    font-weight: 700;
  }

  .kv dd {
    min-width: 0;
    margin: 0;
    word-break: break-word;
  }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
  }

  table {
    width: 100%;
    min-width: 900px;
    border-collapse: collapse;
    background: #fff;
  }

  th,
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--soft-line);
    text-align: left;
    vertical-align: top;
  }

  th {
    color: var(--muted);
    background: #f9fafb;
    font-size: 12px;
    text-transform: uppercase;
  }

  tr:last-child td {
    border-bottom: 0;
  }

  .note {
    margin-top: 12px;
    color: var(--muted);
    font-size: 13px;
  }

  .link-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .link-row a {
    display: inline-flex;
    align-items: center;
    min-height: 30px;
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    font-size: 13px;
  }

  .artifact-grid {
    grid-template-columns: repeat(3, minmax(240px, 1fr));
  }

  .term-grid {
    grid-template-columns: repeat(4, minmax(180px, 1fr));
  }

  .term {
    min-width: 0;
    padding: 12px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .term strong {
    display: block;
    margin-bottom: 5px;
  }

  .artifact {
    min-width: 0;
    padding: 12px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fbfcfe;
  }

  .artifact h3 {
    display: flex;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
  }

  .artifact .path {
    margin-top: 8px;
    color: var(--muted);
    font-size: 12px;
    word-break: break-word;
  }

  .replay-controls {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 10px;
    align-items: end;
    margin-bottom: 16px;
    padding: 12px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #f8fafc;
  }

  .replay-filter {
    min-width: 0;
  }

  .replay-filter.market,
  .replay-filter.date,
  .replay-filter.bet-type,
  .replay-filter.strategy,
  .replay-filter.source {
    grid-column: span 2;
  }

  .replay-filter.event,
  .replay-filter.line {
    grid-column: span 3;
  }

  .replay-controls label {
    display: block;
    margin-bottom: 5px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .replay-controls select {
    width: 100%;
    min-height: 44px;
    padding: 9px 34px 9px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background:
      linear-gradient(45deg, transparent 50%, #627083 50%) calc(100% - 17px) 50% / 6px 6px no-repeat,
      linear-gradient(135deg, #627083 50%, transparent 50%) calc(100% - 12px) 50% / 6px 6px no-repeat,
      #fff;
    color: var(--ink);
    font: inherit;
    font-weight: 650;
    appearance: none;
    box-shadow: 0 1px 2px rgba(29, 36, 48, 0.04);
  }

  .replay-controls select:focus {
    outline: 3px solid #dbeafe;
    border-color: #7aa7e8;
  }

  .replay-controls select:disabled {
    color: #98a2b3;
    background:
      linear-gradient(45deg, transparent 50%, #98a2b3 50%) calc(100% - 17px) 50% / 6px 6px no-repeat,
      linear-gradient(135deg, #98a2b3 50%, transparent 50%) calc(100% - 12px) 50% / 6px 6px no-repeat,
      #f2f4f7;
  }

  .replay-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.68fr) minmax(330px, 0.42fr);
    gap: 18px;
    align-items: stretch;
  }

  .replay-chart-shell {
    min-width: 0;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fff;
    overflow: hidden;
    box-shadow: 0 8px 18px rgba(29, 36, 48, 0.05);
  }

  .chart-toolbar {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    padding: 12px 14px;
    border-bottom: 1px solid var(--soft-line);
    background: #fbfcfe;
  }

  .chart-title {
    min-width: 0;
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chart-source-note {
    flex: 1 1 auto;
    min-width: 120px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: right;
  }

  .replay-player-cards {
    display: none;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--soft-line);
    background: linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%);
    overflow-x: auto;
  }

  .replay-player-cards.active {
    display: flex;
  }

  .pbp-snapshot-card {
    flex: 0 0 280px;
    min-width: 0;
    padding: 10px 11px;
    border: 1px solid #c7d2fe;
    border-radius: 8px;
    background: #f7f8ff;
  }

  .pbp-snapshot-card span {
    display: block;
    color: var(--muted);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0;
    text-transform: uppercase;
  }

  .pbp-snapshot-card strong {
    display: block;
    margin-top: 4px;
    color: var(--text);
    font-size: 13px;
    line-height: 1.25;
  }

  .pbp-snapshot-card small {
    display: block;
    margin-top: 6px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 750;
    line-height: 1.35;
  }

  .team-card {
    flex: 0 0 216px;
    min-width: 0;
    padding: 10px 11px;
    border: 1px solid #dbeafe;
    border-radius: 8px;
    background: #f8fbff;
    color: inherit;
    font: inherit;
    text-align: left;
    appearance: none;
    cursor: pointer;
    transition: border-color 140ms ease, box-shadow 140ms ease, background 140ms ease, opacity 140ms ease;
  }

  .team-card.away {
    border-color: #fed7aa;
    background: #fffaf5;
  }

  .team-card:not(.active) {
    opacity: 0.62;
  }

  .team-card.active {
    border-color: #1f77b4;
    background: #eff6ff;
    box-shadow: inset 0 0 0 1px #1f77b4, 0 6px 18px rgba(31, 119, 180, 0.12);
  }

  .team-card.away.active {
    border-color: #f59e0b;
    background: #fff7ed;
    box-shadow: inset 0 0 0 1px #f59e0b, 0 6px 18px rgba(245, 158, 11, 0.13);
  }

  .team-card-label {
    color: var(--muted);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0;
    text-transform: uppercase;
  }

  .team-card strong {
    display: block;
    margin-top: 4px;
    color: var(--text);
    font-size: 13px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .team-card-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
  }

  .team-card-score {
    color: var(--info);
    font-size: 25px;
    font-weight: 900;
    line-height: 1;
  }

  .team-card-meta {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
  }

  .player-card {
    flex: 0 0 206px;
    min-width: 0;
    padding: 10px 11px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 2px 8px rgba(29, 36, 48, 0.04);
    transition: background 140ms ease, border-color 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
  }

  .player-card.in-play {
    border-color: #86efac;
    background: #f0fdf4;
    box-shadow: inset 0 0 0 1px #bbf7d0, 0 4px 14px rgba(22, 163, 74, 0.08);
  }

  .player-card.off-court {
    border-color: #d1d5db;
    background: #f8fafc;
    color: #64748b;
    opacity: 0.72;
    box-shadow: none;
  }

  .player-card.off-court strong,
  .player-card.off-court .player-card-chip b,
  .player-card.off-court .player-card-main b {
    color: #64748b;
  }

  .player-card strong {
    display: block;
    color: var(--text);
    font-size: 13px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player-card-team {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player-card-main {
    display: flex;
    align-items: baseline;
    gap: 5px;
    margin-top: 7px;
  }

  .player-card-main b {
    color: var(--info);
    font-size: 23px;
    line-height: 1;
  }

  .player-card-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 5px;
    margin-top: 8px;
  }

  .player-card-chip {
    border: 1px solid var(--soft-line);
    border-radius: 6px;
    padding: 5px 6px;
    background: #fbfcfe;
  }

  .player-card-chip b {
    display: block;
    color: var(--text);
    font-size: 12px;
    line-height: 1;
  }

  .player-card-chip span {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 9px;
    font-weight: 900;
    line-height: 1;
    text-transform: uppercase;
  }

  .player-card-main span,
  .player-card-sub {
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .player-card-sub {
    display: block;
    margin-top: 7px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player-card-status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    max-width: 100%;
    margin-top: 8px;
    padding: 4px 7px;
    border-radius: 999px;
    background: #f1f5f9;
    color: #475569;
    font-size: 10px;
    font-weight: 900;
    line-height: 1;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .player-card-status::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: #94a3b8;
  }

  .player-card.in-play .player-card-status {
    background: #dcfce7;
    color: #166534;
  }

  .player-card.in-play .player-card-status::before {
    background: #16a34a;
  }

  .player-card.off-court .player-card-status {
    background: #e5e7eb;
    color: #64748b;
  }

  .player-card.off-court .player-card-status::before {
    background: #9ca3af;
  }

  .window-buttons {
    display: inline-flex;
    flex: 0 0 auto;
    gap: 4px;
    padding: 3px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #f9fafb;
  }

  .window-button {
    min-width: 46px;
    min-height: 30px;
    padding: 4px 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
  }

  .window-button.active {
    background: #fff;
    color: var(--info);
    box-shadow: 0 1px 4px rgba(29, 36, 48, 0.08);
  }

  .replay-chart {
    display: block;
    width: 100%;
    height: 460px;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }

  .replay-chart.dragging {
    cursor: grabbing;
  }

  .replay-chart.scrubbing {
    cursor: ew-resize;
  }

  .pbp-timeline-hit {
    cursor: ew-resize;
  }

  .pbp-timebar-thumb {
    cursor: ew-resize;
  }

  .replay-pbp-panel {
    display: none;
    gap: 12px;
    padding: 10px 12px 12px;
    border-top: 1px solid var(--soft-line);
    background: #fbfcfe;
  }

  .replay-pbp-panel.active {
    display: grid;
    grid-template-columns: minmax(300px, 0.9fr) minmax(320px, 1.1fr);
  }

  .pbp-snapshot-stack {
    display: grid;
    min-width: 0;
    gap: 10px;
  }

  .pbp-state-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .pbp-state-card {
    min-width: 0;
    padding: 9px 10px;
    border: 1px solid var(--soft-line);
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 1px 0 rgba(29, 36, 48, 0.04);
  }

  .pbp-state-card span {
    display: block;
    color: var(--muted);
    font-size: 10px;
    font-weight: 900;
    line-height: 1;
    text-transform: uppercase;
  }

  .pbp-state-card strong {
    display: block;
    margin-top: 6px;
    color: var(--text);
    font-size: 14px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pbp-state-card small {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 750;

function esc(value) {
  return String(value ?? "--")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function clone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function num(value) {
  if (value === null || value === undefined || value === "") return null;
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function fmtInt(value) {
  const n = num(value);
  return n === null ? "--" : Math.round(n).toLocaleString();
}

function fmtPct(value, digits = 2) {
  const n = num(value);
  return n === null ? "--" : `${(n * 100).toFixed(digits)}%`;
}

function fmtPrice(value, digits = 3) {
  const n = num(value);
  return n === null ? "--" : n.toFixed(digits);
}

function fmtUsd(value, digits = 2) {
  const n = num(value);
  if (n === null) return "--";
  return `$${n.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits })}`;
}

function fmtSignedUsd(value, digits = 2) {
  const n = num(value);
  if (n === null) return "--";
  const amount = Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
  return `${n >= 0 ? "+" : "-"}$${amount}`;
}

function fmtSigned(value, digits = 4) {
  const n = num(value);
  if (n === null) return "--";
  return `${n >= 0 ? "+" : ""}${n.toFixed(digits)}`;
}

function fmtProb(value) {
  const n = num(value);
  return n === null ? "--" : n.toFixed(6);
}

function fmtGate(ok, pass = "PASS", fail = "HOLD") {
  return `<span class="pill ${ok ? "good" : "bad"}">${ok ? pass : fail}</span>`;
}

function fmtSize(bytes) {
  const n = num(bytes);
  if (n === null) return "--";
  if (n >= 1024 * 1024) return `${(n / (1024 * 1024)).toFixed(1)} MB`;
  if (n >= 1024) return `${(n / 1024).toFixed(1)} KB`;
  return `${n} B`;
}

function targetRead(targetCol) {
  if (targetCol === "maker_trade_fill_positive") return "realistic fill-profit target";
  if (targetCol === "maker_positive") return "older maker-price target";
  if (targetCol === "lev_positive") return "short-term price-move target";
  return "model target";
}

function summarizeRun(summary) {
  const target = summary.target || {};
  const gates = summary.profit_gates || {};
  const trading = summary.trading || {};
  const val = trading.val || {};
  const test = trading.test || {};
  const currentFillTarget = target.target_col === "maker_trade_fill_positive";
  const abstained = Boolean(summary.selection_abstained) || Number(summary.selected_threshold) > 1;
  let note = "Audit run.";
  if (!currentFillTarget && gates.research_gate) {
    note = "Looks profitable, but it did not use the current fill-profit target.";
  } else if (abstained) {
    note = currentFillTarget ? "Current realistic target; model chose not to trade." : "Older target; model chose not to trade.";
  } else if (gates.research_gate) {
    note = "Research passed, but live money is still blocked.";
  }
  return {
    runId: summary.run_id,
    targetCol: target.target_col,
    featureSet: target.feature_set,
    selectedThreshold: summary.selected_threshold,
    selectionAbstained: abstained,
    valTrades: val.trades,
    valRoi: val.roi,
    valCiLo: val.ci_lo,
    testTrades: test.trades,
    testRoi: test.roi,
    testCiLo: test.ci_lo,
    researchGate: Boolean(gates.research_gate),
    liveCapitalGate: Boolean(gates.live_capital_gate),
    note
  };
}

  if (favoriteLongshotEventReplays) {

        } : null,
        events: (favoriteLongshotEventReplays.events || []).map(event => ({
          ...event,

    }
  }

  applyStrategyBuckets(strategyBuckets);
  applyTakerStrategyValidation(takerStrategyValidation);
  applyPlayByPlaySourcePlan(playByPlaySourcePlan);
  applyMicrostructure(microstructureBuckets);

  if (state.runSummaries.length) {
    const dynamicRuns = state.runSummaries.map(summarizeRun);
    const byRunId = new Map(dynamicRuns.map(run => [run.runId, run]));
    data.modelRuns = data.modelRuns.map(run => byRunId.get(run.runId) || run);
    for (const run of dynamicRuns) {
      if (!data.modelRuns.some(existing => existing.runId === run.runId)) {
        data.modelRuns.push(run);
      }
    }
  }

  return data;

function replayTimeLabel(event, offsetSec) {
  const start = Date.parse(event.series_start_ts);
  const offset = Number(offsetSec);
  if (!Number.isFinite(start) || !Number.isFinite(offset)) return "--";
  return new Date(start + offset * 1000).toLocaleString([], {
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function replayAxisLabel(event, offsetSec, spanSec) {
  const start = Date.parse(event.series_start_ts);
  const offset = Number(offsetSec);
  if (!Number.isFinite(start) || !Number.isFinite(offset)) return "--";
  const date = new Date(start + offset * 1000);
  if (spanSec <= 6 * 3600) {
    return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  return date.toLocaleString([], {
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function shortLabel(value, max = 24) {
  const text = String(value || "--");
  return text.length > max ? `${text.slice(0, Math.max(1, max - 3))}...` : text;
}

function marketLabel(event) {
  const raw = String(
    event?.market_label
    || event?.sport_market
    || event?.sport_family
    || event?.market_type
    || "unknown market"
  ).trim();
  const key = raw.toLowerCase();
  const labels = {
    baseball_mlb: "MLB",
    basketball_nba: "NBA",
    basketball_wnba: "WNBA",
    icehockey_nhl: "NHL",
    americanfootball_nfl: "NFL",
    soccer: "Soccer"
  };
  if (labels[key]) return labels[key];
  return raw
    .replaceAll("_", " ")
    .replaceAll("-", " ")
    .replace(/\b\w/g, letter => letter.toUpperCase());
}

  if (text.includes("batter_home_runs") || question.includes("home runs")) return "Batter home runs";
  if (text.includes("batter_runs_scored") || question.includes("runs scored")) return "Batter runs scored";
  if (text.includes("pitcher_strikeouts") || question.includes("strikeouts")) return "Pitcher strikeouts";
  if (text.includes("pitcher_outs") || question.includes("pitcher outs")) return "Pitcher outs";
  if (text.includes("anytime-td") || question.includes("anytime touchdown")) return "Player touchdown";
  if (slug.includes("nrfi")) return "NRFI";
  if (slug.includes("exact-score")) return "Exact score";
  if (oddsMarket === "spreads" || slug.includes("-spread-")) return "Spread";
  if (oddsMarket === "totals" || slug.includes("-total-") || ["over", "under"].includes(outcome)) return "Game total";
  if (outcome.includes("draw") || slug.endsWith("-draw") || slug.includes("-draw-")) return "Soccer draw";
  return "Moneyline";
}

function replayDateValue(event) {
  const slugDate = replaySlugGameParts(event)?.date;
  if (slugDate) return slugDate;
  const raw = event?.event_date || event?.odds_commence_time || event?.series_start_ts || event?.start_ts || event?.event_end_ts || "";
  const date = new Date(raw);
  if (!Number.isFinite(date.getTime())) return "";
  return date.toISOString().slice(0, 10);
}

function replayDateLabel(event) {
  const value = typeof event === "string" ? event : replayDateValue(event);
  const date = new Date(`${value}T12:00:00Z`);
  if (!Number.isFinite(date.getTime())) return "";
  return date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function replayExperimentLabel(event) {
  return replayGameLabel(event);
}

function formatSlugToken(token, event) {
  const key = String(token || "").toLowerCase();
  const sport = String(event?.sport_family || event?.market_label || "").toLowerCase();
  if (sport.includes("wnba")) {
    return WNBA_TEAM_ABBREVIATIONS[key] || key.toUpperCase();
  }
  if (sport.includes("basketball") || sport === "nba") {
    return NBA_TEAM_ABBREVIATIONS[key] || TEAM_ABBREVIATIONS[key] || key.toUpperCase();
  }
  if (sport.includes("football") || sport === "nfl") {
    const nfl = {
      atl: "Falcons",
      car: "Panthers",
      chi: "Bears",
      cle: "Browns",
      dal: "Cowboys",
      den: "Broncos",
      det: "Lions",
      hou: "Texans",
      ind: "Colts",
      la: "Rams",
      min: "Vikings",
      no: "Saints",
      phi: "Eagles",
      pit: "Steelers",
      sea: "Seahawks",
      was: "Commanders"
    };
    return nfl[key] || TEAM_ABBREVIATIONS[key] || key.toUpperCase();
  }
  if (sport.includes("hockey") || sport === "nhl") {
    const nhl = {
      ana: "Ducks",
      bos: "Bruins",
      car: "Hurricanes",
      chi: "Blackhawks",
      col: "Avalanche",
      dal: "Stars",
      edm: "Oilers",
      fla: "Panthers",
      la: "Kings",
      min: "Wild",
      nj: "Devils",
      nyr: "Rangers",
      tor: "Maple Leafs",
      was: "Capitals"
    };
    return nhl[key] || key.toUpperCase();
  }
  return key.toUpperCase();
}

function replaySlugGameParts(event) {
  const candidates = [
    event?.event_slug,
    event?.telonex_event_slug,
    event?.slug,
    event?.title,
    event?.question
  ].map(value => String(value || "").trim()).filter(Boolean);
  for (const raw of candidates) {
    const match = raw.match(/^([a-z0-9]+)-([a-z0-9]+)-([a-z0-9]+)-(20\d{2}-\d{2}-\d{2})(?:-.+)?$/i);
    if (match) {
      return {
        sport: match[1].toLowerCase(),
        left: match[2].toLowerCase(),
        right: match[3].toLowerCase(),
        date: match[4],
        base: `${match[1].toLowerCase()}-${match[2].toLowerCase()}-${match[3].toLowerCase()}-${match[4]}`
      };
    }
  }
  return null;
}

function replayGameKey(event) {
  const parts = replaySlugGameParts(event);
  if (parts) return parts.base;
  const sport = String(event?.sport_family || event?.market_label || replayMarketValue(event) || "").toLowerCase();
  const date = replayDateValue(event);
  const name = cleanReplayEventName(event).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return [sport, date, name].filter(Boolean).join("||") || String(event?.replay_id || "");
}

function replayGameLabel(event) {
  const parts = replaySlugGameParts(event);
  if (parts) {
    const left = formatSlugToken(parts.left, event);
    const right = formatSlugToken(parts.right, event);
    return `${left} vs ${right}`;
  }
  return cleanReplayEventName(event);
}

function cleanReplayEventName(event) {
  const raw = String(event?.title || event?.question || event?.slug || event?.replay_id || "Game").trim();
  if (!raw) return "Game";
  if (/\s/.test(raw) && !/^[a-z0-9-]+$/i.test(raw)) {
    return raw
      .replace(/\s+-\s+Player Props$/i, "")
      .replace(/\s+-\s+(More Markets|Total Corners|Halftime Result|Exact Score).*$/i, "")
      .replace(/\s+(Spread|Total):.*$/i, "")
      .trim();
  }
  const match = raw.match(/^([a-z0-9]+)-([a-z0-9]+)-([a-z0-9]+)-(\d{4})-(\d{2})-(\d{2})(?:-(.+))?$/i);
  if (!match) return raw.replaceAll("-", " ");
  const left = formatSlugToken(match[2], event);
  const right = formatSlugToken(match[3], event);
  return `${left} vs ${right}`;
}

function replayStrategyValue(event) {
  return PRIMARY_MODEL_STRATEGY;
}

function replayMarketValue(event) {
  return marketLabel(event);
}

function replayBetTypeValue(event) {
  return marketTypeValue(event);
}

function replayEventNameValue(event) {
  return replayGameLabel(event);
}

function formatReplayPoint(value) {
  const raw = String(value ?? "").trim();
  if (!raw || raw.toLowerCase() === "nan") return "";
  return raw.replace(/^(-?\d+)pt(\d+)$/i, "$1.$2");
}

function replayLineValue(event) {
  const explicit = String(event?.line_label || event?.contract_label || "").trim();
  if (explicit) return explicit;
  const question = String(event?.question || "").trim();
  if (question && !/^[a-z0-9-]+$/i.test(question)) {
    const eventName = replayEventNameValue(event);
    const withoutEvent = question
      .replace(eventName, "")
      .replace(/^\s*[:|-]\s*/, "")
      .trim();
    if (withoutEvent && withoutEvent !== question) return withoutEvent;
    if (question.includes(":") || /\b(o\/u|over|under|spread|points|rebounds|assists|strikeouts|touchdown|goals|shots|saves|hits|runs)\b/i.test(question)) {
      return question;
    }
  }
  const outcome = String(event?.outcome || event?.odds_base_outcome || "").trim();
  const point = formatReplayPoint(event?.odds_point);
  const slug = String(event?.slug || "").toLowerCase();
  const suffix = slug.match(/^\w+-\w+-\w+-20\d{2}-\d{2}-\d{2}-(.+)$/i)?.[1] || "";
  if (point && outcome) return `${replayBetTypeValue(event)} ${point} | ${outcome}`;
  if (point) return `${replayBetTypeValue(event)} ${point}`;
  if (suffix.startsWith("total-")) return `Game total ${formatReplayPoint(suffix.slice(6))}`;
  if (suffix.startsWith("spread-")) return `Spread ${formatReplayPoint(suffix.replace(/^spread-(home|away)-/i, ""))}`;
  if (suffix.startsWith("exact-score-")) return `Exact score ${suffix.slice(12).replaceAll("-", "-")}`;
  if (suffix) return suffix.replaceAll("-", " ").replace(/\b\w/g, letter => letter.toUpperCase());
  return outcome || "Primary line";
}

function replayEventIdentity(event) {
  return replayGameKey(event);
}

function replayUniqueEventCount(events) {
  return new Set(events.map(replayEventIdentity).filter(Boolean)).size;
}

function replayOptionCounts(events, valueFn, keyFn = item => item?.replay_id || replayEventIdentity(item)) {
  const counts = new Map();
  events.forEach(item => {
    const value = valueFn(item) || "Unknown";
    if (!counts.has(value)) counts.set(value, new Set());
    counts.get(value).add(keyFn(item) || value);
  });
  return [...counts.entries()].map(([value, keys]) => [value, keys.size]).sort((a, b) => {
    const countDelta = b[1] - a[1];
    return countDelta || a[0].localeCompare(b[0]);
  });
}

function replayFilterMatch(value, selectedValue) {
  return selectedValue === "__all__" || value === selectedValue;
}

function replayEventsForFilters(events) {
  return events.filter(item => (
    replayFilterMatch(replayMarketValue(item), state.selectedReplayMarket)
    && replayFilterMatch(replayStrategyValue(item), state.selectedReplayStrategy)
    && replayFilterMatch(replayBetTypeValue(item), state.selectedReplayBetType)
    && replayFilterMatch(replayDateValue(item), state.selectedReplayDate)
    && replayFilterMatch(replayGameKey(item), state.selectedReplayEventName)
    && (state.selectedReplayEventName === "__all__" || replayFilterMatch(replayLineValue(item), state.selectedReplayLine))
  ));
}

function replayCountText(count, noun = "") {
  const suffix = noun ? ` ${noun}${count === 1 ? "" : "s"}` : "";
  return `${fmtInt(count)}${suffix}`;
}

function renderReplayFilterOptions(select, rows, selectedValue, allLabel, options = {}) {
  const values = rows.map(([value]) => value);
  const includeAll = options.includeAll !== false;
  if (!rows.length) {
    const emptyValue = includeAll ? "__all__" : "__none__";
    select.innerHTML = `<option value="${emptyValue}">${esc(includeAll ? allLabel : `No ${options.noun || "options"}`)}</option>`;
    select.value = emptyValue;
    return emptyValue;
  }
  const active = selectedValue !== "__all__" && values.includes(selectedValue)
    ? selectedValue
    : includeAll
      ? "__all__"
      : values[0];
  const noun = options.noun || "";
  const showCounts = options.showCounts !== false;
  select.innerHTML = [
    ...(includeAll ? [`<option value="__all__">${esc(allLabel)}</option>`] : []),
    ...rows.map(([value, count, display]) => {
      const text = display || value;
      const label = showCounts ? `${text} (${replayCountText(count, noun)})` : text;
      return `<option value="${esc(value)}">${esc(label)}</option>`;
    })
  ].join("");
  select.value = active;
  return active;
}

function replayGameOptionCounts(events) {
  const byKey = new Map();
  events.forEach(item => {
    const key = replayGameKey(item);
    if (!key) return;
    if (!byKey.has(key)) {
      byKey.set(key, {
        key,
        label: replayGameLabel(item),
        date: replayDateValue(item),
        lines: new Set()
      });
    }
    byKey.get(key).lines.add(item?.replay_id || replayLineValue(item));
  });
  const rows = [...byKey.values()];
  const labelCounts = rows.reduce((acc, row) => {
    acc.set(row.label, (acc.get(row.label) || 0) + 1);
    return acc;
  }, new Map());
  return rows
    .map(row => [
      row.key,
      1,
      labelCounts.get(row.label) > 1 && row.date
        ? `${row.label} - ${replayDateLabel(row.date)}`
        : row.label
    ])
    .sort((a, b) => String(a[2]).localeCompare(String(b[2])));
}

function renderReplayDateOptions(select, rows, selectedValue) {
  const values = rows.map(([value]) => value);
  const active = selectedValue !== "__all__" && values.includes(selectedValue) ? selectedValue : "__all__";
  select.innerHTML = [
    `<option value="__all__">All dates</option>`,
    ...rows.map(([value, count]) => `<option value="${esc(value)}">${esc(replayDateLabel(value) || value)} (${replayCountText(count, "game")})</option>`)
  ].join("");
  select.value = active;
  return active;
}

function renderReplayStrategyOptions(select, events, selectedValue) {
  const active = PRIMARY_MODEL_STRATEGY;
  select.innerHTML = [
    `<option value="${esc(PRIMARY_MODEL_STRATEGY)}">${esc(PRIMARY_MODEL_STRATEGY)} (${replayCountText(events.length, "line")})</option>`
  ].join("");
  select.value = active;
  return active;
}

function replaySide(event) {
  const outcome = String(event?.outcome || "").trim();
  const lower = outcome.toLowerCase();
  if (lower === "yes") {
    return { side: "YES", order: "Buy YES", sell: "Sell YES", display: "YES" };
  }
  if (lower === "no") {
    return { side: "NO", order: "Buy NO", sell: "Sell NO", display: "NO" };
  }
  const display = outcome || "selected contract";
  return {
    side: "OUTCOME",
    order: `Buy outcome: ${display}`,
    sell: `Sell outcome: ${display}`,
    display: `Outcome: ${display}`
  };
}

function replayResolution(event) {
  return event?.resolution || event?.fundamental_context?.resolution || {};
}

function replayResolutionLabel(event) {
  const resolution = replayResolution(event);
  if (!resolution || !Object.keys(resolution).length) {
    return event?.resolution_status || "Pending data";
  }
  if (!resolution.available) {
    return resolution.reason ? `Needs ${resolution.reason.replaceAll("_", " ")}` : "Pending data";
  }
  const status = String(resolution.status || "resolved").toUpperCase();
  const point = resolution.point !== undefined && resolution.point !== null
    ? ` @ ${fmtPrice(resolution.point, 1)}`
    : resolution.handicap !== undefined && resolution.handicap !== null
      ? ` ${fmtSigned(resolution.handicap)}`
      : "";
  const final = resolution.final_score ? ` | ${resolution.final_score}` : "";
  return `${status}${point}${final}`;
}

function replayOptionLabel(event) {
  return replayEventNameValue(event);
}

function isEmptyReplayValue(value) {
  return value === null || value === undefined || value === "";
}

function mergeReplayDetailEvent(summaryEvent, detailEvent = {}) {
  const merged = { ...(summaryEvent || {}) };
  Object.entries(detailEvent || {}).forEach(([key, value]) => {
    if (!isEmptyReplayValue(value)) merged[key] = value;
  });
  return merged;
}

function replayChartTitle(event) {
  const name = replayEventNameValue(event);
  const line = replayLineValue(event);
  return line && line !== "Primary line" ? `${name} | ${line}` : name;
}

function replayPricePoints(event) {
  const schema = event.series_schema || [];
  const minuteSchema = schema.includes("selected_mid") && schema.includes("other_mid");
  return (event.series_points || []).map(point => {
    const otherRaw = num(point[2]);
    if (minuteSchema || point.length === 3) {
      return {
        offset: Number(point[0]),
        selected: num(point[1]),
        other: otherRaw
      };
    }
    return {
      offset: Number(point[0]),
      selected: num(point[3]),
      other: null
    };
  }).filter(point => Number.isFinite(point.offset) && point.selected !== null);
}

function sportsbookPricePoints(event) {
  const schema = event.sportsbook_series_schema || [];
  return (event.sportsbook_series_points || []).map(point => {
    const row = { offset: Number(point[0]) };
    schema.slice(1).forEach((name, index) => {
      const value = num(point[index + 1]);
      row[name] = value;
    });
    const sourceKeys = schema.slice(1).filter(name => name !== "Sportsbook consensus");
    const sourceValues = sourceKeys.map(name => row[name]).filter(value => value !== null);
    if (sourceValues.length && Object.prototype.hasOwnProperty.call(row, "Sportsbook consensus")) {
      row["Sportsbook consensus"] = sourceValues.reduce((sum, value) => sum + value, 0) / sourceValues.length;
    }
    return row;
  }).filter(point => Number.isFinite(point.offset));
}

function replayPlayerStats(event, options = {}) {
  const snapshot = options.snapshot === undefined ? replaySelectedPbpSnapshot(event) : options.snapshot;
  if (snapshot?.player_stats) return snapshot.player_stats;
  const pbp = event?.fundamental_context?.play_by_play || {};
  return Array.isArray(pbp.player_stats) ? pbp.player_stats : [];
}

function cleanPbpPlayerName(value) {
  return String(value || "")
    .replace(/[\n\r]+/g, " ")
    .replace(/\s+(?:lost ball|bad pass|out of bounds|traveling|palming|double dribble|lane violation|shot clock turnover|turnover)\b.*$/i, "")
    .replace(/\s+/g, " ")
    .replace(/[.;]\s*$/g, "")
    .trim();
}

function replayTeamNameForSide(event, side) {
  const context = event?.fundamental_context || {};
  const pbpTeams = context?.play_by_play?.teams || {};
  const [nameLeft, nameRight] = replayNameSides(event);
  if (side === "home") return pbpTeams?.home?.name || context.home_team || nameLeft || "";
  if (side === "away") return pbpTeams?.away?.name || context.away_team || nameRight || "";
  return "";
}

function replayPbpFinalPlayerLookup(event) {
  const pbp = event?.fundamental_context?.play_by_play || {};
  const rows = Array.isArray(pbp.player_stats) ? pbp.player_stats : [];
  const lookup = new Map();
  rows.forEach(row => {
    const key = canonicalReplayName(row.player || "");
    if (key) lookup.set(key, row);
  });
  return lookup;
}

function newPbpSnapshotPlayer(event, name, side, finalRow = null) {
  const resolvedSide = String(finalRow?.team_side || side || "").toLowerCase();
  return {
    player: cleanPbpPlayerName(finalRow?.player || name || "Player"),
    team_side: resolvedSide,
    team: finalRow?.team || replayTeamNameForSide(event, resolvedSide) || resolvedSide || "team unknown",
    points: 0,
    field_goals_made: 0,
    field_goals_attempted: 0,
    three_points_made: 0,
    three_points_attempted: 0,
    free_throws_made: 0,
    free_throws_attempted: 0,
    rebounds: 0,
    assists: 0,
    turnovers: 0,
    fouls: 0,
    steals: 0,
    blocks: 0,
    sub_ins: 0,
    sub_outs: 0,
    event_count: 0,
    last_sub_state: "",
    last_sub_period: null,
    last_sub_clock: "",
    last_seen_period: null,
    last_seen_clock: "",
    last_seen_game_seconds: null
  };
}

function ensurePbpSnapshotPlayer(event, stats, finalLookup, name, side = "") {
  const cleanName = cleanPbpPlayerName(name);
  if (!cleanName) return null;
  const key = canonicalReplayName(cleanName);
  if (!key) return null;
  const finalRow = finalLookup.get(key) || null;
  if (!stats.has(key)) {
    stats.set(key, newPbpSnapshotPlayer(event, cleanName, side, finalRow));
  }
  const row = stats.get(key);
  if (!row.team_side && (side || finalRow?.team_side)) {
    row.team_side = String(finalRow?.team_side || side || "").toLowerCase();
  }
  if ((!row.team || row.team === "team unknown") && (finalRow?.team || row.team_side)) {
    row.team = finalRow?.team || replayTeamNameForSide(event, row.team_side) || row.team;
  }
  return row;
}

function touchPbpSnapshotPlayer(row, play) {
  if (!row) return;
  row.event_count = (num(row.event_count) || 0) + 1;
  row.last_seen_period = num(play?.period) ?? row.last_seen_period;
  row.last_seen_clock = play?.clock || row.last_seen_clock;
  row.last_seen_game_seconds = num(play?.game_seconds_elapsed) ?? row.last_seen_game_seconds;
}

function parsePbpSubstitution(play) {
  const match = String(play?.text || "").match(/^\s*(.+?)\s+enters the game for\s+(.+?)\s*$/i);
  if (!match) return null;
  return {
    entering: cleanPbpPlayerName(match[1]),
    exiting: cleanPbpPlayerName(match[2])
  };
}

function parsePbpParentheticalPlayer(text, verb) {
  const pattern = new RegExp(`\\(([^()]+?)\\s+${verb}s?\\)`, "i");
  const match = String(text || "").match(pattern);
  return match ? cleanPbpPlayerName(match[1]) : "";
}

function pbpPlayTeamSide(play) {
  const side = String(play?.possession_side || "").toLowerCase();
  return side === "home" || side === "away" ? side : "";
}

function applyPbpSnapshotPlay(event, play, stats, finalLookup) {
  const type = String(play?.type || "other").toLowerCase().replace(/\s+/g, "_");
  const text = String(play?.text || "");
  const lowerText = text.toLowerCase();
  const side = pbpPlayTeamSide(play);
  const sub = type === "substitution" ? parsePbpSubstitution(play) : null;
  if (sub?.entering || sub?.exiting) {
    const entering = ensurePbpSnapshotPlayer(event, stats, finalLookup, sub.entering, side);
    if (entering) {
      touchPbpSnapshotPlayer(entering, play);
      entering.sub_ins += 1;
      entering.last_sub_state = "in";
      entering.last_sub_period = num(play?.period);
      entering.last_sub_clock = play?.clock || "";
    }
    const exiting = ensurePbpSnapshotPlayer(event, stats, finalLookup, sub.exiting, side);
    if (exiting) {
      touchPbpSnapshotPlayer(exiting, play);
      exiting.sub_outs += 1;
      exiting.last_sub_state = "out";
      exiting.last_sub_period = num(play?.period);
      exiting.last_sub_clock = play?.clock || "";
    }
    return;
  }

  const main = ensurePbpSnapshotPlayer(event, stats, finalLookup, play?.player, side);
  if (main) {
    touchPbpSnapshotPlayer(main, play);
    if (type === "shot") {
      const isThree = /\b(three|3-point|3pt|3 pt)\b/i.test(text);
      const made = /\bmakes?\b/i.test(text);
      const missed = /\bmiss(?:es|ed)?\b/i.test(text);
      if (made || missed) {
        main.field_goals_attempted += 1;
        if (isThree) main.three_points_attempted += 1;
      }
      if (made) {
        main.field_goals_made += 1;
        if (isThree) main.three_points_made += 1;
        main.points += num(play?.score_value) || (isThree ? 3 : 2);
      }
    } else if (type === "free_throw") {
      const made = /\bmakes?\b/i.test(text);
      const missed = /\bmiss(?:es|ed)?\b/i.test(text);
      if (made || missed) main.free_throws_attempted += 1;
      if (made) {
        main.free_throws_made += 1;
        main.points += num(play?.score_value) || 1;
      }
    } else if (type === "rebound") {
      main.rebounds += 1;
    } else if (type === "turnover") {
      main.turnovers += 1;
    } else if (type === "foul") {
      main.fouls += 1;
    }
  }

  const assistName = parsePbpParentheticalPlayer(text, "assist");
  const stealName = parsePbpParentheticalPlayer(text, "steal");
  const blockName = parsePbpParentheticalPlayer(text, "block");
  const helpers = [
    { name: assistName, stat: "assists" },
    { name: stealName, stat: "steals" },
    { name: blockName, stat: "blocks" }
  ];
  helpers.forEach(helper => {
    if (!helper.name) return;
    const row = ensurePbpSnapshotPlayer(event, stats, finalLookup, helper.name, "");
    if (!row) return;
    row[helper.stat] += 1;
    touchPbpSnapshotPlayer(row, play);
  });
}

function parsePbpScore(score) {
  const match = String(score || "").match(/(\d+)\s*-\s*(\d+)/);
  if (!match) return null;
  return { away: Number(match[1]), home: Number(match[2]) };
}

function replayScoreLabel(event, score) {
  if (!score) return "";
  const away = replayTeamNameForSide(event, "away") || "Away";
  const home = replayTeamNameForSide(event, "home") || "Home";
  return `${away} ${fmtInt(score.away)} - ${home} ${fmtInt(score.home)}`;
}

function pbpPlayLabel(play) {
  const parts = [
    play?.period ? `P${fmtInt(play.period)}` : "",
    play?.clock || ""
  ].filter(Boolean);
  return parts.join(" ").trim() || "Selected play";
}

function selectedReplayPbpIndex(event) {
  const timeline = replayPbpTimeline(event);
  const stored = state.selectedReplayPbpById[event?.replay_id];
  if (!Number.isInteger(stored)) return timeline[0]?.index ?? null;
  return timeline.some(play => play.index === stored) ? stored : (timeline[0]?.index ?? null);
}

function replaySelectedPbpSnapshot(event) {
  const selectedIndex = selectedReplayPbpIndex(event);
  if (selectedIndex === null) return null;
  if (!event.__pbpSnapshotCache) event.__pbpSnapshotCache = {};
  if (event.__pbpSnapshotCache[selectedIndex]) return event.__pbpSnapshotCache[selectedIndex];
  const timeline = replayPbpTimeline(event).sort((a, b) => a.index - b.index);
  const selectedPlay = timeline.find(play => play.index === selectedIndex);
  if (!selectedPlay) return null;
  const finalLookup = replayPbpFinalPlayerLookup(event);
  const stats = new Map();
  const teamCounts = { home: 0, away: 0 };
  let lastScore = null;
  timeline.forEach(play => {
    if (play.index > selectedIndex) return;
    const side = pbpPlayTeamSide(play);
    if (side) teamCounts[side] += 1;
    const score = parsePbpScore(play.score);
    if (score) lastScore = score;
    applyPbpSnapshotPlay(event, play, stats, finalLookup);
  });
  const rows = [...stats.values()]
    .filter(row => row.event_count || row.points || row.rebounds || row.assists || row.sub_ins || row.sub_outs)
    .map(row => ({ ...row, snapshot: true }));
  const snapshot = {
    selected_index: selectedIndex,
    play: selectedPlay,
    score: lastScore,
    score_label: replayScoreLabel(event, lastScore),
    player_stats: rows,
    teams: {
      home: { score: lastScore?.home ?? null, event_count: teamCounts.home },
      away: { score: lastScore?.away ?? null, event_count: teamCounts.away }
    }
  };
  event.__pbpSnapshotCache[selectedIndex] = snapshot;
  return snapshot;
}

function nearestAsOfPoint(points, offset) {
  if (!Array.isArray(points) || !points.length || !Number.isFinite(offset)) return null;
  let prior = null;
  let nearest = null;
  points.forEach(point => {
    if (!Number.isFinite(point.offset)) return;
    const distance = Math.abs(point.offset - offset);
    if (!nearest || distance < nearest.distance) nearest = { point, distance };
    if (point.offset <= offset && (!prior || point.offset > prior.offset)) prior = point;
  });
  return prior || nearest?.point || null;
}

function replaySnapshotOdds(event, offset) {
  const poly = nearestAsOfPoint(replayPricePoints(event), offset);
  const book = nearestAsOfPoint(sportsbookPricePoints(event), offset);
  const sourceMode = state.selectedReplayDataSource || "both";
  const bookKeys = sportsbookKeysForMode(event, sourceMode);
  const consensusKey = bookKeys.includes("Sportsbook consensus") ? "Sportsbook consensus" : bookKeys[0];
  return {
    polymarketSelected: poly?.selected ?? null,
    polymarketOther: poly?.other ?? null,
    sportsbookConsensus: book && consensusKey ? book[consensusKey] ?? null : null,
    sportsbookLabel: consensusKey || "",
  };
}

function replayNameSides(event) {
  const name = replayEventNameValue(event);
  for (const sep of [" vs. ", " vs ", " @ "]) {
    if (name.includes(sep)) {
      const parts = name.split(sep);
      return [parts[0]?.trim() || "", parts.slice(1).join(sep).trim()];
    }
  }
  return ["", ""];
}

function replayTeamSummaries(event, snapshot = null) {
  const context = event?.fundamental_context || {};
  const pbpTeams = context?.play_by_play?.teams || {};
  const [nameLeft, nameRight] = replayNameSides(event);
  const homeName = pbpTeams?.home?.name || context.home_team || nameLeft;
  const awayName = pbpTeams?.away?.name || context.away_team || nameRight;
  const homeExpected = num(context?.elo?.home_expected);
  return [
    {
      side: "home",
      label: "Home",
      name: homeName,
      score: num(snapshot?.teams?.home?.score) ?? num(pbpTeams?.home?.score),
      eventCount: num(snapshot?.teams?.home?.event_count) ?? num(pbpTeams?.home?.event_count),
      fair: homeExpected,
      rest: num(context?.elo?.home_rest_days)
    },
    {
      side: "away",
      label: "Away",
      name: awayName,
      score: num(snapshot?.teams?.away?.score) ?? num(pbpTeams?.away?.score),
      eventCount: num(snapshot?.teams?.away?.event_count) ?? num(pbpTeams?.away?.event_count),
      fair: homeExpected === null ? null : 1 - homeExpected,
      rest: num(context?.elo?.away_rest_days)
    }
  ].filter(team => team.name);
}

function canonicalReplayName(value) {
  return String(value || "")
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .replace(/\b(the|fc|sc|club|team)\b/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function replayNamesMatch(left, right) {
  const a = canonicalReplayName(left);
  const b = canonicalReplayName(right);
  if (!a || !b) return false;
  if (a === b || a.includes(b) || b.includes(a)) return true;
  const aLast = a.split(" ").pop();
  const bLast = b.split(" ").pop();
  return Boolean(aLast && bLast && aLast.length > 3 && aLast === bLast);
}

function replayTeamSelectionKey(event) {
  return replayGameKey(event) || String(event?.replay_id || "");
}

function selectedReplayTeamSide(event) {
  const teams = replayTeamSummaries(event);
  const keys = [replayTeamSelectionKey(event), event?.replay_id].filter(Boolean);
  for (const key of keys) {
    const stored = state.selectedReplayTeamSideById[key];
    if (stored && teams.some(team => team.side === stored)) return stored;
  }
  const outcome = event?.outcome || event?.odds_base_outcome || "";
  const matched = teams.find(team => replayNamesMatch(team.name, outcome));
  return (matched || teams[0])?.side || "";
}

function replayTeamForSide(event, side) {
  return replayTeamSummaries(event).find(team => team.side === side) || null;
}

function replayLineKeyForTeam(event, team) {
  if (!team) return "";
  if (replayNamesMatch(team.name, event?.outcome || event?.odds_base_outcome || "")) return "selected";
  if (replayNamesMatch(team.name, event?.other_outcome || event?.odds_other_outcome || "")) return "other";
  return "";
}

function renderReplayTeamCard(team, activeSide) {
  const score = team.score === null ? "--" : fmtInt(team.score);

    team.fair === null ? "" : `${fmtPct(team.fair)} Elo fair`,
    team.rest === null ? "" : `${fmtPrice(team.rest, 1)}d rest`,
    team.eventCount === null ? "" : `${fmtInt(team.eventCount)} plays`
  ].filter(Boolean).join(" | ");
  return `
    <button type="button" class="team-card ${team.side === "away" ? "away" : "home"} ${team.side === activeSide ? "active" : ""}" data-replay-team-side="${esc(team.side)}" title="${esc(team.name)}">
      <span class="team-card-label">${esc(team.label)} team</span>
      <strong>${esc(team.name)}</strong>
      <div class="team-card-row">
        <span class="team-card-score">${esc(score)}</span>
        <span class="team-card-meta">${esc(meta || "team context")}</span>

  `;
}

function replayPlayerCourtState(player) {
  const lastSubState = String(player?.last_sub_state || "").toLowerCase();
  if (lastSubState === "out") {
    return { className: "off-court", label: "Off court", rank: 0 };
  }
  if (lastSubState === "in") {
    return { className: "in-play", label: "On court", rank: 2 };
  }
  if ((num(player?.event_count) || 0) > 0) {
    return { className: "in-play", label: "On court", rank: 2 };
  }
  return { className: "unknown", label: "Tracked", rank: 1 };
}

function renderReplayPlayerCards(event) {
  const target = $("replay-player-cards");
  if (!target) return;
  const snapshot = replaySelectedPbpSnapshot(event);

    const playerSide = String(player.team_side || "").toLowerCase();

  });
  if (!rows.length) rows = allRows;
  rows = [...rows]
    .sort((a, b) => (
      replayPlayerCourtState(b).rank - replayPlayerCourtState(a).rank
      || (num(b.points) || 0) - (num(a.points) || 0)
      || ((num(b.rebounds) || 0) + (num(b.assists) || 0)) - ((num(a.rebounds) || 0) + (num(a.assists) || 0))
      || (num(b.event_count) || 0) - (num(a.event_count) || 0)
      || (num(b.sub_ins) || 0) - (num(a.sub_ins) || 0)
    ))
    .slice(0, 8);

  const teamCards = teams.map(team => renderReplayTeamCard(team, selectedSide)).join("");
  const snapshotCard = snapshot ? `

      <strong>${esc(pbpPlayLabel(snapshot.play))}${snapshot.score_label ? ` | ${esc(snapshot.score_label)}` : ""}</strong>

  const playerCards = rows.map(player => {

    return `

        <div class="player-card-grid">
          <span class="player-card-chip"><b>${fmtInt(player.rebounds || 0)}</b><span>REB</span></span>
          <span class="player-card-chip"><b>${fmtInt(player.assists || 0)}</b><span>AST</span></span>
          <span class="player-card-chip"><b>${made}/${attempted}</b><span>FG</span></span>
        </div>
        <span class="player-card-sub">${fmtInt(player.steals || 0)} STL | ${fmtInt(player.blocks || 0)} BLK | ${fmtInt(player.fouls || 0)} PF</span>
        <span class="player-card-status">${esc(courtState.label)}</span>
      </div>
    `;
  }).join("");
  target.innerHTML = teamCards + snapshotCard + playerCards;
}

function replayClockSeconds(clock) {
  const match = String(clock || "").trim().match(/^(\d+):(\d{2})$/);
  if (!match) return null;
  return Number(match[1]) * 60 + Number(match[2]);
}

function replayPbpFallbackOffset(event, play, timeline) {
  const elapsed = num(play?.game_seconds_elapsed)
    ?? ((num(play?.period) && replayClockSeconds(play?.clock) !== null)
      ? ((num(play.period) - 1) * 600 + (600 - replayClockSeconds(play.clock)))
      : null);
  if (elapsed === null) return null;
  const tipOffset = replayOffsetFromIso(event, event?.event_end_ts) ?? 0;
  const finalOffset = replayOffsetFromIso(event, event?.final_ts);
  const maxElapsed = Math.max(
    2400,
    ...timeline.map(row => num(row?.game_seconds_elapsed)).filter(value => value !== null)
  );
  const scale = finalOffset && finalOffset > tipOffset
    ? Math.max(1, (finalOffset - tipOffset) / Math.max(1, maxElapsed))
    : 2.25;
  return tipOffset + elapsed * scale;
}

function replayPbpTimeline(event) {
  const pbp = event?.fundamental_context?.play_by_play || {};
  const source = Array.isArray(pbp.timeline) && pbp.timeline.length
    ? pbp.timeline
    : Array.isArray(pbp.sample) ? pbp.sample : [];
  if (event?.__pbpTimelineCache?.source === source) {
    return event.__pbpTimelineCache.rows;
  }
  const rows = source.map((play, index) => {
    const wallclockOffset = replayOffsetFromIso(event, play?.wallclock);
    const offset = wallclockOffset ?? replayPbpFallbackOffset(event, play, source);
    const type = String(play?.type || "other").toLowerCase().replace(/\s+/g, "_");
    return {
      ...play,
      index,
      offset,
      type: type || "other"
    };
  }).filter(play => Number.isFinite(play.offset));
  if (event) {
    event.__pbpTimelineCache = { source, rows };
  }
  return rows;
}

function pbpTypeLabel(type) {
  const labels = {
    shot: "Shots",
    free_throw: "Free throws",
    turnover: "Turnovers",
    foul: "Fouls",
    rebound: "Rebounds",
    substitution: "Subs",
    timeout: "Timeouts",
    jump_ball: "Jump balls",
    other: "Other plays"
  };
  return labels[type] || String(type || "other").replaceAll("_", " ");
}

function pbpTypeColor(type) {
  const colors = {
    shot: "#0ea5e9",
    free_throw: "#2563eb",
    turnover: "#f97316",
    foul: "#dc2626",
    rebound: "#16a34a",
    substitution: "#7c3aed",
    timeout: "#64748b",
    jump_ball: "#a16207",
    other: "#94a3b8"
  };
  return colors[type] || colors.other;
}

function pbpTypeLane(type) {
  const lanes = {
    shot: 0,
    free_throw: 1,
    turnover: 2,
    foul: 3,
    rebound: 4,
    substitution: 5,
    timeout: 6,
    jump_ball: 7,
    other: 8
  };
  return lanes[type] ?? lanes.other;
}

function pbpIsScoring(play) {
  const scoreValue = num(play?.score_value) || 0;
  return Boolean(play?.scoring_play || scoreValue > 0);
}

function compactPbpDots(visible, maxDots) {
  if (visible.length <= maxDots) return visible;
  const scoring = visible.filter(pbpIsScoring);
  const nonScoring = visible.filter(play => !pbpIsScoring(play));
  const scoringLimit = Math.min(scoring.length, Math.max(Math.floor(maxDots * 0.58), maxDots - nonScoring.length));
  const selected = scoring.length > scoringLimit
    ? scoring.filter((_, index) => index % Math.ceil(scoring.length / Math.max(1, scoringLimit)) === 0).slice(0, scoringLimit)
    : scoring;
  const remaining = Math.max(0, maxDots - selected.length);
  const sampledNonScoring = nonScoring.length > remaining
    ? nonScoring.filter((_, index) => index % Math.ceil(nonScoring.length / Math.max(1, remaining)) === 0).slice(0, remaining)
    : nonScoring;
  return [...selected, ...sampledNonScoring].sort((a, b) => a.offset - b.offset || a.index - b.index);
}

function replayPbpOverlay(event, bounds, sx, pad, plotH, options = {}) {
  const timeline = replayPbpTimeline(event)
    .filter(play => Number.isFinite(play.offset))
    .sort((a, b) => a.offset - b.offset || a.index - b.index);
  if (!timeline.length) {
    return { count: 0, renderedCount: 0, band: "", svg: "", legendItems: [], points: [] };
  }
  const selectedIndex = selectedReplayPbpIndex(event);
  const selectedPlay = selectedIndex === null ? timeline[0] : (timeline.find(play => play.index === selectedIndex) || timeline[0]);
  const selectedPosition = Math.max(0, timeline.findIndex(play => play.index === selectedPlay.index));
  const laneY = Number.isFinite(options.laneY) ? options.laneY : pad.top + plotH + 34;
  const bandHeight = Number.isFinite(options.laneHeight) ? options.laneHeight : 58;
  const bandY = laneY - bandHeight / 2;
  const barMinX = Math.min(...timeline.map(play => play.offset));
  const barMaxX = Math.max(...timeline.map(play => play.offset));
  const barSpan = Math.max(1, barMaxX - barMinX);
  const timelineX = value => pad.left + ((value - barMinX) / barSpan) * (sx(bounds.maxX) - sx(bounds.minX));
  const bandW = Math.max(1, sx(bounds.maxX) - sx(bounds.minX));
  const selectedX = Math.max(pad.left, Math.min(pad.left + bandW, timelineX(selectedPlay.offset)));
  const pbpPoints = timeline.map((play, position) => ({
    index: play.index,
    position,
    offset: play.offset,
    x: Math.max(pad.left, Math.min(pad.left + bandW, timelineX(play.offset))),
    y: laneY
  }));
  const periodTicks = [];
  const seenPeriods = new Set();
  timeline.forEach(play => {
    const period = num(play.period);
    if (!period || seenPeriods.has(period)) return;
    seenPeriods.add(period);
    const x = Math.max(pad.left, Math.min(pad.left + bandW, timelineX(play.offset)));
    periodTicks.push(`
      <line x1="${x.toFixed(1)}" y1="${(laneY - 9).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(laneY + 9).toFixed(1)}" stroke="#94a3b8" stroke-width="1.1" opacity="0.65" pointer-events="none" />
      <text x="${x.toFixed(1)}" y="${(bandY + 15).toFixed(1)}" text-anchor="middle" fill="#64748b" font-size="10" font-weight="800" pointer-events="none">Q${fmtInt(period)}</text>
    `);
  });
  const labelW = 230;
  const labelX = Math.max(pad.left + 6, Math.min(pad.left + bandW - labelW - 6, selectedX - labelW / 2));
  const labelY = bandY + bandHeight - 20;
  const selectedLabel = `${pbpPlayLabel(selectedPlay)}${selectedPlay.score ? ` | ${selectedPlay.score}` : ""}`;
  return {
    count: timeline.length,
    renderedCount: 1,
    band: `
      <rect x="${pad.left}" y="${bandY.toFixed(1)}" width="${bandW.toFixed(1)}" height="${bandHeight.toFixed(1)}" rx="8" fill="#f8fafc" opacity="0.9" pointer-events="none" />
      <line x1="${pad.left}" y1="${laneY.toFixed(1)}" x2="${(pad.left + bandW).toFixed(1)}" y2="${laneY.toFixed(1)}" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" pointer-events="none" />
      <line class="pbp-timebar-progress" x1="${pad.left}" y1="${laneY.toFixed(1)}" x2="${selectedX.toFixed(1)}" y2="${laneY.toFixed(1)}" stroke="#2563eb" stroke-width="7" stroke-linecap="round" pointer-events="none" />
      ${periodTicks.join("")}
      <line class="pbp-timebar-cursor" x1="${selectedX.toFixed(1)}" y1="${(bandY + 7).toFixed(1)}" x2="${selectedX.toFixed(1)}" y2="${(bandY + bandHeight - 7).toFixed(1)}" stroke="#111827" stroke-width="1.6" opacity="0.62" pointer-events="none" />
      <circle class="pbp-timebar-thumb" cx="${selectedX.toFixed(1)}" cy="${laneY.toFixed(1)}" r="9" fill="#fff" stroke="#111827" stroke-width="3" pointer-events="none" />
      <text x="${(pad.left + 8).toFixed(1)}" y="${(bandY + 15).toFixed(1)}" fill="#627083" font-size="11" font-weight="800">Game time</text>
      <rect class="pbp-selected-label-bg" x="${labelX.toFixed(1)}" y="${labelY.toFixed(1)}" width="${labelW}" height="17" rx="8.5" fill="#111827" opacity="0.88" pointer-events="none" />
      <text class="pbp-selected-label-text" x="${(labelX + 10).toFixed(1)}" y="${(labelY + 12).toFixed(1)}" fill="#fff" font-size="10.5" font-weight="850" pointer-events="none">${esc(shortLabel(selectedLabel, 34))}</text>
    `,
    svg: `<g class="pbp-event-dots" data-pbp-timeline="1" role="slider" tabindex="0" aria-label="Game time snapshot" aria-valuemin="0" aria-valuemax="${Math.max(0, timeline.length - 1)}" aria-valuenow="${selectedPosition}" aria-valuetext="${esc(selectedLabel)}">
      <rect class="pbp-timeline-hit" x="${pad.left}" y="${bandY.toFixed(1)}" width="${bandW.toFixed(1)}" height="${bandHeight.toFixed(1)}" fill="transparent" pointer-events="all" />
    </g>`,
    legendItems: [{ label: "Game time snapshot", color: "#2563eb", opacity: 0.95 }],
    points: pbpPoints,
    timeline,
    lane: { padLeft: pad.left, bandW, laneY, bandY, bandHeight, labelW, labelY, barMinX, barSpan }
  };
}

function pbpOverlayNote(overlay) {
  if (!overlay?.count) return "";
  return `${fmtInt(overlay.count)} PBP plays on game time bar`;
}

function replayHasSportsbook(event) {
  return sportsbookPricePoints(event).some(point =>
    (event.sportsbook_series_schema || []).slice(1).some(name => point[name] !== null)
  );
}

function replayHasPolymarket(event) {
  return replayPricePoints(event).length > 0;
}

function replayDataSourceOptions(event) {
  const hasSportsbook = replayHasSportsbook(event);
  const hasPolymarket = replayHasPolymarket(event);
  const hasPbp = replayPbpTimeline(event).length > 0;
  const sportsbookPointCount = event?.sportsbook_series_point_count ?? (event?.sportsbook_series_points || []).length;
  const sourceCount = Math.max(0, (event?.sportsbook_series_schema || []).length - 1);
  if (!hasSportsbook && !hasPolymarket && hasPbp) {
    return [{ value: "pbp", label: "Play-by-play only", enabled: true }];
  }
  return [
    { value: "both", label: hasSportsbook ? `CLOB + sportsbook sources (${fmtInt(sportsbookPointCount)} snapshots)` : "CLOB + sportsbook sources", enabled: hasSportsbook && hasPolymarket },
    { value: "polymarket", label: "Polymarket CLOB", enabled: hasPolymarket },
    { value: "sportsbooks", label: hasSportsbook ? `Sportsbook sources (${fmtInt(sourceCount)})` : "Sportsbook sources", enabled: hasSportsbook },
  ];
}

function sportsbookSourceKeys(event) {
  return (event.sportsbook_series_schema || []).slice(1);

function selectedSportsbookSourceSet(event) {
  const keys = sportsbookSourceKeys(event);
  if (!event?.replay_id || !keys.length) return new Set(keys);
  if (!state.selectedSportsbookSourcesById[event.replay_id]) {
    state.selectedSportsbookSourcesById[event.replay_id] = keys.slice();
  }
  const selected = new Set(state.selectedSportsbookSourcesById[event.replay_id].filter(key => keys.includes(key)));
  if (!selected.size) {
    const fallback = keys.includes("Sportsbook consensus") ? "Sportsbook consensus" : keys[0];
    selected.add(fallback);
    state.selectedSportsbookSourcesById[event.replay_id] = [fallback];
  }
  return selected;
}

function sportsbookKeysForMode(event, sourceMode) {
  const schemaKeys = (event.sportsbook_series_schema || []).slice(1);
  if (!schemaKeys.length) return [];
  if (!["sportsbooks", "both"].includes(sourceMode)) return [];

function renderSportsbookSourceToggles(event) {

function renderChartLegend(items = []) {

      <span>${esc(item.label)}</span>
